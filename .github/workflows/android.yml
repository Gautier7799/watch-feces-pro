        cat << 'EOF' > wear/src/main/java/com/example/wear/WearMainActivity.kt
        package com.example.wear

        import android.Manifest
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.material3.Text
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.core.app.ActivityCompat
        import kotlinx.coroutines.delay
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class WearMainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                    setShowWhenLocked(true)
                    setTurnScreenOn(true)
                }
                window.addFlags(
                    WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                    WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON or
                    WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                )

                if (checkSelfPermission(Manifest.permission.BODY_SENSORS) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.BODY_SENSORS), 101)
                }

                setContent {
                    WearSwitchableWatchFaces()
                }
            }
        }

        @Composable
        fun WearSwitchableWatchFaces() {
            // بالضغط على الشاشة يتم التبديل بين الواجهات الأربع
            var currentFace by remember { mutableStateOf(0) }
            var isAod by remember { mutableStateOf(false) }

            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f

                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(
                modifier = Modifier
                    .fillMaxSize()
                    .clip(CircleShape)
                    .background(Color.Black)
                    .clickable {
                        // ضغطة للتبديل الفوري بين الواجهات الأربع!
                        currentFace = (currentFace + 1) % 4
                    },
                contentAlignment = Alignment.Center
            ) {
                Canvas(modifier = Modifier.fillMaxSize()) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    when (currentFace) {
                        0 -> { // 1. Pixel Triple Chrono
                            drawArc(Color(0xFF5DD996), 140f, 75f * 0.84f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFF64B5F6), 325f, 75f * 0.70f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFFFF8A80), 220f, 70f * 0.75f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))

                            val subR = r * 0.23f
                            listOf(Offset(center.x - r * 0.50f, center.y), Offset(center.x + r * 0.50f, center.y), Offset(center.x, center.y + r * 0.48f)).forEach { sub ->
                                drawCircle(Color(0xFF1B1E22), radius = subR, center = sub)
                                drawCircle(Color(0xFF33383F), radius = subR, center = sub, style = Stroke(1.dp.toPx()))
                            }

                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), 2.5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(minRad) * r * 0.72f).toFloat(), (center.y + sin(minRad) * r * 0.72f).toFloat()), 2.dp.toPx(), StrokeCap.Round)

                            val secRad = Math.toRadians((secondAngle - 90.0))
                            drawLine(Color(0xFFFF3D00), center, Offset((center.x + cos(secRad) * r * 0.86f).toFloat(), (center.y + sin(secRad) * r * 0.86f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                        }
                        1 -> { // 2. Chrono Peach Active
                            drawArc(Color(0xFFFF8A65), 130f, 90f * 0.83f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(6.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFF5D4037), 320f, 90f * 0.61f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(6.dp.toPx(), cap = StrokeCap.Round))
                            drawCircle(Color.White.copy(alpha = 0.1f), radius = r * 0.55f, center = center, style = Stroke(1.dp.toPx()))

                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color(0xFFFFE0B2), center, Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat()), 7.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.76f).toFloat(), (center.y + sin(minRad) * r * 0.76f).toFloat()), 5.dp.toPx(), StrokeCap.Round)

                            val secRad = Math.toRadians((secondAngle - 90.0))
                            drawLine(Color(0xFFFF7043), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.2.dp.toPx(), StrokeCap.Round)
                        }
                        2 -> { // 3. Kinetic Neon Sphere
                            for (i in 0 until 40) {
                                val angle = i * 9.0
                                val rad = Math.toRadians(angle)
                                val dist = (r * 0.25f) + (i % 8) * (r * 0.08f)
                                val p = Offset((center.x + cos(rad) * dist).toFloat(), (center.y + sin(rad) * dist).toFloat())
                                drawCircle(Color.White.copy(alpha = 0.55f), radius = 2.5.dp.toPx(), center = p)
                            }
                            drawCircle(Color(0xFF132F20), radius = r * 0.24f, center = Offset(center.x, center.y + r * 0.55f))

                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(minRad) * r * 0.72f).toFloat(), (center.y + sin(minRad) * r * 0.72f).toFloat()), 2.dp.toPx(), StrokeCap.Round)

                            val secRad = Math.toRadians((secondAngle - 90.0))
                            drawLine(Color(0xFF00E676), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.5.dp.toPx(), StrokeCap.Round)
                            drawCircle(Color(0xFF00E676), radius = 4.dp.toPx(), center = center)
                        }
                        else -> { // 4. Viking Runes
                            val norseRed = Color(0xFFFF3D00)
                            drawCircle(norseRed.copy(alpha = 0.5f), radius = r * 0.28f, center = center, style = Stroke(1.5.dp.toPx()))
                            for (i in 0 until 8) {
                                val rad = Math.toRadians((i * 45.0) - 90.0)
                                drawLine(norseRed, center, Offset((center.x + cos(rad) * r * 0.88f).toFloat(), (center.y + sin(rad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            }
                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color(0xFFFF8A65), center, Offset((center.x + cos(minRad) * r * 0.76f).toFloat(), (center.y + sin(minRad) * r * 0.76f).toFloat()), 4.dp.toPx(), StrokeCap.Round)
                            val secRad = Math.toRadians((secondAngle - 90.0))
                            drawLine(norseRed, center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                        }
                    }
                }

                // نصوص وتفاصيل الواجهات
                when (currentFace) {
                    1 -> {
                        Column(modifier = Modifier.fillMaxSize().padding(top = 28.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                            Text("08-24", color = Color(0xFFFF8A65), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                            Text("12:15:33 AM", color = Color(0xFFFF8A65), fontSize = 10.sp, fontWeight = FontWeight.SemiBold)
                        }
                    }
                    2 -> {
                        Column(modifier = Modifier.fillMaxSize().padding(bottom = 18.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Bottom) {
                            Text("MON", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                            Text("61°", color = Color.White.copy(alpha = 0.8f), fontSize = 10.sp)
                        }
                    }
                    else -> {
                        Text("5 FEB", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.TopCenter).padding(top = 26.dp))
                    }
                }
            }
        }
        EOF

    - name: Build Both Debug APKs
      run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk dist/PixelWatch-Phone.apk
        cp wear/build/outputs/apk/debug/*.apk dist/PixelWatch-WearOS.apk

    - name: Upload Both APKs
      uses: actions/upload-artifact@v4
      with:
        name: PixelWatch-AllFourFaces
        path: dist/*.apk
