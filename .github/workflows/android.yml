    - name: Build Both Debug APKs
      run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk dist/PixelWatch-Phone.apk
        cp wear/build/outputs/apk/debug/*.apk dist/PixelWatch-WearOS.apk

    - name: Upload Both APKs
      uses: actions/upload-artifact@v4
      with:
        name: PixelWatch-FullControls
        path: dist/*.apk
