        @Composable
        fun DigitalFaceScreen(
            fontSize: Int,
            fontWeight: FontWeight,
            fontFamily: String,
            showSeconds: Boolean,
            showAmPm: Boolean,
            dateFormat: String,
            badgeShape: Int,
            badgeOpacity: Float,
            displayStyle: String,
            widget1: WidgetType?,
            widget2: WidgetType?,
            dateOffset: Offset,
            onDateOffsetChange: (Offset) -> Unit,
            widget1Offset: Offset,
            onWidget1OffsetChange: (Offset) -> Unit,
            widget2Offset: Offset,
            onWidget2OffsetChange: (Offset) -> Unit,
            onDragStateChange: (Boolean) -> Unit
        ) {
            var timeString by remember { mutableStateOf("10:08") }
            var secString by remember { mutableStateOf("00") }
            var amPmString by remember { mutableStateOf("AM") }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    timeString = String.format("%02d:%02d", cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE))
                    secString = String.format("%02d", cal.get(Calendar.SECOND))
                    amPmString = if (cal.get(Calendar.AM_PM) == Calendar.AM) "AM" else "PM"
                    delay(500)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                // التاريخ قابل للسحب الحر
                if (dateFormat != "-") {
                    UniversalDraggableItem(
                        offsetDp = dateOffset,
                        onOffsetChange = onDateOffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        Text(dateFormat, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // الوقت الرقمي
                Row(
                    verticalAlignment = Alignment.CenterVertically,
                    horizontalArrangement = Arrangement.Center,
                    modifier = Modifier.padding(horizontal = 8.dp)
                ) {
                    Text(
                        timeString,
                        color = Color.White,
                        fontSize = (fontSize * 0.52f).sp,
                        fontWeight = fontWeight,
                        fontFamily = when (fontFamily) {
                            "Roboto" -> FontFamily.SansSerif
                            else -> FontFamily.Default
                        }
                    )

                    if (showSeconds || showAmPm) {
                        Column(modifier = Modifier.padding(start = 4.dp)) {
                            if (showSeconds) Text(secString, color = Color(0xFF98D7A5), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                            if (showAmPm) Text(amPmString, color = Color.LightGray, fontSize = 11.sp)
                        }
                    }
                }

                // الودجة الأولى
                if (widget1 != null) {
                    UniversalDraggableItem(
                        offsetDp = widget1Offset,
                        onOffsetChange = onWidget1OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderWidgetContent(widget1, displayStyle)
                    }
                }

                // الودجة الثانية
                if (widget2 != null) {
                    UniversalDraggableItem(
                        offsetDp = widget2Offset,
                        onOffsetChange = onWidget2OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderWidgetContent(widget2, displayStyle)
                    }
                }
            }
        }

        @Composable
        fun AnalogFaceScreen(
            isAod: Boolean,
            dateFormat: String,
            badgeShape: Int,
            badgeOpacity: Float,
            displayStyle: String,
            showSeconds: Boolean,
            widget1: WidgetType?,
            widget2: WidgetType?,
            dateOffset: Offset,
            onDateOffsetChange: (Offset) -> Unit,
            widget1Offset: Offset,
            onWidget1OffsetChange: (Offset) -> Unit,
            widget2Offset: Offset,
            onWidget2OffsetChange: (Offset) -> Unit,
            onDragStateChange: (Boolean) -> Unit
        ) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                // رسم مؤشرات وعقارب الساعة
                Canvas(modifier = Modifier.fillMaxSize(0.92f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    for (i in 0 until 12) {
                        val rad = Math.toRadians((i * 30.0) - 90.0)
                        val p1 = Offset((center.x + cos(rad) * r * 0.84f).toFloat(), (center.y + sin(rad) * r * 0.84f).toFloat())
                        val p2 = Offset((center.x + cos(rad) * r * 0.98f).toFloat(), (center.y + sin(rad) * r * 0.98f).toFloat())
                        drawLine(
                            color = if (i % 3 == 0) Color.White else Color.White.copy(alpha = 0.5f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    val hourEnd = Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat())
                    drawLine(Color.White, center, hourEnd, strokeWidth = 6.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)

                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    val minEnd = Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat())
                    drawLine(Color.White, center, minEnd, strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(minRad) * r * 0.70f).toFloat(), (center.y + sin(minRad) * r * 0.70f).toFloat()), strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)

                    if (!isAod && showSeconds) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        val secEnd = Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat())
                        drawLine(Color(0xFFFF80AB), center, secEnd, strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)
                        drawCircle(Color(0xFFFF80AB), radius = 3.5.dp.toPx(), center = Offset((center.x + cos(secRad) * r * 0.42f).toFloat(), (center.y + sin(secRad) * r * 0.42f).toFloat()))
                    }

                    drawCircle(Color(0xFFFF80AB), radius = 5.dp.toPx(), center = center)
                    drawCircle(Color.White, radius = 2.5.dp.toPx(), center = center)
                }

                // التاريخ قابل للسحب الحر
                if (dateFormat != "-") {
                    UniversalDraggableItem(
                        offsetDp = dateOffset,
                        onOffsetChange = onDateOffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        Text(dateFormat, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // الودجة الأولى قابلة للسحب الحر
                if (widget1 != null) {
                    UniversalDraggableItem(
                        offsetDp = widget1Offset,
                        onOffsetChange = onWidget1OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderWidgetContent(widget1, displayStyle)
                    }
                }

                // الودجة الثانية قابلة للسحب الحر
                if (widget2 != null) {
                    UniversalDraggableItem(
                        offsetDp = widget2Offset,
                        onOffsetChange = onWidget2OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderWidgetContent(widget2, displayStyle)
                    }
                }
            }
        }

        @Composable
        fun RenderWidgetContent(widget: WidgetType, displayStyle: String) {
            val icon = when (widget) {
                WidgetType.BATTERY -> Icons.Default.BatteryChargingFull
                WidgetType.STEPS -> Icons.Default.DirectionsWalk
                WidgetType.HEART_RATE -> Icons.Default.Favorite
                WidgetType.WEATHER -> Icons.Default.WbSunny
                WidgetType.CALENDAR -> Icons.Default.CalendarToday
            }

            when (displayStyle) {
                "Arc" -> {
                    Box(contentAlignment = Alignment.Center, modifier = Modifier.size(46.dp)) {
                        Canvas(modifier = Modifier.fillMaxSize()) {
                            drawArc(
                                color = Color(0xFF98D7A5),
                                startAngle = -90f,
                                sweepAngle = 260f,
                                useCenter = false,
                                style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round)
                            )
                        }
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(16.dp))
                    }
                }
                "Icon +" -> {
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Box(modifier = Modifier.size(6.dp).clip(CircleShape).background(Color(0xFF98D7A5)))
                    }
                }
                "Text" -> {
                    Text(widget.defaultText, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                }
                else -> { // Icon + %
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(16.dp))
                        Spacer(modifier = Modifier.width(4.dp))
                        Text(widget.defaultText, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }

        // مكوّن السحب باللمس الحقيقي مع تحويل الـ DP الدقيق ومنع استيلاء السكرول
        @Composable
        fun UniversalDraggableItem(
            offsetDp: Offset,
            onOffsetChange: (Offset) -> Unit,
            badgeShape: Int,
            opacity: Float,
            onDragStateChange: (Boolean) -> Unit,
            content: @Composable () -> Unit
        ) {
            val density = LocalDensity.current
            val currentOffset by rememberUpdatedState(offsetDp)

            Box(
                modifier = Modifier
                    .offset {
                        IntOffset(
                            (offsetDp.x * density.density).roundToInt(),
                            (offsetDp.y * density.density).roundToInt()
                        )
                    }
                    .pointerInput(Unit) {
                        detectDragGestures(
                            onDragStart = { onDragStateChange(true) },
                            onDragEnd = { onDragStateChange(false) },
                            onDragCancel = { onDragStateChange(false) }
                        ) { change, dragAmount ->
                            change.consume()
                            val dxDp = dragAmount.x / density.density
                            val dyDp = dragAmount.y / density.density
                            val nx = (currentOffset.x + dxDp).coerceIn(-120f, 120f)
                            val ny = (currentOffset.y + dyDp).coerceIn(-120f, 120f)
                            onOffsetChange(Offset(nx, ny))
                        }
                    }
                    .clip(RoundedCornerShape(12.dp))
                    .background(Color.White.copy(alpha = opacity * 0.35f))
                    .border(1.dp, Color(0xFF98D7A5), RoundedCornerShape(12.dp))
                    .padding(horizontal = 10.dp, vertical = 6.dp),
                contentAlignment = Alignment.Center
            ) {
                content()
            }
        }

        @Composable
        fun ShapeRenderer(shapeIndex: Int, color: Color) {
            Canvas(modifier = Modifier.fillMaxSize()) {
                val center = Offset(size.width / 2f, size.height / 2f)
                val r = size.minDimension / 2f
                when (shapeIndex) {
                    0 -> drawRoundRect(color, topLeft = Offset(r * 0.15f, r * 0.15f), size = Size(r * 1.7f, r * 1.7f), cornerRadius = CornerRadius(r * 0.45f, r * 0.45f))
                    1 -> {
                        for (i in 0 until 12) {
                            val rad = Math.toRadians(i * 30.0)
                            drawCircle(color, radius = r * 0.38f, center = Offset((center.x + cos(rad) * r * 0.55f).toFloat(), (center.y + sin(rad) * r * 0.55f).toFloat()))
                        }
                        drawCircle(color, radius = r * 0.65f, center = center)
                    }
                    2 -> {
                        for (i in 0 until 4) {
                            val rad = Math.toRadians(i * 90.0)
                            drawCircle(color, radius = r * 0.52f, center = Offset((center.x + cos(rad) * r * 0.45f).toFloat(), (center.y + sin(rad) * r * 0.45f).toFloat()))
                        }
                    }
                    3 -> {
                        for (i in 0 until 8) {
                            val rad = Math.toRadians(i * 45.0)
                            drawCircle(color, radius = r * 0.42f, center = Offset((center.x + cos(rad) * r * 0.50f).toFloat(), (center.y + sin(rad) * r * 0.50f).toFloat()))
                        }
                    }
                    4 -> {
                        val path = Path()
                        for (i in 0 until 6) {
                            val rad = Math.toRadians(i * 60.0 - 30.0)
                            val x = (center.x + cos(rad) * r * 0.9f).toFloat()
                            val y = (center.y + sin(rad) * r * 0.9f).toFloat()
                            if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                        }
                        path.close()
                        drawPath(path, color)
                    }
                    5 -> {
                        drawArc(color, 180f, 180f, true, Offset(r * 0.2f, r * 0.1f), Size(r * 1.6f, r * 1.4f))
                        drawRect(color, topLeft = Offset(r * 0.2f, r * 0.8f), size = Size(r * 1.6f, r * 0.9f))
                    }
                    else -> {
                        drawCircle(color, radius = r * 0.88f, center = center)
                    }
                }
            }
        }
        EOF

    - name: Build Phone App APK Only
      run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Upload Phone APK Only
      uses: actions/upload-artifact@v4
      with:
        name: PhoneApp-V18
        path: app/build/outputs/apk/debug/*.apk
