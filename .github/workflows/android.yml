                                            }
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // 5. صيغة التاريخ (Date)
                            CardBox {
                                Text("Date (صيغة التاريخ)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(8.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    listOf("-", "5", "5 Feb", "Mon 5", "Mon").forEach { format ->
                                        val isSelected = dateFormatChoice == format
                                        Box(
                                            modifier = Modifier
                                                .weight(1f)
                                                .height(42.dp)
                                                .clip(RoundedCornerShape(12.dp))
                                                .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                .clickable { dateFormatChoice = format },
