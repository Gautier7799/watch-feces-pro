                                Icon(Icons.Default.Download, contentDescription = null)
                                Spacer(modifier = Modifier.width(8.dp))
                                Text("Installer", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                            }
                        }
                    }
                }
            }
        }

        // رسم أيقونات Material You داخل القائمة الهندسية
        @Composable
        fun MaterialYouIconRenderer(shapeIndex: Int, color: Color) {
            Canvas(modifier = Modifier.size(26.dp)) {
                val center = Offset(size.width / 2f, size.height / 2f)
                val r = size.minDimension / 2f

                when (shapeIndex) {
                    0 -> { // Squircle
                        drawRoundRect(color, topLeft = Offset(r * 0.15f, r * 0.15f), size = Size(r * 1.7f, r * 1.7f), cornerRadius = CornerRadius(r * 0.45f, r * 0.45f))
                    }
                    1 -> { // Flower 12 Petals
                        for (i in 0 until 12) {
                            val rad = Math.toRadians(i * 30.0)
                            val p = Offset((center.x + cos(rad) * r * 0.55f).toFloat(), (center.y + sin(rad) * r * 0.55f).toFloat())
                            drawCircle(color, radius = r * 0.38f, center = p)
                        }
                        drawCircle(color, radius = r * 0.65f, center = center)
                    }
                    2 -> { // Clover 4 Petals
                        for (i in 0 until 4) {
                            val rad = Math.toRadians(i * 90.0)
                            val p = Offset((center.x + cos(rad) * r * 0.45f).toFloat(), (center.y + sin(rad) * r * 0.45f).toFloat())
                            drawCircle(color, radius = r * 0.52f, center = p)
                        }
                    }
                    3 -> { // Cookie / Soft Pill Petals
                        for (i in 0 until 8) {
                            val rad = Math.toRadians(i * 45.0)
                            val p = Offset((center.x + cos(rad) * r * 0.50f).toFloat(), (center.y + sin(rad) * r * 0.50f).toFloat())
                            drawCircle(color, radius = r * 0.42f, center = p)
                        }
                    }
                    4 -> { // Sunburst Hexagon
                        val path = Path()
                        for (i in 0 until 6) {
                            val rad = Math.toRadians(i * 60.0 - 30.0)
                            val x = (center.x + cos(rad) * r * 0.9f).toFloat()
                            val y = (center.y + sin(rad) * r * 0.9f).toFloat()
                            if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                        }
                        path.close()
                        drawPath(path, color)
                    }
                    5 -> { // Dome / Arch
                        drawArc(color, 180f, 180f, true, Offset(r * 0.2f, r * 0.1f), Size(r * 1.6f, r * 1.4f))
                        drawRect(color, topLeft = Offset(r * 0.2f, r * 0.8f), size = Size(r * 1.6f, r * 0.9f))
                    }
                    else -> { // Donut / Bullseye Target
                        drawCircle(color, radius = r * 0.9f, center = center)
                        drawCircle(Color.Transparent, radius = r * 0.55f, center = center)
                        drawCircle(color, radius = r * 0.28f, center = center)
                    }
                }
            }
        }

        // رسم خلفية المؤشر المختار على واجهة الساعة
        @Composable
        fun MaterialYouBadgeBackground(shapeIndex: Int, opacity: Float) {
            Canvas(modifier = Modifier.fillMaxSize()) {
                val center = Offset(size.width / 2f, size.height / 2f)
                val r = size.minDimension / 2f
                val badgeColor = Color.White.copy(alpha = opacity * 0.35f)

                when (shapeIndex) {
                    0 -> drawRoundRect(badgeColor, topLeft = Offset(r * 0.1f, r * 0.1f), size = Size(r * 1.8f, r * 1.8f), cornerRadius = CornerRadius(r * 0.45f, r * 0.45f))
                    1 -> {
                        for (i in 0 until 12) {
                            val rad = Math.toRadians(i * 30.0)
                            drawCircle(badgeColor, radius = r * 0.38f, center = Offset((center.x + cos(rad) * r * 0.55f).toFloat(), (center.y + sin(rad) * r * 0.55f).toFloat()))
                        }
                        drawCircle(badgeColor, radius = r * 0.65f, center = center)
                    }
                    2 -> {
                        for (i in 0 until 4) {
                            val rad = Math.toRadians(i * 90.0)
                            drawCircle(badgeColor, radius = r * 0.52f, center = Offset((center.x + cos(rad) * r * 0.45f).toFloat(), (center.y + sin(rad) * r * 0.45f).toFloat()))
                        }
                    }
                    3 -> {
                        for (i in 0 until 8) {
                            val rad = Math.toRadians(i * 45.0)
                            drawCircle(badgeColor, radius = r * 0.42f, center = Offset((center.x + cos(rad) * r * 0.50f).toFloat(), (center.y + sin(rad) * r * 0.50f).toFloat()))
                        }
                    }
                    4 -> {
                        val path = Path()
                        for (i in 0 until 6) {
                            val rad = Math.toRadians(i * 60.0 - 30.0)
                            val x = (center.x + cos(rad) * r * 0.95f).toFloat()
                            val y = (center.y + sin(rad) * r * 0.95f).toFloat()
                            if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                        }
                        path.close()
                        drawPath(path, badgeColor)
                    }
                    5 -> {
                        drawArc(badgeColor, 180f, 180f, true, Offset(r * 0.1f, r * 0.05f), Size(r * 1.8f, r * 1.5f))
                        drawRect(badgeColor, topLeft = Offset(r * 0.1f, r * 0.8f), size = Size(r * 1.8f, r * 1.0f))
                    }
                    else -> {
                        drawCircle(badgeColor, radius = r * 0.92f, center = center)
                    }
                }
            }
        }

        @Composable
        fun AnalogClockMiniPreview(isAod: Boolean, badgeShape: Int, opacity: Float) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                // شارة التاريخ 5 Feb في الأعلى
                Box(
                    modifier = Modifier
                        .align(Alignment.TopCenter)
                        .padding(top = 22.dp)
                        .clip(RoundedCornerShape(10.dp))
                        .background(Color.White.copy(alpha = opacity * 0.25f))
                        .padding(horizontal = 12.dp, vertical = 4.dp)
                ) {
                    Text("5 Feb", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                }

                // مؤشر الخطوات السفلي مع شكل Material You المختار
                Box(
                    modifier = Modifier
                        .align(Alignment.BottomCenter)
                        .padding(bottom = 22.dp)
                        .size(64.dp),
                    contentAlignment = Alignment.Center
                ) {
                    MaterialYouBadgeBackground(shapeIndex = badgeShape, opacity = opacity)
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        Icon(Icons.Default.DirectionsWalk, contentDescription = null, tint = Color.White, modifier = Modifier.size(15.dp))
                        Text("8,532", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // مؤشر البطارية على اليسار
                Row(
                    modifier = Modifier
                        .align(Alignment.CenterStart)
                        .padding(start = 24.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color.White, modifier = Modifier.size(15.dp))
                    Spacer(modifier = Modifier.width(3.dp))
                    Text("85%", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                }

                // رسم علامات الساعات والعقارب الحادة المفرغة الأصلية
                Canvas(modifier = Modifier.fillMaxSize(0.92f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    for (i in 0 until 12) {
                        val rad = Math.toRadians((i * 30.0) - 90.0)
                        val p1 = Offset((center.x + cos(rad) * r * 0.84f).toFloat(), (center.y + sin(rad) * r * 0.84f).toFloat())
                        val p2 = Offset((center.x + cos(rad) * r * 0.98f).toFloat(), (center.y + sin(rad) * r * 0.98f).toFloat())
                        drawLine(
                            color = if (i % 3 == 0) Color.White else Color.White.copy(alpha = 0.5f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    // عقرب الساعات الحاد المفرغ
                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    val hourEnd = Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat())
                    drawLine(Color.White, center, hourEnd, strokeWidth = 6.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)

                    // عقرب الدقائق الحاد المفرغ
                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    val minEnd = Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat())
                    drawLine(Color.White, center, minEnd, strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(minRad) * r * 0.70f).toFloat(), (center.y + sin(minRad) * r * 0.70f).toFloat()), strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)

                    // عقرب الثواني الوردي الرفيع
                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        val secEnd = Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat())
                        drawLine(Color(0xFFFF80AB), center, secEnd, strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)
                        drawCircle(Color(0xFFFF80AB), radius = 3.5.dp.toPx(), center = Offset((center.x + cos(secRad) * r * 0.42f).toFloat(), (center.y + sin(secRad) * r * 0.42f).toFloat()))
                    }

                    // النقطة المركزية
                    drawCircle(Color(0xFFFF80AB), radius = 5.dp.toPx(), center = center)
                    drawCircle(Color.White, radius = 2.5.dp.toPx(), center = center)
                }
            }
        }
        EOF

    - name: Build Phone App APK Only
      run: gradle :app:assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Upload Phone APK Only
      uses: actions/upload-artifact@v4
