                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // 6. أشكال Material You للمؤشرات والشفافية
                            CardBox {
                                Text("Forme du fond (أشكال مؤشرات Material You)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(10.dp))
                                Row(
                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                    horizontalArrangement = Arrangement.spacedBy(10.dp)
                                ) {
                                    listOf("Squircle", "Flower", "Clover", "Cookie", "Sunburst", "Dome", "Donut").forEachIndexed { index, _ ->
                                        val isSelected = selectedBadgeShape == index
                                        Box(
                                            modifier = Modifier
                                                .size(50.dp)
                                                .clip(RoundedCornerShape(14.dp))
                                                .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                .clickable { selectedBadgeShape = index },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            ShapeRenderer(shapeIndex = index, color = if (isSelected) Color(0xFF0F381E) else Color.White)
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(14.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                    Text("Opacité du fond (الشفافية)", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color.White)
                                    Text("${(badgeOpacity * 100).toInt()}%", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = Color(0xFF98D7A5))
                                }
                                Slider(
                                    value = badgeOpacity,
                                    onValueChange = { badgeOpacity = it },
                                    valueRange = 0f..1f,
                                    colors = SliderDefaults.colors(thumbColor = Color(0xFF98D7A5), activeTrackColor = Color(0xFF98D7A5))
