name: Build Android & WearOS APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Configure Complete Application with All 4 Built-in Faces
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app", ":wear")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        # ----------------- 1. تطبيق الهاتف مع معرض الواجهات المدمجة -----------------
        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 5
                versionName = "5.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.launch
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = lightColorScheme(
                            primary = Color(0xFF1E3A2F),
                            secondary = Color(0xFF2E694E),
                            surface = Color(0xFFF9F9F4),
                            background = Color(0xFFF9F9F4)
                        )
                    ) {
                        WatchFaceManagerPhoneApp()
                    }
                }
            }
        }

        @Composable
        fun WatchFaceManagerPhoneApp() {
            val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
            val scope = rememberCoroutineScope()
            var currentScreen by remember { mutableStateOf("Constructeur") }

            // 0: Triple Chrono, 1: Peach Chrono, 2: Kinetic Sphere, 3: Viking Runes
            var selectedFaceIndex by remember { mutableStateOf(0) }
            var isAod by remember { mutableStateOf(false) }
            var trotteuseSmooth by remember { mutableStateOf(true) }

            val faceTitles = listOf(
                "Triple Sub-Dial Chrono",
                "Chrono Peach Active",
                "Kinetic Neon Sphere",
                "Viking Runes Compass"
            )

            ModalNavigationDrawer(
                drawerState = drawerState,
                drawerContent = {
                    ModalDrawerSheet(modifier = Modifier.width(300.dp), drawerContainerColor = Color(0xFFF4F6F0)) {
                        Spacer(modifier = Modifier.height(24.dp))
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Box(
                                modifier = Modifier.size(54.dp).clip(CircleShape).background(Color(0xFF0F2027)),
                                contentAlignment = Alignment.Center
                            ) {
                                Text("W", color = Color(0xFF38EF7D), fontSize = 28.sp, fontWeight = FontWeight.Black)
                            }
                            Spacer(modifier = Modifier.width(16.dp))
                            Text("Watch Face\nManager", fontSize = 19.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18), lineHeight = 22.sp)
                        }
                        HorizontalDivider(modifier = Modifier.padding(vertical = 12.dp), color = Color(0xFFE0E2DC))

                        listOf(
                            Triple("Accueil", Icons.Default.Home, "Accueil"),
                            Triple("Constructeur", Icons.Default.DashboardCustomize, "Constructeur"),
                            Triple("Paramètres", Icons.Default.Settings, "Paramètres")
                        ).forEach { (label, icon, route) ->
                            val selected = currentScreen == route
                            NavigationDrawerItem(
                                label = { Text(label, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium) },
                                icon = { Icon(icon, contentDescription = label) },
                                selected = selected,
                                onClick = {
                                    currentScreen = route
                                    scope.launch { drawerState.close() }
                                },
                                modifier = Modifier.padding(horizontal = 14.dp, vertical = 4.dp),
                                shape = RoundedCornerShape(26.dp)
                            )
                        }
                    }
                }
            ) {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color(0xFF1A1C18), modifier = Modifier.size(28.dp))
                            }
                            Text(currentScreen, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18))
                            IconButton(onClick = { /* حفظ */ }) {
                                Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF1A1C18))
                            }
                        }
                    },
                    containerColor = Color(0xFFF7F8F3)
                ) { innerPadding ->
                    Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                        Column(
                            modifier = Modifier
                                .fillMaxSize()
                                .verticalScroll(rememberScrollState())
                                .padding(horizontal = 20.dp, vertical = 6.dp),
                            horizontalAlignment = Alignment.CenterHorizontally
                        ) {
                            // معرض اختيار الواجهات المدمجة الـ 4
                            Text("Sélectionnez votre cadran (اختر الواجهة)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF1A1C18))
                            Spacer(modifier = Modifier.height(10.dp))
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                faceTitles.forEachIndexed { index, title ->
                                    val isSelected = selectedFaceIndex == index
                                    FilterChip(
                                        selected = isSelected,
                                        onClick = { selectedFaceIndex = index },
                                        label = {
                                            Text(
                                                when(index) {
                                                    0 -> "Chrono"
                                                    1 -> "Peach"
                                                    2 -> "Kinetic"
                                                    else -> "Viking"
                                                },
                                                fontSize = 12.sp,
                                                fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal
                                            )
                                        },
                                        colors = FilterChipDefaults.filterChipColors(
                                            selectedContainerColor = Color(0xFF1E3A2F),
                                            selectedLabelColor = Color.White
                                        )
                                    )
                                }
                            }

                            Spacer(modifier = Modifier.height(16.dp))

                            // معاينة شاشة الساعة الحية
                            Box(
                                modifier = Modifier
                                    .size(316.dp)
                                    .clip(CircleShape)
                                    .background(Color(0xFF0C0E10)),
                                contentAlignment = Alignment.Center
                            ) {
                                UniversalWatchRenderer(faceIndex = selectedFaceIndex, isAod = isAod, smooth = trotteuseSmooth)
                            }

                            Spacer(modifier = Modifier.height(16.dp))

                            // زرا Actif و AOD
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.spacedBy(10.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Button(
                                    onClick = { isAod = false },
                                    modifier = Modifier.weight(1f).height(48.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (!isAod) Color(0xFF1E3A2F) else Color(0xFFE4E7DF),
                                        contentColor = if (!isAod) Color.White else Color(0xFF434842)
                                    )
                                ) {
                                    Icon(Icons.Default.Settings, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("Actif", fontWeight = FontWeight.Bold)
                                }

                                Button(
                                    onClick = { isAod = true },
                                    modifier = Modifier.weight(1f).height(48.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (isAod) Color(0xFF1E3A2F) else Color(0xFFE4E7DF),
                                        contentColor = if (isAod) Color.White else Color(0xFF434842)
                                    )
                                ) {
                                    Icon(Icons.Default.BrightnessAuto, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("AOD", fontWeight = FontWeight.Bold)
                                }
                            }

                            Spacer(modifier = Modifier.height(14.dp))

                            // بطاقة اسم الواجهة الحالية
                            Card(
                                modifier = Modifier.fillMaxWidth(),
                                shape = RoundedCornerShape(20.dp),
                                colors = CardDefaults.cardColors(containerColor = Color(0xFFEAEFE7))
                            ) {
                                Row(
                                    modifier = Modifier.padding(16.dp),
                                    verticalAlignment = Alignment.CenterVertically,
                                    horizontalArrangement = Arrangement.SpaceBetween
                                ) {
                                    Column {
                                        Text(faceTitles[selectedFaceIndex], fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF1A1C18))
                                        Text("Prêt pour votre Pixel Watch", fontSize = 13.sp, color = Color(0xFF6B7068))
                                    }
                                    Icon(Icons.Default.CheckCircle, contentDescription = null, tint = Color(0xFF2E694E))
                                }
                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // خيار عقرب الثواني
                            Card(
                                modifier = Modifier.fillMaxWidth(),
                                shape = RoundedCornerShape(20.dp),
                                colors = CardDefaults.cardColors(containerColor = Color(0xFFEAEFE7))
                            ) {
                                Row(
                                    modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                                    verticalAlignment = Alignment.CenterVertically,
                                    horizontalArrangement = Arrangement.SpaceBetween
                                ) {
                                    Column {
                                        Text("Trotteuse", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF1A1C18))
                                        Text(if (trotteuseSmooth) "Mouvement fluide (Smooth)" else "Battement (Tick)", fontSize = 13.sp, color = Color(0xFF6B7068))
                                    }
                                    Switch(
                                        checked = trotteuseSmooth,
                                        onCheckedChange = { trotteuseSmooth = it },
                                        colors = SwitchDefaults.colors(checkedThumbColor = Color.White, checkedTrackColor = Color(0xFF2E694E))
                                    )
                                }
                            }

                            Spacer(modifier = Modifier.height(90.dp))
                        }

                        // زر التثبيت الأخضر الأنيق (Installer)
                        FloatingActionButton(
                            onClick = { /* إرسال للساعة */ },
                            modifier = Modifier.align(Alignment.BottomEnd).padding(20.dp),
                            containerColor = Color(0xFFBBEAC5),
                            contentColor = Color(0xFF0F381E),
                            shape = RoundedCornerShape(22.dp)
                        ) {
                            Row(
                                modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Icon(Icons.Default.FileDownload, contentDescription = null)
                                Spacer(modifier = Modifier.width(8.dp))
                                Text("Installer", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun UniversalWatchRenderer(faceIndex: Int, isAod: Boolean, smooth: Boolean) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(smooth, isAod) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = if (smooth) (s + ms / 1000f) * 6f else s * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else if (smooth) 40 else 500)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                Canvas(modifier = Modifier.fillMaxSize()) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    when (faceIndex) {
                        0 -> { // 1. Triple Chronograph Face
                            drawArc(Color(0xFF5DD996), 140f, 75f * 0.84f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFF64B5F6), 325f, 75f * 0.70f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFFFF8A80), 220f, 70f * 0.75f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(5.dp.toPx(), cap = StrokeCap.Round))

                            val subR = r * 0.23f
                            listOf(Offset(center.x - r * 0.50f, center.y), Offset(center.x + r * 0.50f, center.y), Offset(center.x, center.y + r * 0.48f)).forEach { sub ->
                                drawCircle(Color(0xFF1B1E22), radius = subR, center = sub)
                                drawCircle(Color(0xFF33383F), radius = subR, center = sub, style = Stroke(1.dp.toPx()))
                            }

                            // عقارب الكرونوغراف المفرغة
                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), 2.5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(minRad) * r * 0.72f).toFloat(), (center.y + sin(minRad) * r * 0.72f).toFloat()), 2.dp.toPx(), StrokeCap.Round)

                            if (!isAod) {
                                val secRad = Math.toRadians((secondAngle - 90.0))
                                drawLine(Color(0xFFFF3D00), center, Offset((center.x + cos(secRad) * r * 0.86f).toFloat(), (center.y + sin(secRad) * r * 0.86f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            }
                        }
                        1 -> { // 2. Chrono Peach Active
                            drawArc(Color(0xFFFF8A65), 130f, 90f * 0.83f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(6.dp.toPx(), cap = StrokeCap.Round))
                            drawArc(Color(0xFF5D4037), 320f, 90f * 0.61f, false, Offset(center.x - r * 0.94f, center.y - r * 0.94f), Size(r * 1.88f, r * 1.88f), Stroke(6.dp.toPx(), cap = StrokeCap.Round))
                            drawCircle(Color.White.copy(alpha = 0.1f), radius = r * 0.55f, center = center, style = Stroke(1.dp.toPx()))

                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color(0xFFFFE0B2), center, Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat()), 7.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.76f).toFloat(), (center.y + sin(minRad) * r * 0.76f).toFloat()), 5.dp.toPx(), StrokeCap.Round)

                            if (!isAod) {
                                val secRad = Math.toRadians((secondAngle - 90.0))
                                drawLine(Color(0xFFFF7043), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.2.dp.toPx(), StrokeCap.Round)
                            }
                        }
                        2 -> { // 3. Kinetic Neon Sphere
                            for (i in 0 until 40) {
                                val angle = i * 9.0
                                val rad = Math.toRadians(angle)
                                val dist = (r * 0.25f) + (i % 8) * (r * 0.08f)
                                val p = Offset((center.x + cos(rad) * dist).toFloat(), (center.y + sin(rad) * dist).toFloat())
                                drawCircle(Color.White.copy(alpha = 0.55f), radius = 2.5.dp.toPx(), center = p)
                            }
                            drawCircle(Color(0xFF132F20), radius = r * 0.24f, center = Offset(center.x, center.y + r * 0.55f))

                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.White, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 5.dp.toPx(), StrokeCap.Round)
                            drawLine(Color.Black, center, Offset((center.x + cos(minRad) * r * 0.72f).toFloat(), (center.y + sin(minRad) * r * 0.72f).toFloat()), 2.dp.toPx(), StrokeCap.Round)

                            if (!isAod) {
                                val secRad = Math.toRadians((secondAngle - 90.0))
                                drawLine(Color(0xFF00E676), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.5.dp.toPx(), StrokeCap.Round)
                                drawCircle(Color(0xFF00E676), radius = 4.dp.toPx(), center = center)
                            }
                        }
                        else -> { // 4. Viking Runes
                            val norseRed = Color(0xFFFF3D00)
                            drawCircle(norseRed.copy(alpha = 0.5f), radius = r * 0.28f, center = center, style = Stroke(1.5.dp.toPx()))
                            for (i in 0 until 8) {
                                val rad = Math.toRadians((i * 45.0) - 90.0)
                                drawLine(norseRed, center, Offset((center.x + cos(rad) * r * 0.88f).toFloat(), (center.y + sin(rad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            }
                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.50f).toFloat(), (center.y + sin(hourRad) * r * 0.50f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                            drawLine(Color(0xFFFF8A65), center, Offset((center.x + cos(minRad) * r * 0.76f).toFloat(), (center.y + sin(minRad) * r * 0.76f).toFloat()), 4.dp.toPx(), StrokeCap.Round)
                            if (!isAod) {
                                val secRad = Math.toRadians((secondAngle - 90.0))
                                drawLine(norseRed, center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                            }
                        }
                    }
                }

                // نصوص التاريخ والبيانات فوق الواجهة
                when (faceIndex) {
                    1 -> {
                        Column(modifier = Modifier.fillMaxSize().padding(top = 42.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                            Text("08-24", color = Color(0xFFFF8A65), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                            Text("12:15:33 AM", color = Color(0xFFFF8A65), fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                        }
                    }
                    2 -> {
                        Column(modifier = Modifier.fillMaxSize().padding(bottom = 28.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Bottom) {
                            Text("MON", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                            Text("61°", color = Color.White.copy(alpha = 0.8f), fontSize = 11.sp)
                        }
                    }
                    else -> {
                        Text("5 FEB", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.TopCenter).padding(top = 40.dp))
                    }
                }
            }
        }
        EOF

