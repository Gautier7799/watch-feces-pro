name: Build Android & WearOS APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Configure Complete Application with Permissions
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app", ":wear")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        # ----------------- 1. تطبيق الهاتف (app) -----------------
        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 4
                versionName = "4.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.compose.ui.text.font.FontWeight

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                        Box(contentAlignment = Alignment.Center) {
                            Text("Watch Face Manager Connected", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                        }
                    }
                }
            }
        }
        EOF

        # ----------------- 2. موديول الساعة مع كافة الأذونات (Wear OS) -----------------
        mkdir -p wear/src/main/java/com/example/wear
        cat << 'EOF' > wear/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example.wear"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.wearface"
                minSdk = 28
                targetSdk = 34
                versionCode = 4
                versionName = "4.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > wear/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.type.watch" />
            
            <!-- أذونات بقاء الواجهة نشطة دائماً وعدم الإغلاق -->
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.BODY_SENSORS" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

            <application
                android:allowBackup="true"
                android:label="Pixel Chrono"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".WearMainActivity"
                    android:exported="true"
                    android:launchMode="singleInstance"
                    android:showWhenLocked="true"
                    android:turnScreenOn="true"
                    android:showForAllUsers="true"
                    android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > wear/src/main/java/com/example/wear/WearMainActivity.kt
        package com.example.wear

        import android.Manifest
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.BatteryChargingFull
        import androidx.compose.material.icons.filled.Favorite
        import androidx.compose.material3.Icon
        import androidx.compose.material3.Text
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.compose.ui.text.font.FontWeight
        import androidx.core.app.ActivityCompat
        import kotlinx.coroutines.delay
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class WearMainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                // 1. تفعيل وضع البقاء على شاشة القفل لمنع الإغلاق عند إطفاء الشاشة
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                    setShowWhenLocked(true)
                    setTurnScreenOn(true)
                }
                window.addFlags(
                    WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                    WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON or
                    WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                )

                // 2. طلب إذن الحساسات (نبض القلب والنشاط)
                if (checkSelfPermission(Manifest.permission.BODY_SENSORS) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.BODY_SENSORS), 101)
                }

                setContent {
                    WearWatchSurface()
                }
            }
        }

        @Composable
        fun WearWatchSurface() {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }
            var isAod by remember { mutableStateOf(false) }

            val norseRed = Color(0xFFFF3D00)
            val accentPeach = Color(0xFFFF8A65)

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val hour = cal.get(Calendar.HOUR)
                    val minute = cal.get(Calendar.MINUTE)
                    val second = cal.get(Calendar.SECOND)
                    val millis = cal.get(Calendar.MILLISECOND)

                    secondAngle = (second + millis / 1000f) * 6f
                    minuteAngle = (minute + second / 60f) * 6f
                    hourAngle = (hour + minute / 60f) * 30f

                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(
                modifier = Modifier
                    .fillMaxSize()
                    .clip(CircleShape)
                    .background(Color.Black)
                    .clickable { isAod = !isAod },
                contentAlignment = Alignment.Center
            ) {
                Canvas(modifier = Modifier.fillMaxSize(0.86f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    drawCircle(
                        color = if (isAod) Color.DarkGray else norseRed.copy(alpha = 0.5f),
                        radius = r * 0.28f,
                        center = center,
                        style = Stroke(width = 1.5.dp.toPx())
                    )

                    for (i in 0 until 8) {
                        val rad = Math.toRadians((i * 45.0) - 90.0)
                        val endX = (center.x + cos(rad) * (r * 0.88f)).toFloat()
                        val endY = (center.y + sin(rad) * (r * 0.88f)).toFloat()

                        drawLine(
                            color = if (isAod) Color.Gray else norseRed,
                            start = center,
                            end = Offset(endX, endY),
                            strokeWidth = 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    for (i in 0 until 12) {
                        val markRad = Math.toRadians((i * 30.0) - 90.0)
                        val p1 = Offset((center.x + cos(markRad) * (r * 0.92f)).toFloat(), (center.y + sin(markRad) * (r * 0.92f)).toFloat())
                        val p2 = Offset((center.x + cos(markRad) * (r * 1.0f)).toFloat(), (center.y + sin(markRad) * (r * 1.0f)).toFloat())
                        drawLine(
                            color = if (i % 3 == 0) accentPeach else Color.White.copy(alpha = 0.6f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    drawLine(
                        color = Color.White,
                        start = center,
                        end = Offset((center.x + cos(hourRad) * (r * 0.50f)).toFloat(), (center.y + sin(hourRad) * (r * 0.50f)).toFloat()),
                        strokeWidth = 6.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    drawLine(
                        color = accentPeach,
                        start = center,
                        end = Offset((center.x + cos(minRad) * (r * 0.76f)).toFloat(), (center.y + sin(minRad) * (r * 0.76f)).toFloat()),
                        strokeWidth = 4.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        drawLine(
                            color = norseRed,
                            start = center,
                            end = Offset((center.x + cos(secRad) * (r * 0.88f)).toFloat(), (center.y + sin(secRad) * (r * 0.88f)).toFloat()),
                            strokeWidth = 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    drawCircle(color = Color.White, radius = 5.dp.toPx(), center = center)
                    drawCircle(color = Color.Black, radius = 2.dp.toPx(), center = center)
                }

                if (!isAod) {
                    Row(
                        modifier = Modifier.align(Alignment.TopCenter).padding(top = 22.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Icon(Icons.Default.Favorite, contentDescription = null, tint = norseRed, modifier = Modifier.size(13.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Text("76", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }

                    Row(
                        modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 22.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = accentPeach, modifier = Modifier.size(14.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Text("88%", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }
        EOF

    - name: Build Both Debug APKs
      run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk dist/PixelWatch-Phone.apk
        cp wear/build/outputs/apk/debug/*.apk dist/PixelWatch-WearOS.apk

    - name: Upload Both APKs
      uses: actions/upload-artifact@v4
      with:
        name: WatchFaceManager-WithPermissions
        path: dist/*.apk
