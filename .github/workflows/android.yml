        @Composable
        fun AnalogClockMiniPreview(isAod: Boolean) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else 40)
                }
            }

            Canvas(modifier = Modifier.fillMaxSize(0.9f)) {
                val center = Offset(size.width / 2f, size.height / 2f)
                val r = size.minDimension / 2f

                // علامات الساعات
                for (i in 0 until 12) {
                    val rad = Math.toRadians((i * 30.0) - 90.0)
                    val p1 = Offset((center.x + cos(rad) * r * 0.88f).toFloat(), (center.y + sin(rad) * r * 0.88f).toFloat())
                    val p2 = Offset((center.x + cos(rad) * r).toFloat(), (center.y + sin(rad) * r).toFloat())
                    drawLine(Color.White, p1, p2, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)
                }

                // العقارب
                val hourRad = Math.toRadians((hourAngle - 90.0))
                val minRad = Math.toRadians((minuteAngle - 90.0))
                drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                drawLine(Color.LightGray, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 4.dp.toPx(), StrokeCap.Round)

                if (!isAod) {
                    val secRad = Math.toRadians((secondAngle - 90.0))
                    drawLine(Color(0xFFFF3D00), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                }
                drawCircle(Color.White, radius = 5.dp.toPx(), center = center)
            }
        }
