name: Build Phone App APK Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Clean & Build V19 Analog Pro App
      run: |
        rm -rf app/src/main/java
        rm -rf wear/src/main/java 2>/dev/null || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.analog"
                minSdk = 26
                targetSdk = 35
                versionCode = 19
                versionName = "19.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.net.Uri
        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.animation.AnimatedVisibility
        import androidx.compose.animation.fadeIn
        import androidx.compose.animation.fadeOut
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.gestures.detectDragGestures
        import androidx.compose.foundation.horizontalScroll
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.CornerRadius
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.Path
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.StrokeJoin
        import androidx.compose.ui.graphics.drawscope.DrawScope
        import androidx.compose.ui.graphics.drawscope.Fill
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.input.pointer.pointerInput
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.platform.LocalDensity
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.IntOffset
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import coil.compose.AsyncImage
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.launch
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.roundToInt
        import kotlin.math.sin

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = darkColorScheme(
                            primary = Color(0xFF98D7A5),
                            secondary = Color(0xFF2E694E),
                            surface = Color(0xFF131814),
                            background = Color(0xFF0C100D)
                        )
                    ) {
                        Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0C100D)) {
                            AnalogMasterWatchFaceApp()
                        }
                    }
                }
            }
        }

        enum class WidgetType(val title: String, val defaultText: String) {
            BATTERY("Batterie", "85%"),
            STEPS("Pas", "8,532"),
            HEART_RATE("Fréquence", "72 bpm"),
            WEATHER("Météo", "24°C"),
            CALENDAR("Événement", "14:00")
        }

        enum class HandStyle(val label: String) {
            CLASSIC("Classique (عادية)"),
            SPORT("Sport (رياضية)"),
            PIXEL_PILL("Pixel Pill (بكسل)"),
            MINIMAL("Minimal (بسيطة)")
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun AnalogMasterWatchFaceApp() {
            val context = LocalContext.current
            val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
            val scope = rememberCoroutineScope()
            var currentScreen by remember { mutableStateOf("Constructeur") }

            var isAod by remember { mutableStateOf(false) }
            var isDraggingWidget by remember { mutableStateOf(false) }

            // 1. ألوان وأنواع العقارب
            var selectedHandStyle by remember { mutableStateOf(HandStyle.CLASSIC) }

            val handColorPalettes = listOf(
                Pair("Blanc & Corail", Pair(Color.White, Color(0xFFFF7043))),
                Pair("Craie & Menthe", Pair(Color(0xFFE8EAED), Color(0xFF98D7A5))),
                Pair("Jaune & Noir", Pair(Color(0xFFFFEE58), Color(0xFFFF5252))),
                Pair("Bleu Ciel & Rose", Pair(Color(0xFF80D8FF), Color(0xFFFF4081))),
                Pair("Or & Rouge", Pair(Color(0xFFFFD54F), Color(0xFFD50000)))
            )
            var selectedHandColorIndex by remember { mutableStateOf(0) }

            // 2. ألوان الودجات
            val widgetColorList = listOf(
                Pair("Menthe Pixel", Color(0xFF98D7A5)),
                Pair("Blanc Pur", Color.White),
                Pair("Pêche Corail", Color(0xFFFFAB91)),
                Pair("Ambre Doré", Color(0xFFFFE082)),
                Pair("Lavande", Color(0xFFCE93D8)),
                Pair("Gris Métal", Color(0xFFCFD8DC))
            )
            var selectedWidgetColorIndex by remember { mutableStateOf(0) }

            // 3. أشكال Material You المعتمدة من قوقل
            var selectedBadgeShape by remember { mutableStateOf(1) } // Flower
            var badgeOpacity by remember { mutableStateOf(0.45f) }

            // 4. إدارة الودجات
            var activeWidget1 by remember { mutableStateOf<WidgetType?>(WidgetType.BATTERY) }
            var activeWidget2 by remember { mutableStateOf<WidgetType?>(WidgetType.STEPS) }
            val activeWidgetsCount = listOfNotNull(activeWidget1, activeWidget2).size
            var showWidgetPickerSheet by remember { mutableStateOf(false) }
            var displayStyle by remember { mutableStateOf("Arc") }

            // 5. صيغة التاريخ
            var dateFormatChoice by remember { mutableStateOf("Mon 5") }

            // 6. خلفية وقرص الساعة
            var selectedBgImageUri by remember { mutableStateOf<Uri?>(null) }
            val photoPickerLauncher = rememberLauncherForActivityResult(
                contract = ActivityResultContracts.GetContent()
            ) { uri: Uri? -> selectedBgImageUri = uri }

            val dialBackgroundColors = listOf(
                Color(0xFF0C100D),
                Color(0xFF141C16),
                Color(0xFF1F2833),
                Color(0xFF2C1B18),
                Color(0xFFFFFFFF)
            )
            var selectedDialColorIndex by remember { mutableStateOf(0) }
            var showHourIndices by remember { mutableStateOf(true) }

            var showSaveDialog by remember { mutableStateOf(false) }
            var showInstallDialog by remember { mutableStateOf(false) }
            var isInstalling by remember { mutableStateOf(false) }

            var dateOffsetDp by remember { mutableStateOf(Offset(0f, -80f)) }
            var widget1OffsetDp by remember { mutableStateOf(Offset(75f, 0f)) }
            var widget2OffsetDp by remember { mutableStateOf(Offset(0f, 75f)) }

            ModalNavigationDrawer(
                drawerState = drawerState,
                drawerContent = {
                    ModalDrawerSheet(
                        modifier = Modifier.width(300.dp),
                        drawerContainerColor = Color(0xFF121914),
                        drawerContentColor = Color.White
                    ) {
                        Spacer(modifier = Modifier.height(28.dp))
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Box(
                                modifier = Modifier.size(48.dp).clip(CircleShape).background(Color(0xFF0F2027)),
                                contentAlignment = Alignment.Center
                            ) {
                                Text("P", color = Color(0xFF98D7A5), fontSize = 24.sp, fontWeight = FontWeight.Black)
                            }
                            Spacer(modifier = Modifier.width(14.dp))
                            Column {
                                Text("Pixel Analog Pro", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                Text("Éditeur de cadran", fontSize = 12.sp, color = Color(0xFF98D7A5))
                            }
                        }
                        HorizontalDivider(modifier = Modifier.padding(vertical = 10.dp), color = Color(0xFF243026))

                        val menuItems = listOf(
                            Pair("Constructeur", Icons.Default.DashboardCustomize),
                            Pair("Accueil", Icons.Default.Home),
                            Pair("Vitrine", Icons.Default.Storefront),
                            Pair("Favoris", Icons.Default.FavoriteBorder),
                            Pair("Top", Icons.Default.EmojiEvents),
                            Pair("Nouveautés", Icons.Default.FiberNew),
                            Pair("Voter", Icons.Default.Poll),
                            Pair("Informations", Icons.Default.Info),
                            Pair("Paramètres", Icons.Default.Settings)
                        )

                        menuItems.forEach { (route, icon) ->
                            val selected = currentScreen == route
                            NavigationDrawerItem(
                                label = { Text(route, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium, color = Color.White) },
                                icon = { Icon(icon, contentDescription = route, tint = if (selected) Color(0xFF98D7A5) else Color(0xFFC2C8BE)) },
                                selected = selected,
                                onClick = {
                                    currentScreen = route
                                    scope.launch { drawerState.close() }
                                },
                                modifier = Modifier.padding(horizontal = 14.dp, vertical = 3.dp),
                                shape = RoundedCornerShape(24.dp),
                                colors = NavigationDrawerItemDefaults.colors(
                                    selectedContainerColor = Color(0xFF25392B),
                                    unselectedContainerColor = Color.Transparent
                                )
                            )
                        }
                    }
                }
            ) {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .statusBarsPadding()
                                .padding(horizontal = 16.dp, vertical = 10.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color.White, modifier = Modifier.size(28.dp))
                            }
                            Text(
                                currentScreen,
                                fontSize = 20.sp,
                                fontWeight = FontWeight.Bold,
                                color = Color.White
                            )
                            IconButton(onClick = { showSaveDialog = true }) {
                                Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF98D7A5), modifier = Modifier.size(28.dp))
                            }
                        }
                    },
                    containerColor = Color(0xFF0C100D)
                ) { innerPadding ->
                    Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                        Column(
                            modifier = Modifier
                                .fillMaxSize()
                                .verticalScroll(rememberScrollState(), enabled = !isDraggingWidget)
                                .padding(horizontal = 16.dp, vertical = 4.dp),
                            horizontalAlignment = Alignment.CenterHorizontally
                        ) {
                            Row(
                                modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                horizontalArrangement = Arrangement.SpaceBetween,
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Row(
                                    modifier = Modifier
                                        .clip(RoundedCornerShape(20.dp))
                                        .background(Color(0xFF161E18))
                                        .clickable { photoPickerLauncher.launch("image/*") }
                                        .padding(horizontal = 12.dp, vertical = 8.dp),
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    Icon(Icons.Default.FolderOpen, contentDescription = "Open", tint = Color(0xFF98D7A5), modifier = Modifier.size(22.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text(if (selectedBgImageUri != null) "Photo active" else "Image fond", fontSize = 12.sp, color = Color.White)
                                }

                                Box(
                                    modifier = Modifier
                                        .clip(RoundedCornerShape(20.dp))
                                        .background(Color(0xFF2E694E))
                                        .padding(horizontal = 14.dp, vertical = 8.dp)
                                ) {
                                    Row(verticalAlignment = Alignment.CenterVertically) {
                                        Icon(Icons.Default.Schedule, contentDescription = null, tint = Color(0xFF98D7A5), modifier = Modifier.size(16.dp))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text("Analogique Pro", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                    }
                                }

                                if (selectedBgImageUri != null) {
                                    IconButton(onClick = { selectedBgImageUri = null }) {
                                        Icon(Icons.Default.Close, contentDescription = "Remove photo", tint = Color(0xFFFF8A80), modifier = Modifier.size(22.dp))
                                    }
                                } else {
                                    IconButton(onClick = { showSaveDialog = true }) {
                                        Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF98D7A5), modifier = Modifier.size(24.dp))
                                    }
                                }
                            }

                            Text(
                                "🖐️ اسحب أي أيقونة (التاريخ / البطارية / الخطوات) لوضعها في أي مكان تريده",
                                fontSize = 11.sp,
                                color = Color(0xFF98D7A5),
                                modifier = Modifier.padding(vertical = 4.dp)
                            )

                            Spacer(modifier = Modifier.height(4.dp))

                            // قرص ساعة Pixel Watch التفاعلي
                            Box(
                                modifier = Modifier
                                    .size(310.dp)
                                    .clip(CircleShape)
                                    .background(dialBackgroundColors[selectedDialColorIndex])
                                    .border(2.dp, Color(0xFF263228), CircleShape),
                                contentAlignment = Alignment.Center
                            ) {
                                if (selectedBgImageUri != null) {
                                    AsyncImage(
                                        model = selectedBgImageUri,
                                        contentDescription = "Custom Bg",
                                        modifier = Modifier.fillMaxSize().clip(CircleShape),
                                        alpha = if (isAod) 0.35f else 1f,
                                        contentScale = ContentScale.Crop
                                    )
                                }

                                AnalogEngineScreen(
                                    isAod = isAod,
                                    handStyle = selectedHandStyle,
                                    handColors = handColorPalettes[selectedHandColorIndex].second,
                                    badgeShape = selectedBadgeShape,
                                    badgeOpacity = badgeOpacity,
                                    badgeColor = widgetColorList[selectedWidgetColorIndex].second,
                                    dateFormat = dateFormatChoice,
                                    displayStyle = displayStyle,
                                    showIndices = showHourIndices,
                                    widget1 = activeWidget1,
                                    widget2 = activeWidget2,
                                    dateOffset = dateOffsetDp,
                                    onDateOffsetChange = { dateOffsetDp = it },
                                    widget1Offset = widget1OffsetDp,
                                    onWidget1OffsetChange = { widget1OffsetDp = it },
                                    widget2Offset = widget2OffsetDp,
                                    onWidget2OffsetChange = { widget2OffsetDp = it },
                                    onDragStateChange = { isDraggingWidget = it }
                                )
                            }

                            Spacer(modifier = Modifier.height(10.dp))

                            // زرا Actif و AOD
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.spacedBy(10.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Button(
                                    onClick = { isAod = false },
                                    modifier = Modifier.weight(1f).height(46.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (!isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                        contentColor = if (!isAod) Color(0xFF0F381E) else Color.White
                                    )
                                ) {
                                    Icon(Icons.Default.WbSunny, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("Actif", fontWeight = FontWeight.Bold)
                                }

                                Button(
                                    onClick = { isAod = true },
                                    modifier = Modifier.weight(1f).height(46.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                        contentColor = if (isAod) Color(0xFF0F381E) else Color.White
                                    )
                                ) {
                                    Icon(Icons.Default.NightlightRound, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("AOD (توفير طاقة)", fontWeight = FontWeight.Bold)
                                }

                                IconButton(
                                    onClick = {
                                        dateOffsetDp = Offset(0f, -80f)
                                        widget1OffsetDp = Offset(75f, 0f)
                                        widget2OffsetDp = Offset(0f, 75f)
                                        Toast.makeText(context, "Positions réinitialisées (تمت استعادة المواضع)", Toast.LENGTH_SHORT).show()
                                    },
                                    modifier = Modifier.size(46.dp).clip(CircleShape).background(Color(0xFF1B241D))
                                ) {
                                    Icon(Icons.Default.Refresh, contentDescription = "Reset", tint = Color.White)
                                }
                            }

                            Spacer(modifier = Modifier.height(14.dp))

                            // 1. أنواع العقارب
                            CardBox {
                                Text("2. Types d'aiguilles (أنواع العقارب)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(10.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    HandStyle.values().forEach { style ->
                                        val isSelected = selectedHandStyle == style
                                        Box(
                                            modifier = Modifier
                                                .weight(1f)
                                                .height(44.dp)
                                                .clip(RoundedCornerShape(12.dp))
                                                .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                .clickable { selectedHandStyle = style },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            Text(
                                                style.name.lowercase().capitalize(),
                                                fontWeight = FontWeight.Bold,
                                                fontSize = 11.sp,
                                                color = if (isSelected) Color(0xFF0F381E) else Color.White
                                            )
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // 2. ألوان العقارب
                            CardBox {
                                Text("1. Couleurs des aiguilles (ألوان العقارب)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(10.dp))
                                Row(
                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                    horizontalArrangement = Arrangement.spacedBy(10.dp)
                                ) {
                                    handColorPalettes.forEachIndexed { index, (name, pair) ->
                                        val isSelected = selectedHandColorIndex == index
                                        Row(
                                            modifier = Modifier
                                                .clip(RoundedCornerShape(16.dp))
                                                .background(if (isSelected) Color(0xFF2E694E) else Color(0xFF18221A))
                                                .border(if (isSelected) 2.dp else 1.dp, if (isSelected) Color(0xFF98D7A5) else Color.DarkGray, RoundedCornerShape(16.dp))
                                                .clickable { selectedHandColorIndex = index }
                                                .padding(horizontal = 10.dp, vertical = 8.dp),
                                            verticalAlignment = Alignment.CenterVertically
                                        ) {
                                            Box(modifier = Modifier.size(16.dp).clip(CircleShape).background(pair.first))
                                            Spacer(modifier = Modifier.width(4.dp))
                                            Box(modifier = Modifier.size(16.dp).clip(CircleShape).background(pair.second))
                                            Spacer(modifier = Modifier.width(8.dp))
                                            Text(name, color = Color.White, fontSize = 12.sp, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal)
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // 3. أشكال Material You المعتمدة من قوقل
                            CardBox {
                                Text("3. Formes Material You (الأشكال الأصلية للمؤشرات)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Text("شكل الأيقونة يتغير فوراً على الساعة بالشكل الهندسي المختار", fontSize = 11.sp, color = Color(0xFF98D7A5))
                                Spacer(modifier = Modifier.height(10.dp))

                                Row(
                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                    horizontalArrangement = Arrangement.spacedBy(10.dp)
                                ) {
                                    val shapeNames = listOf("Squircle", "Flower (زهرة)", "Clover (برسيم)", "Cookie (كعكة)", "Hexagon (سداسي)", "Dome (قبة)", "Pill (كبسولة)")
                                    shapeNames.forEachIndexed { index, name ->
                                        val isSelected = selectedBadgeShape == index
                                        Column(
                                            horizontalAlignment = Alignment.CenterHorizontally,
                                            modifier = Modifier.clickable { selectedBadgeShape = index }
                                        ) {
                                            Box(
                                                modifier = Modifier
                                                    .size(54.dp)
                                                    .clip(RoundedCornerShape(14.dp))
                                                    .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                    .border(if (isSelected) 2.dp else 1.dp, if (isSelected) Color.White else Color.Transparent, RoundedCornerShape(14.dp)),
                                                contentAlignment = Alignment.Center
                                            ) {
