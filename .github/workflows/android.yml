// -------------------------------------------------------------
// الأنماط والثوابت (Enums & Models)
// -------------------------------------------------------------
enum class HandStyle(val label: String) {
    CLASSIC("Classic"),
    SPORT("Sport"),
    PIXEL_PILL("Pixel_pill"),
    MINIMAL("Minimal")
}

enum class DialIndexStyle(val title: String) {
    NONE("Sans (نقي)"),
    DOTS("Points (نقاط)"),
    LINES("Lignes (خطوط)"),
    NUMBERS("Chiffres (أرقام)")
}

enum class WidgetType(val title: String, val icon: androidx.compose.ui.graphics.vector.ImageVector) {
    BATTERY("Batterie", Icons.Default.BatteryChargingFull),
    STEPS("Pas", Icons.Default.DirectionsWalk),
    HEART("Cardio", Icons.Default.Favorite),
    WEATHER("Météo", Icons.Default.WbSunny),
    DATE("Date", Icons.Default.CalendarToday)
}

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        setContent {
            MaterialTheme(
                colorScheme = darkColorScheme(
                    background = Color(0xFF0C100D),
                    surface = Color(0xFF141C16),
                    primary = Color(0xFF98D7A5)
                )
            ) {
                Surface(
                    modifier = Modifier.fillMaxSize(),
                    color = Color(0xFF0C100D)
                ) {
                    PixelWatchAnalogBuilderApp()
                }
            }
        }
    }
}

@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun PixelWatchAnalogBuilderApp() {
    val context = LocalContext.current
    val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
    val scope = rememberCoroutineScope()
    var currentScreen by remember { mutableStateOf("Constructeur") }

    // التركيز بنسبة 100% على Analogic
    var isAod by remember { mutableStateOf(false) }
    var isDraggingWidget by remember { mutableStateOf(false) }

    // 1. ألوان وأنواع العقارب (Hand Styles & Colors)
    var selectedHandStyle by remember { mutableStateOf(HandStyle.CLASSIC) }

    val handColorPalettes = listOf(
        Pair("Blanc & Corail", Pair(Color.White, Color(0xFFFF7043))),
        Pair("Craie & Menthe", Pair(Color(0xFFE8EAED), Color(0xFF98D7A5))),
        Pair("Jaune & Noir", Pair(Color(0xFFFFEE58), Color(0xFFFF5252))),
        Pair("Bleu Ciel & Rose", Pair(Color(0xFF80D8FF), Color(0xFFFF4081))),
        Pair("Or & Rouge", Pair(Color(0xFFFFD54F), Color(0xFFD50000)))
    )
    var selectedHandColorIndex by remember { mutableStateOf(0) }

    // 2. ألوان الودجات (Widget Colors)
    val widgetColorList = listOf(
        Pair("Menthe Pixel", Color(0xFF98D7A5)),
        Pair("Blanc Pur", Color.White),
        Pair("Pêche Corail", Color(0xFFFFAB91)),
        Pair("Ambre Doré", Color(0xFFFFE082)),
        Pair("Lavande", Color(0xFFCE93D8)),
        Pair("Gris Métal", Color(0xFFCFD8DC))
    )
    var selectedWidgetColorIndex by remember { mutableStateOf(0) }

    // 3. أشكال Material You المعتمدة الأصلية (0 إلى 6) والشفافية
    var selectedBadgeShape by remember { mutableStateOf(1) }
    var badgeOpacity by remember { mutableStateOf(0.45f) }

    // 4. إدارة الودجات
    var activeWidget1 by remember { mutableStateOf<WidgetType?>(WidgetType.BATTERY) }
    var activeWidget2 by remember { mutableStateOf<WidgetType?>(WidgetType.STEPS) }
    var showWidgetPickerSheet by remember { mutableStateOf(false) }
    var displayStyle by remember { mutableStateOf("Arc") }

    // 5. صيغة التاريخ
    var dateFormatChoice by remember { mutableStateOf("Mon 5") }

    // 6. خلفية وقرص الساعة
    var selectedBgImageUri by remember { mutableStateOf<Uri?>(null) }
    val photoPickerLauncher = rememberLauncherForActivityResult(
        contract = ActivityResultContracts.GetContent()
    ) { uri: Uri? -> selectedBgImageUri = uri }

    val dialBackgroundColors = listOf(
        Color(0xFF0C100D),
        Color(0xFF141C16),
        Color(0xFF1F2833),
        Color(0xFF2C1B18),
        Color(0xFFFFFFFF)
    )
    var selectedDialColorIndex by remember { mutableStateOf(0) }
    var selectedIndexStyle by remember { mutableStateOf(DialIndexStyle.NONE) }

    // إحداثيات السحب والإفلات باللمس المباشر
    var dateOffsetDp by remember { mutableStateOf(Offset(0f, -80f)) }
    var widget1OffsetDp by remember { mutableStateOf(Offset(75f, 0f)) }
    var widget2OffsetDp by remember { mutableStateOf(Offset(0f, 75f)) }

    // مربعات الحوار (Install & Save)
    var showInstallDialog by remember { mutableStateOf(false) }
    var showSaveDialog by remember { mutableStateOf(false) }
    var isInstalling by remember { mutableStateOf(false) }

    ModalNavigationDrawer(
        drawerState = drawerState,
        drawerContent = {
            ModalDrawerSheet(
                drawerContainerColor = Color(0xFF101612),
                modifier = Modifier.width(300.dp)
            ) {
                Spacer(modifier = Modifier.height(24.dp))
                Row(
                    modifier = Modifier.padding(horizontal = 20.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Box(
                        modifier = Modifier
                            .size(42.dp)
                            .clip(CircleShape)
                            .background(Color(0xFF2E694E)),
                        contentAlignment = Alignment.Center
                    ) {
                        Icon(Icons.Default.Watch, contentDescription = null, tint = Color(0xFF98D7A5))
                    }
                    Spacer(modifier = Modifier.width(12.dp))
                    Column {
                        Text("Pixel Watch 3", fontWeight = FontWeight.Bold, color = Color.White, fontSize = 16.sp)
                        Text("Cadran Analogique Pro", color = Color(0xFF98D7A5), fontSize = 12.sp)
                    }
                }

                Spacer(modifier = Modifier.height(20.dp))
                HorizontalDivider(color = Color(0xFF1F2A22))
                Spacer(modifier = Modifier.height(10.dp))

                listOf(
                    Pair("Constructeur", Icons.Default.Brush),
                    Pair("Effets", Icons.Default.AutoAwesome),
                    Pair("Aiguilles", Icons.Default.Schedule),
                    Pair("Complications", Icons.Default.Widgets),
                    Pair("Sauvegardes", Icons.Default.BookmarkBorder),
                    Pair("Accueil", Icons.Default.Home),
                    Pair("Informations", Icons.Default.Info),
                    Pair("Paramètres", Icons.Default.Settings)
                ).forEach { (screenName, icon) ->
                    val isSelected = currentScreen == screenName
                    NavigationDrawerItem(
                        icon = { Icon(icon, contentDescription = null, tint = if (isSelected) Color(0xFF0F381E) else Color.LightGray) },
                        label = { Text(screenName, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal) },
                        selected = isSelected,
                        onClick = {
                            currentScreen = screenName
                            scope.launch { drawerState.close() }
                        },
                        colors = NavigationDrawerItemDefaults.colors(
                            selectedContainerColor = Color(0xFF98D7A5),
                            selectedTextColor = Color(0xFF0F381E),
                            unselectedTextColor = Color.White
                        ),
                        modifier = Modifier.padding(horizontal = 12.dp, vertical = 4.dp)
                    )
                }
            }
        }
    ) {
        Scaffold(
            topBar = {
                if (currentScreen != "Effets") {
                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .statusBarsPadding()
                            .padding(top = 22.dp, start = 16.dp, end = 16.dp, bottom = 8.dp),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        IconButton(
                            onClick = { scope.launch { drawerState.open() } },
                            modifier = Modifier
                                .size(44.dp)
                                .clip(CircleShape)
                                .background(Color(0xFF161E18))
                        ) {
                            Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color.White, modifier = Modifier.size(24.dp))
                        }
                        Text(
                            currentScreen,
                            fontSize = 20.sp,
                            fontWeight = FontWeight.Bold,
                            color = Color.White
                        )
                        IconButton(
                            onClick = { showSaveDialog = true },
                            modifier = Modifier
                                .size(44.dp)
                                .clip(CircleShape)
                                .background(Color(0xFF161E18))
                        ) {
                            Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF98D7A5), modifier = Modifier.size(24.dp))
                        }
                    }
                }
            },
            containerColor = Color(0xFF0C100D)
        ) { innerPadding ->
            Box(modifier = Modifier.fillMaxSize().padding(if (currentScreen == "Effets") PaddingValues(0.dp) else innerPadding)) {
                when (currentScreen) {
                    "Effets" -> {
                        EffetsScreen(
                            selectedBgImageUri = selectedBgImageUri,
                            selectedBadgeShape = selectedBadgeShape,
                            onShapeChange = { selectedBadgeShape = it },
                            selectedColorIndex = selectedWidgetColorIndex,
                            onColorChange = { selectedWidgetColorIndex = it },
                            intensity = badgeOpacity,
                            onIntensityChange = { badgeOpacity = it },
                            onBack = { currentScreen = "Constructeur" },
                            onConfirm = {
                                Toast.makeText(context, "Effets appliqués avec succès", Toast.LENGTH_SHORT).show()
                                currentScreen = "Constructeur"
                            }
                        )
                    }
                    "Aiguilles" -> {
                        AiguillesScreen(
                            selectedHandStyle = selectedHandStyle,
                            onHandStyleChange = { selectedHandStyle = it },
                            handColorPalettes = handColorPalettes,
                            selectedHandColorIndex = selectedHandColorIndex,
                            onHandColorChange = { selectedHandColorIndex = it },
                            selectedIndexStyle = selectedIndexStyle,
                            onIndexStyleChange = { selectedIndexStyle = it }
                        )
                    }
                    "Complications" -> {
                        ComplicationsScreen(
                            activeWidget1 = activeWidget1,
                            onSelectWidget1 = { activeWidget1 = it },
                            activeWidget2 = activeWidget2,
                            onSelectWidget2 = { activeWidget2 = it },
                            displayStyle = displayStyle,
                            onDisplayStyleChange = { displayStyle = it },
                            dateFormat = dateFormatChoice,
                            onDateFormatChange = { dateFormatChoice = it },
                            onOpenPicker = { showWidgetPickerSheet = true }
                        )
                    }
                    "Sauvegardes" -> {
                        SauvegardesScreen(
                            onLoadPreset = { presetHand, presetColor, presetShape ->
                                selectedHandStyle = presetHand
                                selectedHandColorIndex = presetColor
                                selectedBadgeShape = presetShape
                                Toast.makeText(context, "Préréglage chargé !", Toast.LENGTH_SHORT).show()
                                currentScreen = "Constructeur"
                            },
                            onSaveCurrent = { showSaveDialog = true }
                        )
                    }
                    "Accueil" -> {
                        AccueilScreen(
                            onGoToBuilder = { currentScreen = "Constructeur" },
                            onGoToEffets = { currentScreen = "Effets" },
                            isAod = isAod,
                            onToggleAod = { isAod = !isAod }
                        )
                    }
                    "Informations" -> {
                        InformationsScreen()
                    }
                    "Paramètres" -> {
                        ParametresScreen(
                            isAod = isAod,
                            onToggleAod = { isAod = !isAod }
                        )
                    }
                    else -> { // Constructeur
                        Box(modifier = Modifier.fillMaxSize()) {
                            Column(
                                modifier = Modifier
                                    .fillMaxSize()
                                    .verticalScroll(rememberScrollState(), enabled = !isDraggingWidget)
                                    .padding(horizontal = 16.dp, vertical = 4.dp),
                                horizontalAlignment = Alignment.CenterHorizontally
                            ) {
                                // شريط الأدوات السريع
                                Row(
                                    modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                    horizontalArrangement = Arrangement.SpaceBetween,
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    OutlinedButton(
                                        onClick = { photoPickerLauncher.launch("image/*") },
                                        shape = RoundedCornerShape(20.dp),
                                        colors = ButtonDefaults.outlinedButtonColors(contentColor = Color.White),
                                        border = BorderStroke(1.dp, Color(0xFF2E694E))
                                    ) {
                                        Icon(Icons.Default.AddPhotoAlternate, contentDescription = null, tint = Color(0xFF98D7A5), modifier = Modifier.size(16.dp))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text(if (selectedBgImageUri != null) "Photo active" else "Image fond", fontSize = 12.sp, color = Color.White)
                                    }

                                    Box(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(20.dp))
                                            .background(Color(0xFF1C2B20))
                                            .clickable { currentScreen = "Effets" }
                                            .padding(horizontal = 14.dp, vertical = 8.dp)
                                    ) {
                                        Row(verticalAlignment = Alignment.CenterVertically) {
                                            Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = Color(0xFF98D7A5), modifier = Modifier.size(16.dp))
                                            Spacer(modifier = Modifier.width(6.dp))
                                            Text("Effets & Formes", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                        }
                                    }

                                    if (selectedBgImageUri != null) {
                                        IconButton(onClick = { selectedBgImageUri = null }) {
                                            Icon(Icons.Default.Delete, contentDescription = "Remove Bg", tint = Color(0xFFFF8A80))
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(6.dp))

                                // قرص الساعة التفاعلي مع السحب والتحريك
                                Box(
                                    modifier = Modifier
                                        .size(310.dp)
                                        .clip(CircleShape)
                                        .background(dialBackgroundColors[selectedDialColorIndex])
                                        .border(2.dp, Color(0xFF263228), CircleShape),
                                    contentAlignment = Alignment.Center
                                ) {
                                    if (selectedBgImageUri != null) {
                                        AsyncImage(
                                            model = selectedBgImageUri,
                                            contentDescription = "Custom Bg",
                                            modifier = Modifier.fillMaxSize().clip(CircleShape),
                                            alpha = if (isAod) 0.35f else 1f,
                                            contentScale = ContentScale.Crop
                                        )
                                    }

                                    AnalogEngineScreen(
                                        isAod = isAod,
                                        handStyle = selectedHandStyle,
                                        handColors = handColorPalettes[selectedHandColorIndex].second,
                                        badgeShape = selectedBadgeShape,
                                        badgeOpacity = badgeOpacity,
                                        badgeColor = widgetColorList[selectedWidgetColorIndex].second,
                                        dateFormat = dateFormatChoice,
                                        displayStyle = displayStyle,
                                        indexStyle = selectedIndexStyle,
                                        widget1 = activeWidget1,
                                        widget2 = activeWidget2,
                                        dateOffset = dateOffsetDp,
                                        onDateOffsetChange = { dateOffsetDp = it },
                                        widget1Offset = widget1OffsetDp,
                                        onWidget1OffsetChange = { widget1OffsetDp = it },
                                        widget2Offset = widget2OffsetDp,
                                        onWidget2OffsetChange = { widget2OffsetDp = it },
                                        onDragStateChange = { isDraggingWidget = it }
                                    )
                                }

                                Spacer(modifier = Modifier.height(10.dp))

                                // زرا Actif و AOD (المختصر) وإعادة التعيين
                                Row(
                                    modifier = Modifier.fillMaxWidth(),
                                    horizontalArrangement = Arrangement.spacedBy(10.dp),
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    Button(
                                        onClick = { isAod = false },
                                        modifier = Modifier.weight(1f).height(46.dp),
                                        shape = RoundedCornerShape(24.dp),
                                        colors = ButtonDefaults.buttonColors(
                                            containerColor = if (!isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                            contentColor = if (!isAod) Color(0xFF0F381E) else Color.White
                                        )
                                    ) {
                                        Icon(Icons.Default.WbSunny, contentDescription = null, modifier = Modifier.size(18.dp))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text("Actif", fontWeight = FontWeight.Bold)
                                    }

                                    Button(
                                        onClick = { isAod = true },
                                        modifier = Modifier.weight(1f).height(46.dp),
                                        shape = RoundedCornerShape(24.dp),
                                        colors = ButtonDefaults.buttonColors(
                                            containerColor = if (isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                            contentColor = if (isAod) Color(0xFF0F381E) else Color.White
                                        )
                                    ) {
                                        Icon(Icons.Default.NightlightRound, contentDescription = "AOD", modifier = Modifier.size(18.dp))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text("AOD", fontWeight = FontWeight.Bold)
                                    }

                                    IconButton(
                                        onClick = {
                                            dateOffsetDp = Offset(0f, -80f)
                                            widget1OffsetDp = Offset(75f, 0f)
                                            widget2OffsetDp = Offset(0f, 75f)
                                            Toast.makeText(context, "Positions réinitialisées", Toast.LENGTH_SHORT).show()
                                        },
                                        modifier = Modifier.size(46.dp).clip(CircleShape).background(Color(0xFF1B241D))
                                    ) {
                                        Icon(Icons.Default.Refresh, contentDescription = "Reset", tint = Color.White)
                                    }
                                }

                                Spacer(modifier = Modifier.height(14.dp))

                                // أنواع العقارب (Hand Styles)
                                CardBox {
                                    Text("2. Types d'aiguilles (أنواع العقارب)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                    Spacer(modifier = Modifier.height(10.dp))
                                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                        HandStyle.values().forEach { style ->
                                            val isSelected = selectedHandStyle == style
                                            Box(
                                                modifier = Modifier
                                                    .weight(1f)
                                                    .height(44.dp)
                                                    .clip(RoundedCornerShape(12.dp))
                                                    .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                    .clickable { selectedHandStyle = style },
                                                contentAlignment = Alignment.Center
                                            ) {
                                                Text(
                                                    style.name.lowercase().capitalize(),
                                                    fontWeight = FontWeight.Bold,
                                                    fontSize = 11.sp,
                                                    color = if (isSelected) Color(0xFF0F381E) else Color.White
                                                )
                                            }
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(12.dp))

                                // ألوان العقارب في خط واحد (Couleurs des aiguilles en une seule ligne)
                                CardBox {
                                    Row(
                                        modifier = Modifier.fillMaxWidth(),
                                        horizontalArrangement = Arrangement.SpaceBetween,
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Text("1. Couleurs des aiguilles (ألوان العقارب)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                        Text(
                                            handColorPalettes[selectedHandColorIndex].first,
                                            fontSize = 11.sp,
                                            color = Color(0xFF98D7A5),
                                            fontWeight = FontWeight.Bold
                                        )
                                    }
                                    Spacer(modifier = Modifier.height(10.dp))
                                    Row(
                                        modifier = Modifier.fillMaxWidth(),
                                        horizontalArrangement = Arrangement.spacedBy(8.dp)
                                    ) {
                                        handColorPalettes.forEachIndexed { index, (_, pair) ->
                                            val isSelected = selectedHandColorIndex == index
                                            Box(
                                                modifier = Modifier
                                                    .weight(1f)
                                                    .height(44.dp)
                                                    .clip(RoundedCornerShape(14.dp))
                                                    .background(if (isSelected) Color(0xFF2E694E) else Color(0xFF18221A))
                                                    .border(
                                                        if (isSelected) 2.dp else 1.dp,
                                                        if (isSelected) Color(0xFF98D7A5) else Color(0xFF2A372C),
                                                        RoundedCornerShape(14.dp)
                                                    )
                                                    .clickable { selectedHandColorIndex = index },
                                                contentAlignment = Alignment.Center
                                            ) {
                                                Row(
                                                    verticalAlignment = Alignment.CenterVertically,
                                                    horizontalArrangement = Arrangement.Center
                                                ) {
                                                    Box(modifier = Modifier.size(15.dp).clip(CircleShape).background(pair.first))
                                                    Spacer(modifier = Modifier.width(4.dp))
                                                    Box(modifier = Modifier.size(15.dp).clip(CircleShape).background(pair.second))
                                                }
                                            }
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(12.dp))

                                // أشكال Material You الأصلية
                                CardBox {
                                    Row(
                                        modifier = Modifier.fillMaxWidth(),
                                        horizontalArrangement = Arrangement.SpaceBetween,
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Column {
                                            Text("3. Formes Material You (الأشكال الأصلية)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                            Text("شكل الحاوية والمؤشرات كما في الصورة المرفقة", fontSize = 11.sp, color = Color(0xFFE89B85))
                                        }
                                        TextButton(onClick = { currentScreen = "Effets" }) {
                                            Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = Color(0xFFE89B85), modifier = Modifier.size(16.dp))
                                            Spacer(modifier = Modifier.width(4.dp))
                                            Text("Effets ›", color = Color(0xFFE89B85), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                        }
                                    }
                                    Spacer(modifier = Modifier.height(10.dp))

                                    Row(
                                        modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                                    ) {
                                        val shapeNames = listOf("Cercle", "Squircle", "Dôme", "Trèfle", "Fleur 8", "Hexagone", "Pilule")
                                        shapeNames.forEachIndexed { index, name ->
                                            val isSelected = selectedBadgeShape == index
                                            Column(
                                                horizontalAlignment = Alignment.CenterHorizontally,
                                                modifier = Modifier.clickable { selectedBadgeShape = index }
                                            ) {
                                                Box(
                                                    modifier = Modifier
                                                        .size(62.dp)
                                                        .clip(RoundedCornerShape(22.dp))
                                                        .background(if (isSelected) Color(0xFFE89B85) else Color(0xFF281E1B))
                                                        .border(if (isSelected) 2.dp else 1.dp, if (isSelected) Color(0xFFFFCCBC) else Color(0xFF382C27), RoundedCornerShape(22.dp)),
                                                    contentAlignment = Alignment.Center
                                                ) {
                                                    Box(modifier = Modifier.size(36.dp)) {
                                                        Canvas(modifier = Modifier.fillMaxSize()) {
                                                            drawMaterialYouShapeGeometry(
                                                                shapeIndex = index,
                                                                color = if (isSelected) Color(0xFF381E15) else Color(0xFFD4C2BC),
                                                                style = Fill
                                                            )
                                                        }
                                                    }
                                                }
                                                Spacer(modifier = Modifier.height(5.dp))
                                                Text(name, fontSize = 11.sp, color = if (isSelected) Color(0xFFE89B85) else Color.LightGray, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal)
                                            }
                                        }
                                    }

                                    Spacer(modifier = Modifier.height(14.dp))
                                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                        Text("Opacité du fond (الشفافية)", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color.White)
                                        Text("${(badgeOpacity * 100).toInt()}%", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = Color(0xFFE89B85))
                                    }
                                    Slider(
                                        value = badgeOpacity,
                                        onValueChange = { badgeOpacity = it },
                                        valueRange = 0.1f..1f,
                                        colors = SliderDefaults.colors(thumbColor = Color(0xFFE89B85), activeTrackColor = Color(0xFF8D503C), inactiveTrackColor = Color(0xFF281E1B))
                                    )
                                }

                                Spacer(modifier = Modifier.height(100.dp))
                            }

                            // زر التثبيت العائم
                            FloatingActionButton(
                                onClick = {
                                    showInstallDialog = true
                                    isInstalling = true
                                },
                                modifier = Modifier.align(Alignment.BottomEnd).padding(20.dp),
                                containerColor = Color(0xFF98D7A5),
                                contentColor = Color(0xFF0F381E),
                                shape = RoundedCornerShape(22.dp)
                            ) {
                                Row(
                                    modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
                                    verticalAlignment = Alignment.CenterVertically
                                ) {
                                    Icon(Icons.Default.Download, contentDescription = null)
                                    Spacer(modifier = Modifier.width(8.dp))
                                    Text("Installer", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// -------------------------------------------------------------
// محرك رسم الواجهة التناظرية مع دعم السحب باللمس الحقيقي
// -------------------------------------------------------------
@Composable
fun AnalogEngineScreen(
    isAod: Boolean,
    handStyle: HandStyle,
    handColors: Pair<Color, Color>,
    badgeShape: Int,
    badgeOpacity: Float,
    badgeColor: Color,
    dateFormat: String,
    displayStyle: String,
    indexStyle: DialIndexStyle,
    widget1: WidgetType?,
    widget2: WidgetType?,
    dateOffset: Offset,
    onDateOffsetChange: (Offset) -> Unit,
    widget1Offset: Offset,
    onWidget1OffsetChange: (Offset) -> Unit,
    widget2Offset: Offset,
    onWidget2OffsetChange: (Offset) -> Unit,
    onDragStateChange: (Boolean) -> Unit
) {
    var currentTime by remember { mutableStateOf(Calendar.getInstance()) }

    LaunchedEffect(Unit) {
        while (true) {
            currentTime = Calendar.getInstance()
            delay(1000)
        }
    }

    val hours = currentTime.get(Calendar.HOUR)
    val minutes = currentTime.get(Calendar.MINUTE)
    val seconds = currentTime.get(Calendar.SECOND)

    val hourAngle = ((hours % 12) + minutes / 60f) * 30f
    val minuteAngle = (minutes + seconds / 60f) * 6f
    val secondAngle = seconds * 6f

    Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
        // 1. علامات الساعات والأرقام
        Canvas(modifier = Modifier.fillMaxSize()) {
            val center = Offset(size.width / 2f, size.height / 2f)
            val radius = size.minDimension / 2f

            when (indexStyle) {
                DialIndexStyle.DOTS -> {
                    for (i in 0 until 12) {
                        val angle = Math.toRadians((i * 30.0) - 90.0)
                        val dotR = radius * 0.88f
                        val x = (center.x + cos(angle) * dotR).toFloat()
                        val y = (center.y + sin(angle) * dotR).toFloat()
                        drawCircle(color = Color(0xFF98D7A5).copy(alpha = 0.6f), radius = 3.dp.toPx(), center = Offset(x, y))
                    }
                }
                DialIndexStyle.LINES -> {
                    for (i in 0 until 12) {
                        val angle = Math.toRadians((i * 30.0) - 90.0)
                        val startR = radius * 0.82f
                        val endR = radius * 0.90f
                        val start = Offset((center.x + cos(angle) * startR).toFloat(), (center.y + sin(angle) * startR).toFloat())
                        val end = Offset((center.x + cos(angle) * endR).toFloat(), (center.y + sin(angle) * endR).toFloat())
                        drawLine(color = Color.White.copy(alpha = 0.7f), start = start, end = end, strokeWidth = 2.5.dp.toPx())
                    }
                }
                DialIndexStyle.NUMBERS -> { /* الأرقام يتم رسمها */ }
                DialIndexStyle.NONE -> { /* تصميم نقي تماماً بدون أي تشويش */ }
            }
        }

        // 2. الودجة 1 (قابلة للسحب باللمس الحر)
        if (widget1 != null) {
            Box(
                modifier = Modifier
                    .offset { IntOffset(widget1Offset.x.roundToInt(), widget1Offset.y.roundToInt()) }
                    .pointerInput(Unit) {
                        detectDragGestures(
                            onDragStart = { onDragStateChange(true) },
                            onDragEnd = { onDragStateChange(false) },
                            onDragCancel = { onDragStateChange(false) },
                            onDrag = { change, dragAmount ->
                                change.consume()
                                onWidget1OffsetChange(widget1Offset + dragAmount)
                            }
                        )
                    }
            ) {
                ComplicationItem(
                    type = widget1,
                    shapeIndex = badgeShape,
                    opacity = badgeOpacity,
                    color = badgeColor,
                    displayStyle = displayStyle
                )
            }
        }

        // 3. الودجة 2 (قابلة للسحب باللمس الحر)
        if (widget2 != null) {
            Box(
                modifier = Modifier
                    .offset { IntOffset(widget2Offset.x.roundToInt(), widget2Offset.y.roundToInt()) }
                    .pointerInput(Unit) {
                        detectDragGestures(
                            onDragStart = { onDragStateChange(true) },
                            onDragEnd = { onDragStateChange(false) },
                            onDragCancel = { onDragStateChange(false) },
                            onDrag = { change, dragAmount ->
                                change.consume()
                                onWidget2OffsetChange(widget2Offset + dragAmount)
                            }
                        )
                    }
            ) {
                ComplicationItem(
                    type = widget2,
                    shapeIndex = badgeShape,
                    opacity = badgeOpacity,
                    color = badgeColor,
                    displayStyle = displayStyle
                )
            }
        }

        // 4. التاريخ القابل للسحب باللمس الحر
        Box(
            modifier = Modifier
                .offset { IntOffset(dateOffset.x.roundToInt(), dateOffset.y.roundToInt()) }
                .pointerInput(Unit) {
                    detectDragGestures(
                        onDragStart = { onDragStateChange(true) },
                        onDragEnd = { onDragStateChange(false) },
                        onDragCancel = { onDragStateChange(false) },
                        onDrag = { change, dragAmount ->
                            change.consume()
                            onDateOffsetChange(dateOffset + dragAmount)
                        }
                    )
                }
                .clip(RoundedCornerShape(12.dp))
                .background(Color(0xFF141C16).copy(alpha = 0.75f))
                .padding(horizontal = 8.dp, vertical = 3.dp)
        ) {
            val dateText = SimpleDateFormat(if (dateFormat == "Mon 5") "EEE d" else "d MMM", Locale.FRENCH).format(Date())
            Text(dateText, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
        }

        // 5. رسم العقارب التناظرية الفاخرة
        Canvas(modifier = Modifier.fillMaxSize()) {
            val center = Offset(size.width / 2f, size.height / 2f)
            val r = size.minDimension / 2f

            val primaryColor = handColors.first
            val accentColor = handColors.second

            fun drawHand(angleDeg: Float, length: Float, strokeW: Float, color: Color, roundCaps: Boolean = true) {
                val rad = Math.toRadians((angleDeg - 90.0))
                val end = Offset((center.x + cos(rad) * length).toFloat(), (center.y + sin(rad) * length).toFloat())
                val backRad = Math.toRadians((angleDeg + 90.0))
                val backEnd = Offset((center.x + cos(backRad) * (length * 0.18f)).toFloat(), (center.y + sin(backRad) * (length * 0.18f)).toFloat())
                drawLine(
                    color = color,
                    start = backEnd,
                    end = end,
                    strokeWidth = strokeW,
                    cap = if (roundCaps) StrokeCap.Round else StrokeCap.Square
                )
            }

            when (handStyle) {
                HandStyle.CLASSIC -> {
                    drawHand(hourAngle, r * 0.52f, 7.5.dp.toPx(), primaryColor)
                    drawHand(minuteAngle, r * 0.78f, 5.5.dp.toPx(), primaryColor)
                    if (!isAod) {
                        drawHand(secondAngle, r * 0.85f, 2.dp.toPx(), accentColor)
                    }
                }
                HandStyle.PIXEL_PILL -> {
                    drawHand(hourAngle, r * 0.50f, 10.dp.toPx(), primaryColor)
                    drawHand(minuteAngle, r * 0.76f, 7.5.dp.toPx(), primaryColor)
                    if (!isAod) {
                        drawHand(secondAngle, r * 0.86f, 2.5.dp.toPx(), accentColor)
                    }
                }
                HandStyle.SPORT -> {
                    drawHand(hourAngle, r * 0.54f, 8.dp.toPx(), primaryColor)
                    drawHand(minuteAngle, r * 0.80f, 6.dp.toPx(), primaryColor)
                    if (!isAod) {
                        drawHand(secondAngle, r * 0.88f, 3.dp.toPx(), accentColor)
                    }
                }
                HandStyle.MINIMAL -> {
                    drawHand(hourAngle, r * 0.50f, 4.dp.toPx(), primaryColor)
                    drawHand(minuteAngle, r * 0.78f, 3.dp.toPx(), primaryColor)
                    if (!isAod) {
                        drawHand(secondAngle, r * 0.84f, 1.5.dp.toPx(), accentColor)
                    }
                }
            }

            // النقطة المركزية
            drawCircle(primaryColor, radius = 5.dp.toPx(), center = center)
            drawCircle(accentColor, radius = 2.5.dp.toPx(), center = center)
        }
    }
}

// -------------------------------------------------------------
// رسم أشكال Material You السبعة المعتمدة بدقة هندسية تامة
// -------------------------------------------------------------
fun DrawScope.drawMaterialYouShapeGeometry(shapeIndex: Int, color: Color, style: androidx.compose.ui.graphics.drawscope.DrawStyle) {
    val center = Offset(size.width / 2f, size.height / 2f)
    val r = size.minDimension / 2f

    when (shapeIndex) {
        0 -> { // 0: Cercle
            val radius = r * 0.85f
            drawCircle(color, radius = radius, center = center, style = style)
        }
        1 -> { // 1: Carré arrondi (Squircle)
            val pad = r * 0.16f
            val sz = size.minDimension - (pad * 2f)
            val corner = sz * 0.28f
            val topL = Offset((size.width - sz) / 2f, (size.height - sz) / 2f)
            if (style is Fill) {
                drawRoundRect(color, topLeft = topL, size = Size(sz, sz), cornerRadius = CornerRadius(corner, corner))
            } else {
                drawRoundRect(color, topLeft = topL, size = Size(sz, sz), cornerRadius = CornerRadius(corner, corner), style = style)
            }
        }
        2 -> { // 2: Dôme / Arche
            val w = r * 1.55f
            val h = r * 1.68f
            val left = center.x - w / 2f
            val top = center.y - h / 2f
            val cornerBottom = 8.dp.toPx()
            val path = Path().apply {
                arcTo(
                    rect = androidx.compose.ui.geometry.Rect(left, top, left + w, top + w),
                    startAngleDegrees = 180f,
                    sweepAngleDegrees = 180f,
                    forceMoveTo = false
                )
                lineTo(left + w, top + h - cornerBottom)
                quadraticBezierTo(left + w, top + h, left + w - cornerBottom, top + h)
                lineTo(left + cornerBottom, top + h)
                quadraticBezierTo(left, top + h, left, top + h - cornerBottom)
                close()
            }
            drawPath(path, color, style = style)
        }
        3 -> { // 3: Trèfle 4 lobes
            val path = Path()
            val steps = 360
            for (deg in 0 until steps) {
                val rad = Math.toRadians(deg.toDouble())
                val currentRadius = r * (0.68f + 0.22f * cos(4.0 * rad)).toFloat()
                val x = (center.x + cos(rad) * currentRadius).toFloat()
                val y = (center.y + sin(rad) * currentRadius).toFloat()
                if (deg == 0) path.moveTo(x, y) else path.lineTo(x, y)
            }
            path.close()
            drawPath(path, color, style = style)
        }
        4 -> { // 4: Fleur 8 lobes
            val path = Path()
            val steps = 360
            for (deg in 0 until steps) {
                val rad = Math.toRadians(deg.toDouble())
                val currentRadius = r * (0.76f + 0.16f * cos(8.0 * rad)).toFloat()
                val x = (center.x + cos(rad) * currentRadius).toFloat()
                val y = (center.y + sin(rad) * currentRadius).toFloat()
                if (deg == 0) path.moveTo(x, y) else path.lineTo(x, y)
            }
            path.close()
            drawPath(path, color, style = style)
        }
        5 -> { // 5: Hexagone
            val path = Path()
            for (i in 0 until 6) {
                val rad = Math.toRadians((i * 60.0) - 30.0)
                val x = (center.x + cos(rad) * r * 0.90f).toFloat()
                val y = (center.y + sin(rad) * r * 0.90f).toFloat()
                if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
            }
            path.close()
            drawPath(path, color, style = style)
        }
        else -> { // 6: Pilule / Stadium
            val w = r * 1.75f
            val h = r * 1.22f
            val left = center.x - w / 2f
            val top = center.y - h / 2f
            if (style is Fill) {
                drawRoundRect(color, topLeft = Offset(left, top), size = Size(w, h), cornerRadius = CornerRadius(h / 2f, h / 2f))
            } else {
                drawRoundRect(color, topLeft = Offset(left, top), size = Size(w, h), cornerRadius = CornerRadius(h / 2f, h / 2f), style = style)
            }
        }
    }
}

// -------------------------------------------------------------
// عنصر الودجة التفاعلية (Complication Item)
// -------------------------------------------------------------
@Composable
fun ComplicationItem(
    type: WidgetType,
    shapeIndex: Int,
    opacity: Float,
    color: Color,
    displayStyle: String
) {
    Box(
        modifier = Modifier.size(54.dp),
        contentAlignment = Alignment.Center
    ) {
        Canvas(modifier = Modifier.fillMaxSize()) {
            drawMaterialYouShapeGeometry(shapeIndex = shapeIndex, color = color.copy(alpha = opacity), style = Fill)
            drawMaterialYouShapeGeometry(shapeIndex = shapeIndex, color = color.copy(alpha = 0.85f), style = Stroke(width = 1.5.dp.toPx()))
        }

        Column(
            horizontalAlignment = Alignment.CenterHorizontally,
            verticalArrangement = Arrangement.Center
        ) {
            Icon(type.icon, contentDescription = type.title, tint = Color.White, modifier = Modifier.size(20.dp))
            if (displayStyle == "Icon + %" || displayStyle == "Text") {
                val valueText = when (type) {
                    WidgetType.BATTERY -> "88%"
                    WidgetType.STEPS -> "6.2k"
                    WidgetType.HEART -> "72"
                    WidgetType.WEATHER -> "24°"
                    WidgetType.DATE -> "06"
                }
                Text(valueText, fontSize = 9.sp, fontWeight = FontWeight.Bold, color = Color.White)
            }
        }
    }
}

