                    WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                )

                if (checkSelfPermission(Manifest.permission.BODY_SENSORS) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.BODY_SENSORS), 101)
                }

                setContent {
                    WearCustomizableWatchSurface()
                }
            }
        }

        @Composable
        fun WearCustomizableWatchSurface() {
            var modeIndex by remember { mutableStateOf(0) } // 0: Digital (10:08), 1: Analogique
            var timeString by remember { mutableStateOf("10:08") }

            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    timeString = String.format("%02d:%02d", cal.get(Calendar.HOUR_OF_DAY), m)
                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f

                    delay(40)
                }
            }

            Box(
                modifier = Modifier
                    .fillMaxSize()
                    .clip(CircleShape)
                    .background(Color.Black)
                    .clickable { modeIndex = (modeIndex + 1) % 2 },
                contentAlignment = Alignment.Center
            ) {
                if (modeIndex == 0) {
                    // العرض الرقمي المتطابق مع لقطات الشاشة
                    Column(
                        modifier = Modifier.fillMaxSize(),
                        horizontalAlignment = Alignment.CenterHorizontally,
                        verticalArrangement = Arrangement.SpaceBetween
                    ) {
                        Box(
                            modifier = Modifier
                                .padding(top = 22.dp)
                                .clip(RoundedCornerShape(10.dp))
                                .background(Color.White.copy(alpha = 0.25f))
                                .padding(horizontal = 12.dp, vertical = 3.dp)
                        ) {
                            Text("5 Feb", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                        }

                        Row(
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.Center,
                            modifier = Modifier.padding(horizontal = 12.dp)
                        ) {
                            Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(end = 6.dp)) {
                                Icon(Icons.Default.DirectionsWalk, contentDescription = null, tint = Color.White, modifier = Modifier.size(14.dp))
                                Text("8,532", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                            }
                            Text(timeString, color = Color.White, fontSize = 54.sp, fontWeight = FontWeight.Bold)
                        }

                        Box(
                            modifier = Modifier
                                .padding(bottom = 22.dp)
                                .clip(RoundedCornerShape(16.dp))
                                .background(Color.White.copy(alpha = 0.28f))
                                .padding(horizontal = 14.dp, vertical = 6.dp),
                            contentAlignment = Alignment.Center
                        ) {
                            Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color.White, modifier = Modifier.size(15.dp))
                                Text("85%", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                            }
                        }
                    }
                } else {
                    // العرض العقاربي (Analogique)
                    Canvas(modifier = Modifier.fillMaxSize(0.88f)) {
                        val center = Offset(size.width / 2f, size.height / 2f)
                        val r = size.minDimension / 2f

                        for (i in 0 until 12) {
                            val rad = Math.toRadians((i * 30.0) - 90.0)
                            val p1 = Offset((center.x + cos(rad) * r * 0.88f).toFloat(), (center.y + sin(rad) * r * 0.88f).toFloat())
                            val p2 = Offset((center.x + cos(rad) * r).toFloat(), (center.y + sin(rad) * r).toFloat())
                            drawLine(Color.White, p1, p2, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)
                        }

                        val hourRad = Math.toRadians((hourAngle - 90.0))
                        val minRad = Math.toRadians((minuteAngle - 90.0))
                        drawLine(Color.White, center, Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat()), 6.dp.toPx(), StrokeCap.Round)
                        drawLine(Color.LightGray, center, Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat()), 4.dp.toPx(), StrokeCap.Round)

                        val secRad = Math.toRadians((secondAngle - 90.0))
                        drawLine(Color(0xFFFF3D00), center, Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat()), 2.dp.toPx(), StrokeCap.Round)
                        drawCircle(Color.White, radius = 5.dp.toPx(), center = center)
                    }
                }
            }
        }
