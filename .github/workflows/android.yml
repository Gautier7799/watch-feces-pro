name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Generate All Project Files
      run: |
        mkdir -p app/src/main/java/com/example/model
        mkdir -p app/src/main/java/com/example/components

        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google {
                    content {
                        includeGroupByRegex("com\\.android.*")
                        includeGroupByRegex("com\\.google.*")
                        includeGroupByRegex("androidx.*")
                    }
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app")
        EOF

        # 2. root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        # 3. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 1
                versionName = "1.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Pixel Watch Pro"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. WatchFaceType.kt
        cat << 'EOF' > app/src/main/java/com/example/model/WatchFaceType.kt
        package com.example.model

        import androidx.compose.ui.graphics.Color

        enum class WatchFaceType(val titleAr: String, val description: String) {
            CUSTOM_PHOTO("صورة وعقارب", "خلفية مخصصة من هاتفك مع عقارب أنالوج أنيقة"),
            MINIMAL_DIGITAL("رقمي كلاسيكي", "ساعة رقمية حديثة عالية التباين لسهولة القراءة")
        }

        enum class WatchColorTheme(val titleAr: String, val primary: Color, val accent: Color) {
            CORAL_PEACH("المرجاني الهادئ", Color(0xFFFF8A65), Color(0xFFFFCCBC)),
            MINT_EMERALD("الزمرد النضر", Color(0xFF00E676), Color(0xFFB9F6CA)),
            OBSIDIAN_GOLD("الذهب الأسود", Color(0xFFFFD54F), Color(0xFFFFF9C4)),
            BAY_BLUE("أزرق بيكسل", Color(0xFF448AFF), Color(0xFFBBDEFB)),
            LAVENDER_PURPLE("لافندر أنيق", Color(0xFFB388FF), Color(0xFFEDE7F6))
        }

        data class WatchComplicationData(
            val batteryLevel: Int = 84,
            val heartRate: Int = 75,
            val steps: Int = 4280,
            val temperatureFahrenheit: Int = 61,
            val dayOfWeek: String = "MON",
            val dateMonthDay: String = "08-24",
            val weatherIconMoon: Boolean = true
        )
        EOF

        # 6. WatchFaceImageDial.kt
        cat << 'EOF' > app/src/main/java/com/example/components/WatchFaceImageDial.kt
        package com.example.components

        import android.net.Uri
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.BatteryChargingFull
        import androidx.compose.material.icons.filled.Favorite
        import androidx.compose.material3.Icon
        import androidx.compose.material3.Text
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import coil.compose.AsyncImage
        import com.example.model.WatchColorTheme
        import com.example.model.WatchComplicationData
        import kotlin.math.cos
        import kotlin.math.sin

        @Composable
        fun WatchFaceImageDial(
            hourAngle: Float,
            minuteAngle: Float,
            secondAngle: Float,
            imageUri: Uri? = null,
            theme: WatchColorTheme,
            complications: WatchComplicationData,
            isAod: Boolean = false,
            modifier: Modifier = Modifier
        ) {
            Box(
                modifier = modifier
                    .fillMaxSize()
                    .clip(CircleShape)
                    .background(Color.Black),
                contentAlignment = Alignment.Center
            ) {
                if (!isAod && imageUri != null) {
                    AsyncImage(
                        model = imageUri,
                        contentDescription = "Custom Dial Wallpaper",
                        modifier = Modifier.fillMaxSize(),
                        contentScale = ContentScale.Crop
                    )
                }

                Box(
                    modifier = Modifier
                        .fillMaxSize()
                        .background(if (isAod) Color.Black else Color.Black.copy(alpha = 0.25f))
                )

                if (!isAod) {
                    Row(
                        modifier = Modifier
                            .align(Alignment.TopCenter)
                            .padding(top = 42.dp),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.spacedBy(4.dp)
                    ) {
                        Icon(
                            imageVector = Icons.Default.Favorite,
                            contentDescription = null,
                            tint = Color(0xFFFF5252),
                            modifier = Modifier.size(14.dp)
                        )
                        Text(
                            text = "${complications.heartRate}",
                            color = Color.White,
                            fontSize = 12.sp,
                            fontWeight = FontWeight.Bold
                        )
                    }

                    Row(
                        modifier = Modifier
                            .align(Alignment.BottomCenter)
                            .padding(bottom = 42.dp),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.spacedBy(4.dp)
                    ) {
                        Icon(
                            imageVector = Icons.Default.BatteryChargingFull,
                            contentDescription = null,
                            tint = theme.accent,
                            modifier = Modifier.size(15.dp)
                        )
                        Text(
                            text = "${complications.batteryLevel}%",
                            color = Color.White,
                            fontSize = 12.sp,
                            fontWeight = FontWeight.Bold
                        )
                    }
                }

                Canvas(modifier = Modifier.fillMaxSize()) {
                    val radius = size.minDimension / 2f
                    val center = Offset(size.width / 2f, size.height / 2f)

                    for (i in 0 until 12) {
                        val angleRad = Math.toRadians((i * 30.0) - 90.0)
                        val startFactor = if (i % 3 == 0) 0.82f else 0.88f
                        val p1 = Offset(
                            (center.x + cos(angleRad) * (radius * startFactor)).toFloat(),
                            (center.y + sin(angleRad) * (radius * startFactor)).toFloat()
                        )
                        val p2 = Offset(
                            (center.x + cos(angleRad) * (radius * 0.94f)).toFloat(),
                            (center.y + sin(angleRad) * (radius * 0.94f)).toFloat()
                        )
                        drawLine(
                            color = if (i % 3 == 0) theme.primary else Color.White.copy(alpha = 0.6f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 4.dp.toPx() else 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    val hourLength = radius * 0.48f
                    drawLine(
                        color = Color.White,
                        start = center,
                        end = Offset(
                            (center.x + cos(hourRad) * hourLength).toFloat(),
                            (center.y + sin(hourRad) * hourLength).toFloat()
                        ),
                        strokeWidth = 6.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    val minLength = radius * 0.70f
                    drawLine(
                        color = theme.accent,
                        start = center,
                        end = Offset(
                            (center.x + cos(minRad) * minLength).toFloat(),
                            (center.y + sin(minRad) * minLength).toFloat()
                        ),
                        strokeWidth = 4.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        val secLength = radius * 0.82f
                        drawLine(
                            color = Color(0xFFFF5252),
                            start = center,
                            end = Offset(
                                (center.x + cos(secRad) * secLength).toFloat(),
                                (center.y + sin(secRad) * secLength).toFloat()
                            ),
                            strokeWidth = 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    drawCircle(color = Color.White, radius = 5.dp.toPx(), center = center)
                    drawCircle(color = Color.Black, radius = 2.dp.toPx(), center = center)
                }
            }
        }
        EOF

        # 7. WatchFaceMinimalDigital.kt
        cat << 'EOF' > app/src/main/java/com/example/components/WatchFaceMinimalDigital.kt
        package com.example.components

        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.BatteryChargingFull
        import androidx.compose.material.icons.filled.DirectionsWalk
        import androidx.compose.material.icons.filled.Favorite
        import androidx.compose.material3.Icon
        import androidx.compose.material3.Text
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontFamily
        import androidx.compose.ui.text.font.FontWeight
