        @Composable
        fun AnalogEngineScreen(
            isAod: Boolean,
            handStyle: HandStyle,
            handColors: Pair<Color, Color>,
            badgeShape: Int,
            badgeOpacity: Float,
            badgeColor: Color,
            dateFormat: String,
            displayStyle: String,
            showIndices: Boolean,
            widget1: WidgetType?,
            widget2: WidgetType?,
            dateOffset: Offset,
            onDateOffsetChange: (Offset) -> Unit,
            widget1Offset: Offset,
            onWidget1OffsetChange: (Offset) -> Unit,
            widget2Offset: Offset,
            onWidget2OffsetChange: (Offset) -> Unit,
            onDragStateChange: (Boolean) -> Unit
        ) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                if (showIndices) {
                    Canvas(modifier = Modifier.fillMaxSize(0.92f)) {
                        val center = Offset(size.width / 2f, size.height / 2f)
                        val r = size.minDimension / 2f

                        for (i in 0 until 12) {
                            val rad = Math.toRadians((i * 30.0) - 90.0)
                            val p1 = Offset((center.x + cos(rad) * r * 0.86f).toFloat(), (center.y + sin(rad) * r * 0.86f).toFloat())
                            val p2 = Offset((center.x + cos(rad) * r * 0.98f).toFloat(), (center.y + sin(rad) * r * 0.98f).toFloat())
                            drawLine(
                                color = if (i % 3 == 0) Color.White else Color.White.copy(alpha = 0.4f),
                                start = p1,
                                end = p2,
                                strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                                cap = StrokeCap.Round
                            )
                        }
                    }
                }

                if (dateFormat != "-") {
                    MaterialYouComplicationItem(
                        offsetDp = dateOffset,
                        onOffsetChange = onDateOffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        badgeColor = badgeColor,
                        onDragStateChange = onDragStateChange
                    ) {
                        Text(dateFormat, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }
                }

                if (widget1 != null) {
                    MaterialYouComplicationItem(
                        offsetDp = widget1Offset,
                        onOffsetChange = onWidget1OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        badgeColor = badgeColor,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderAnalogWidgetContent(widget1, displayStyle, badgeColor)
                    }
                }

                if (widget2 != null) {
                    MaterialYouComplicationItem(
                        offsetDp = widget2Offset,
                        onOffsetChange = onWidget2OffsetChange,
                        badgeShape = badgeShape,
                        opacity = badgeOpacity,
                        badgeColor = badgeColor,
                        onDragStateChange = onDragStateChange
                    ) {
                        RenderAnalogWidgetContent(widget2, displayStyle, badgeColor)
                    }
                }

                Canvas(modifier = Modifier.fillMaxSize(0.92f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    val mainHandColor = handColors.first
                    val secondHandColor = handColors.second

                    when (handStyle) {
                        HandStyle.CLASSIC -> {
                            drawHandClassic(center, r * 0.52f, hourAngle, 6.dp.toPx(), mainHandColor)
                            drawHandClassic(center, r * 0.78f, minuteAngle, 4.5.dp.toPx(), mainHandColor)
                        }
                        HandStyle.SPORT -> {
                            drawHandSport(center, r * 0.50f, hourAngle, 8.dp.toPx(), mainHandColor, secondHandColor)
                            drawHandSport(center, r * 0.76f, minuteAngle, 6.dp.toPx(), mainHandColor, secondHandColor)
                        }
                        HandStyle.PIXEL_PILL -> {
                            drawHandPixelPill(center, r * 0.52f, hourAngle, 10.dp.toPx(), mainHandColor)
                            drawHandPixelPill(center, r * 0.80f, minuteAngle, 8.dp.toPx(), mainHandColor)
                        }
                        HandStyle.MINIMAL -> {
                            val hourRad = Math.toRadians((hourAngle - 90.0))
                            val hourEnd = Offset((center.x + cos(hourRad) * r * 0.54f).toFloat(), (center.y + sin(hourRad) * r * 0.54f).toFloat())
                            drawLine(mainHandColor, center, hourEnd, strokeWidth = 3.dp.toPx(), cap = StrokeCap.Round)

                            val minRad = Math.toRadians((minuteAngle - 90.0))
                            val minEnd = Offset((center.x + cos(minRad) * r * 0.82f).toFloat(), (center.y + sin(minRad) * r * 0.82f).toFloat())
                            drawLine(mainHandColor, center, minEnd, strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)
                        }
                    }

                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        val secEnd = Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat())
                        val secTail = Offset((center.x - cos(secRad) * r * 0.18f).toFloat(), (center.y - sin(secRad) * r * 0.18f).toFloat())

                        drawLine(secondHandColor, secTail, secEnd, strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)
                        drawCircle(secondHandColor, radius = 4.dp.toPx(), center = center)
                        drawCircle(Color.Black, radius = 1.5.dp.toPx(), center = center)
                    } else {
                        drawCircle(Color.DarkGray, radius = 3.dp.toPx(), center = center)
                    }
                }
            }
        }

        fun DrawScope.drawHandClassic(center: Offset, length: Float, angleDeg: Float, width: Float, color: Color) {
            val rad = Math.toRadians((angleDeg - 90.0))
            val end = Offset((center.x + cos(rad) * length).toFloat(), (center.y + sin(rad) * length).toFloat())
            drawLine(color, center, end, strokeWidth = width, cap = StrokeCap.Round)
            val innerEnd = Offset((center.x + cos(rad) * length * 0.85f).toFloat(), (center.y + sin(rad) * length * 0.85f).toFloat())
            drawLine(Color(0xFF101412), center, innerEnd, strokeWidth = width * 0.35f, cap = StrokeCap.Round)
        }

        fun DrawScope.drawHandSport(center: Offset, length: Float, angleDeg: Float, width: Float, mainColor: Color, accentColor: Color) {
            val rad = Math.toRadians((angleDeg - 90.0))
            val end = Offset((center.x + cos(rad) * length).toFloat(), (center.y + sin(rad) * length).toFloat())
            drawLine(mainColor, center, end, strokeWidth = width, cap = StrokeCap.Square)
            val tipStart = Offset((center.x + cos(rad) * length * 0.70f).toFloat(), (center.y + sin(rad) * length * 0.70f).toFloat())
            drawLine(accentColor, tipStart, end, strokeWidth = width, cap = StrokeCap.Square)
        }

        fun DrawScope.drawHandPixelPill(center: Offset, length: Float, angleDeg: Float, width: Float, color: Color) {
            val rad = Math.toRadians((angleDeg - 90.0))
            val end = Offset((center.x + cos(rad) * length).toFloat(), (center.y + sin(rad) * length).toFloat())
            drawLine(color, center, end, strokeWidth = width, cap = StrokeCap.Round)
            drawLine(Color(0xFF1B221E), center, Offset((center.x + cos(rad) * length * 0.90f).toFloat(), (center.y + sin(rad) * length * 0.90f).toFloat()), strokeWidth = width * 0.3f, cap = StrokeCap.Round)
        }

        @Composable
        fun MaterialYouComplicationItem(
            offsetDp: Offset,
            onOffsetChange: (Offset) -> Unit,
            badgeShape: Int,
            opacity: Float,
            badgeColor: Color,
            onDragStateChange: (Boolean) -> Unit,
            content: @Composable () -> Unit
        ) {
            val density = LocalDensity.current
            val currentOffset by rememberUpdatedState(offsetDp)

            Box(
                modifier = Modifier
                    .offset {
                        IntOffset(
                            (offsetDp.x * density.density).roundToInt(),
                            (offsetDp.y * density.density).roundToInt()
                        )
                    }
                    .pointerInput(Unit) {
                        detectDragGestures(
                            onDragStart = { onDragStateChange(true) },
                            onDragEnd = { onDragStateChange(false) },
                            onDragCancel = { onDragStateChange(false) }
                        ) { change, dragAmount ->
                            change.consume()
                            val dxDp = dragAmount.x / density.density
                            val dyDp = dragAmount.y / density.density
                            val nx = (currentOffset.x + dxDp).coerceIn(-120f, 120f)
                            val ny = (currentOffset.y + dyDp).coerceIn(-120f, 120f)
                            onOffsetChange(Offset(nx, ny))
                        }
                    }
                    .size(62.dp),
                contentAlignment = Alignment.Center
            ) {
                Canvas(modifier = Modifier.fillMaxSize()) {
                    drawMaterialYouShapeGeometry(
                        shapeIndex = badgeShape,
                        color = badgeColor.copy(alpha = opacity * 0.55f),
                        style = Fill
                    )
                    drawMaterialYouShapeGeometry(
                        shapeIndex = badgeShape,
                        color = badgeColor.copy(alpha = 0.9f),
                        style = Stroke(width = 1.2.dp.toPx())
                    )
                }

                Box(modifier = Modifier.padding(4.dp), contentAlignment = Alignment.Center) {
                    content()
                }
            }
        }

        fun DrawScope.drawMaterialYouShapeGeometry(shapeIndex: Int, color: Color, style: androidx.compose.ui.graphics.drawscope.DrawStyle) {
            val center = Offset(size.width / 2f, size.height / 2f)
            val r = size.minDimension / 2f

            when (shapeIndex) {
                0 -> { // Squircle
                    val pad = r * 0.12f
                    val sz = size.minDimension - (pad * 2f)
                    val corner = r * 0.42f
                    if (style is Fill) {
                        drawRoundRect(color, topLeft = Offset(pad, pad), size = Size(sz, sz), cornerRadius = CornerRadius(corner, corner))
                    } else {
                        drawRoundRect(color, topLeft = Offset(pad, pad), size = Size(sz, sz), cornerRadius = CornerRadius(corner, corner), style = style)
                    }
                }
                1 -> { // Flower
                    val path = Path()
                    val lobes = 12
                    val rOuter = r * 0.92f
                    val rInner = r * 0.74f
                    for (i in 0 until lobes * 2) {
                        val curR = if (i % 2 == 0) rOuter else rInner
                        val angle = Math.toRadians((i * (360.0 / (lobes * 2))) - 90.0)
                        val x = (center.x + cos(angle) * curR).toFloat()
                        val y = (center.y + sin(angle) * curR).toFloat()
                        if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                    }
                    path.close()
                    drawPath(path, color, style = style)
                }
                2 -> { // Clover
                    val lobeRadius = r * 0.50f
                    val dist = r * 0.42f
                    for (i in 0 until 4) {
                        val rad = Math.toRadians(i * 90.0)
                        val cx = (center.x + cos(rad) * dist).toFloat()
                        val cy = (center.y + sin(rad) * dist).toFloat()
                        drawCircle(color, radius = lobeRadius, center = Offset(cx, cy), style = style)
                    }
                    drawCircle(color, radius = r * 0.65f, center = center, style = style)
                }
                3 -> { // Cookie
                    val path = Path()
                    val lobes = 8
                    val rOuter = r * 0.92f
                    val rInner = r * 0.76f
                    for (i in 0 until lobes * 2) {
                        val curR = if (i % 2 == 0) rOuter else rInner
                        val angle = Math.toRadians((i * (360.0 / (lobes * 2))) - 90.0)
                        val x = (center.x + cos(angle) * curR).toFloat()
                        val y = (center.y + sin(angle) * curR).toFloat()
                        if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                    }
                    path.close()
                    drawPath(path, color, style = style)
                }
                4 -> { // Hexagon
                    val path = Path()
                    for (i in 0 until 6) {
                        val rad = Math.toRadians((i * 60.0) - 30.0)
                        val x = (center.x + cos(rad) * r * 0.92f).toFloat()
                        val y = (center.y + sin(rad) * r * 0.92f).toFloat()
                        if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                    }
                    path.close()
                    drawPath(path, color, style = style)
                }
                5 -> { // Dome
                    val path = Path()
                    val w = r * 1.55f
                    val h = r * 1.7f
                    val left = center.x - w / 2f
                    val top = center.y - h / 2f
                    path.moveTo(left, top + w / 2f)
                    path.arcTo(
                        rect = androidx.compose.ui.geometry.Rect(left, top, left + w, top + w),
                        startAngleDegrees = 180f,
                        sweepAngleDegrees = 180f,
                        forceMoveTo = false
                    )
                    path.lineTo(left + w, top + h)
                    path.lineTo(left, top + h)
                    path.close()
                    drawPath(path, color, style = style)
                }
                else -> { // Pill
                    val w = r * 1.75f
                    val h = r * 1.25f
                    val left = center.x - w / 2f
                    val top = center.y - h / 2f
                    if (style is Fill) {
                        drawRoundRect(color, topLeft = Offset(left, top), size = Size(w, h), cornerRadius = CornerRadius(h / 2f, h / 2f))
                    } else {
                        drawRoundRect(color, topLeft = Offset(left, top), size = Size(w, h), cornerRadius = CornerRadius(h / 2f, h / 2f), style = style)
                    }
                }
            }
        }

        @Composable
        fun RenderAnalogWidgetContent(widget: WidgetType, displayStyle: String, accentColor: Color) {
            val icon = when (widget) {
                WidgetType.BATTERY -> Icons.Default.BatteryChargingFull
                WidgetType.STEPS -> Icons.Default.DirectionsWalk
                WidgetType.HEART_RATE -> Icons.Default.Favorite
                WidgetType.WEATHER -> Icons.Default.WbSunny
                WidgetType.CALENDAR -> Icons.Default.CalendarToday
            }

            when (displayStyle) {
                "Arc" -> {
                    Box(contentAlignment = Alignment.Center, modifier = Modifier.size(42.dp)) {
                        Canvas(modifier = Modifier.fillMaxSize()) {
                            drawArc(
                                color = accentColor,
                                startAngle = -90f,
                                sweepAngle = 260f,
                                useCenter = false,
                                style = Stroke(width = 2.5.dp.toPx(), cap = StrokeCap.Round)
                            )
                        }
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                    }
                }
                "Icon +" -> {
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Box(modifier = Modifier.size(5.dp).clip(CircleShape).background(accentColor))
                    }
                }
                "Text" -> {
                    Text(widget.defaultText, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                }
                else -> { // Icon + %
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        Icon(icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(16.dp))
                        Text(widget.defaultText, color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }
        EOF

