                                            Text("Steps", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                        }

                                        TextButton(onClick = { }) {
                                            Icon(Icons.Default.Refresh, contentDescription = null, modifier = Modifier.size(16.dp), tint = Color(0xFF2E694E))
                                            Spacer(modifier = Modifier.width(4.dp))
                                            Text("Réinitialiser", fontSize = 11.sp, color = Color(0xFF2E694E))
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(100.dp))
                        }

                        // زر Installer العائم
                        FloatingActionButton(
                            onClick = { },
                            modifier = Modifier.align(Alignment.BottomEnd).padding(20.dp),
                            containerColor = Color(0xFFBBEAC5),
                            contentColor = Color(0xFF0F381E),
                            shape = RoundedCornerShape(22.dp)
                        ) {
