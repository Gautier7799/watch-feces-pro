name: Build Phone App APK Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Clean & Build V16 Touch Drag App
      run: |
        rm -rf app/src/main/java
        rm -rf wear/src/main/java 2>/dev/null || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 16
                versionName = "16.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.net.Uri
        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.gestures.detectDragGestures
        import androidx.compose.foundation.horizontalScroll
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.CornerRadius
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.Path
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.input.pointer.pointerInput
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontFamily
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.IntOffset
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import coil.compose.AsyncImage
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.launch
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.roundToInt
        import kotlin.math.sin

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = darkColorScheme(
                            primary = Color(0xFF98D7A5),
                            secondary = Color(0xFF2E694E),
                            surface = Color(0xFF131814),
                            background = Color(0xFF0C100D)
                        )
                    ) {
                        Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0C100D)) {
                            MasterWatchFaceApp()
                        }
                    }
                }
            }
        }

        @Composable
        fun MasterWatchFaceApp() {
            val context = LocalContext.current
            val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
            val scope = rememberCoroutineScope()
            var currentScreen by remember { mutableStateOf("Constructeur") }

            var isDigital by remember { mutableStateOf(false) }
            var isAod by remember { mutableStateOf(false) }

            var displayStyle by remember { mutableStateOf("Icon + Text") } // Icon + Text vs Text Only

            var selectedBgImageUri by remember { mutableStateOf<Uri?>(null) }
            val photoPickerLauncher = rememberLauncherForActivityResult(
                contract = ActivityResultContracts.GetContent()
            ) { uri: Uri? ->
                selectedBgImageUri = uri
            }

            val colorsList = listOf(
                Color(0xFF0C100D),
                Color(0xFFFFFFFF),
                Color(0xFFE2E3DE),
                Color(0xFF2E694E),
                Color(0xFFFF7043)
            )
            var selectedColorIndex by remember { mutableStateOf(0) }

            var selectedFontFamily by remember { mutableStateOf("System") }
            var selectedBadgeShape by remember { mutableStateOf(0) }

            // مواضع العناصر القابلة للسحب باللمس الحر بجرة إصبع
            var dateDragOffset by remember { mutableStateOf(Offset(0f, -80f)) }
            var batteryDragOffset by remember { mutableStateOf(Offset(-75f, 5f)) }
            var stepsDragOffset by remember { mutableStateOf(Offset(0f, 85f)) }

            ModalNavigationDrawer(
                drawerState = drawerState,
                drawerContent = {
                    ModalDrawerSheet(
                        modifier = Modifier.width(310.dp),
                        drawerContainerColor = Color(0xFF121914),
                        drawerContentColor = Color.White
                    ) {
                        Spacer(modifier = Modifier.height(28.dp))
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Box(
                                modifier = Modifier.size(50.dp).clip(CircleShape).background(Color(0xFF0F2027)),
                                contentAlignment = Alignment.Center
                            ) {
                                Text("W", color = Color(0xFF38EF7D), fontSize = 26.sp, fontWeight = FontWeight.Black)
                            }
                            Spacer(modifier = Modifier.width(16.dp))
                            Text("Watch Face Manager", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Color.White)
                        }
                        HorizontalDivider(modifier = Modifier.padding(vertical = 10.dp), color = Color(0xFF243026))

                        val menuItems = listOf(
                            Pair("Accueil", Icons.Default.Home),
                            Pair("Constructeur", Icons.Default.DashboardCustomize),
                            Pair("Vitrine", Icons.Default.Storefront),
                            Pair("Favoris", Icons.Default.FavoriteBorder),
                            Pair("Top", Icons.Default.EmojiEvents),
                            Pair("Nouveautés", Icons.Default.FiberNew),
                            Pair("Voter", Icons.Default.Poll),
                            Pair("Informations", Icons.Default.Info),
                            Pair("Paramètres", Icons.Default.Settings)
                        )

                        menuItems.forEach { (route, icon) ->
                            val selected = currentScreen == route
                            NavigationDrawerItem(
                                label = { Text(route, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium, color = Color.White) },
                                icon = { Icon(icon, contentDescription = route, tint = if (selected) Color(0xFF98D7A5) else Color(0xFFC2C8BE)) },
                                selected = selected,
                                onClick = {
                                    currentScreen = route
                                    scope.launch { drawerState.close() }
                                },
                                modifier = Modifier.padding(horizontal = 14.dp, vertical = 3.dp),
                                shape = RoundedCornerShape(24.dp),
                                colors = NavigationDrawerItemDefaults.colors(
                                    selectedContainerColor = Color(0xFF25392B),
                                    unselectedContainerColor = Color.Transparent
                                )
                            )
                        }
                    }
                }
            ) {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color.White, modifier = Modifier.size(28.dp))
                            }
                            Text(currentScreen, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.White)
                            IconButton(onClick = {
                                Toast.makeText(context, "Positions et réglages enregistrés! (تم حفظ الأماكن)", Toast.LENGTH_SHORT).show()
                            }) {
                                Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF98D7A5))
                            }
                        }
                    },
                    containerColor = Color(0xFF0C100D)
                ) { innerPadding ->
                    Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                        Column(
                            modifier = Modifier
                                .fillMaxSize()
                                .verticalScroll(rememberScrollState())
                                .padding(horizontal = 16.dp, vertical = 4.dp),
                            horizontalAlignment = Alignment.CenterHorizontally
                        ) {
                            // الشريط العلوي للاختيار بين Numérique و Analogique كما في الصور بدقة
                            Row(
                                modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                horizontalArrangement = Arrangement.SpaceBetween,
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                IconButton(onClick = { photoPickerLauncher.launch("image/*") }) {
                                    Icon(Icons.Default.FolderOpen, contentDescription = "Open", tint = Color(0xFF98D7A5), modifier = Modifier.size(30.dp))
                                }

                                Row(
                                    modifier = Modifier
                                        .clip(RoundedCornerShape(36.dp))
                                        .background(Color(0xFF161E18))
                                        .padding(4.dp),
                                    horizontalArrangement = Arrangement.spacedBy(6.dp)
                                ) {
                                    // زر Numérique الدائري المنسق
                                    Row(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(30.dp))
                                            .background(if (isDigital) Color(0xFF98D7A5) else Color(0xFF1E2820))
                                            .clickable { isDigital = true }
                                            .padding(horizontal = 16.dp, vertical = 10.dp),
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Icon(
                                            Icons.Default.AccessTime,
                                            contentDescription = null,
                                            tint = if (isDigital) Color(0xFF0F381E) else Color.White,
                                            modifier = Modifier.size(20.dp)
                                        )
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text(
                                            "Numérique",
                                            color = if (isDigital) Color(0xFF0F381E) else Color.White,
                                            fontWeight = FontWeight.Bold,
                                            fontSize = 13.sp
                                        )
                                    }

                                    // زر Analogique الدائري المنسق
                                    Row(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(30.dp))
                                            .background(if (!isDigital) Color(0xFF98D7A5) else Color(0xFF1E2820))
                                            .clickable { isDigital = false }
                                            .padding(horizontal = 16.dp, vertical = 10.dp),
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Icon(
                                            Icons.Default.Schedule,
                                            contentDescription = null,
                                            tint = if (!isDigital) Color(0xFF0F381E) else Color.White,
                                            modifier = Modifier.size(20.dp)
                                        )
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text(
                                            "Analogique",
                                            color = if (!isDigital) Color(0xFF0F381E) else Color.White,
                                            fontWeight = FontWeight.Bold,
                                            fontSize = 13.sp
                                        )
                                    }
                                }

                                IconButton(onClick = {
                                    Toast.makeText(context, "Sauvegardé avec succès!", Toast.LENGTH_SHORT).show()
                                }) {
                                    Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF98D7A5), modifier = Modifier.size(30.dp))
                                }
                            }

                            Spacer(modifier = Modifier.height(6.dp))

                            // قرص شاشة الساعة التفاعلية مع دعم السحب باللمس لجميع الرموز
                            Box(
                                modifier = Modifier
                                    .size(310.dp)
                                    .clip(CircleShape)
                                    .background(colorsList[selectedColorIndex])
                                    .border(2.dp, Color(0xFF263228), CircleShape),
                                contentAlignment = Alignment.Center
                            ) {
                                if (selectedBgImageUri != null) {
                                    AsyncImage(
                                        model = selectedBgImageUri,
                                        contentDescription = "Custom Bg",
                                        modifier = Modifier.fillMaxSize().clip(CircleShape),
                                        contentScale = ContentScale.Crop
                                    )
                                }

                                if (isDigital) {
                                    DigitalFaceInteractive(
                                        fontFamily = selectedFontFamily,
                                        displayStyle = displayStyle,
                                        dateOffset = dateDragOffset,
                                        onDateOffsetChange = { dateDragOffset = it },
                                        batteryOffset = batteryDragOffset,
                                        onBatteryOffsetChange = { batteryDragOffset = it },
                                        stepsOffset = stepsDragOffset,
                                        onStepsOffsetChange = { stepsDragOffset = it }
                                    )
                                } else {
                                    AnalogFaceInteractive(
                                        isAod = isAod,
                                        displayStyle = displayStyle,
                                        dateOffset = dateDragOffset,
                                        onDateOffsetChange = { dateDragOffset = it },
                                        batteryOffset = batteryDragOffset,
                                        onBatteryOffsetChange = { batteryDragOffset = it },
                                        stepsOffset = stepsDragOffset,
                                        onStepsOffsetChange = { stepsDragOffset = it }
                                    )
                                }
                            }

                            Spacer(modifier = Modifier.height(10.dp))

                            // أزرار Actif و AOD وإعادة التعيين
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.spacedBy(10.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Button(
                                    onClick = { isAod = false },
                                    modifier = Modifier.weight(1f).height(46.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (!isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                        contentColor = if (!isAod) Color(0xFF0F381E) else Color.White
                                    )
                                ) {
                                    Icon(Icons.Default.Settings, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("Actif", fontWeight = FontWeight.Bold)
                                }

                                Button(
                                    onClick = { isAod = true },
                                    modifier = Modifier.weight(1f).height(46.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (isAod) Color(0xFF98D7A5) else Color(0xFF1B241D),
                                        contentColor = if (isAod) Color(0xFF0F381E) else Color.White
                                    )
                                ) {
                                    Icon(Icons.Default.BrightnessAuto, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("AOD", fontWeight = FontWeight.Bold)
                                }

                                IconButton(
                                    onClick = {
                                        dateDragOffset = Offset(0f, -80f)
                                        batteryDragOffset = Offset(-75f, 5f)
                                        stepsDragOffset = Offset(0f, 85f)
                                        Toast.makeText(context, "Positions remises à zéro", Toast.LENGTH_SHORT).show()
                                    },
                                    modifier = Modifier.size(46.dp).clip(CircleShape).background(Color(0xFF1B241D))
                                ) {
                                    Icon(Icons.Default.Refresh, contentDescription = "Reset", tint = Color.White)
                                }
                            }

                            Spacer(modifier = Modifier.height(14.dp))

                            // قسم Style d'affichage مطابق للصورة تماماً
                            CardBox {
                                Text("Style d'affichage", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(10.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                    listOf("Icon + Text", "Text Only").forEach { style ->
                                        val isSelected = displayStyle == style
                                        Box(
                                            modifier = Modifier
                                                .weight(1f)
                                                .height(44.dp)
                                                .clip(RoundedCornerShape(14.dp))
                                                .background(if (isSelected) Color(0xFF2E694E) else Color(0xFF18221A))
                                                .clickable { displayStyle = style },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            Text(style, fontWeight = FontWeight.Bold, color = Color.White, fontSize = 13.sp)
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(14.dp))

                                // قسم Couleur مطابق للصورة تماماً
                                Text("Couleur", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(8.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                    colorsList.forEachIndexed { index, color ->
                                        val isSelected = selectedColorIndex == index
                                        Box(
                                            modifier = Modifier
                                                .size(46.dp)
                                                .clip(CircleShape)
                                                .background(color)
                                                .border(2.dp, if (isSelected) Color(0xFF98D7A5) else Color(0xFF333E36), CircleShape)
                                                .clickable { selectedColorIndex = index },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            if (isSelected) {
                                                Icon(Icons.Default.Check, contentDescription = null, tint = if (index == 1 || index == 2) Color.Black else Color.White)
                                            }
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(12.dp))

                            // قسم Police مطابق للصورة الأولى
                            CardBox {
                                Text("Police", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(8.dp))
                                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    listOf("System", "Google Sans Flex", "Roboto").forEach { font ->
                                        val isSelected = selectedFontFamily == font
                                        Box(
                                            modifier = Modifier
                                                .weight(1f)
                                                .height(44.dp)
                                                .clip(RoundedCornerShape(16.dp))
                                                .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                .clickable { selectedFontFamily = font },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            Text(
                                                font,
                                                fontWeight = FontWeight.Bold,
                                                fontSize = 12.sp,
                                                color = if (isSelected) Color(0xFF0F381E) else Color.White
                                            )
                                        }
                                    }
                                }

                                Spacer(modifier = Modifier.height(14.dp))

                                // Forme du fond مع أشكال Material You
                                Text("Forme du fond", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(10.dp))
                                Row(
                                    modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                    horizontalArrangement = Arrangement.spacedBy(10.dp)
                                ) {
                                    listOf("-", "Round", "Dome", "Pill", "Squircle").forEachIndexed { index, _ ->
                                        val isSelected = selectedBadgeShape == index
                                        Box(
                                            modifier = Modifier
                                                .size(48.dp)
                                                .clip(RoundedCornerShape(14.dp))
                                                .background(if (isSelected) Color(0xFF98D7A5) else Color(0xFF18221A))
                                                .clickable { selectedBadgeShape = index },
                                            contentAlignment = Alignment.Center
                                        ) {
                                            if (index == 0) {
                                                Text("-", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = if (isSelected) Color(0xFF0F381E) else Color.White)
                                            } else {
                                                ShapeRenderer(shapeIndex = index - 1, color = if (isSelected) Color(0xFF0F381E) else Color.White)
                                            }
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(100.dp))
                        }

                        // زر Installer العائم كما في صورك
                        FloatingActionButton(
                            onClick = {
                                Toast.makeText(context, "Installation...", Toast.LENGTH_SHORT).show()
                            },
                            modifier = Modifier.align(Alignment.BottomEnd).padding(20.dp),
                            containerColor = Color(0xFF2E694E),
                            contentColor = Color.White,
                            shape = RoundedCornerShape(22.dp)
                        ) {
                            Row(
                                modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Icon(Icons.Default.ExitToApp, contentDescription = null)
                                Spacer(modifier = Modifier.width(8.dp))
                                Text("Installer", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun CardBox(content: @Composable ColumnScope.() -> Unit) {
            Card(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(20.dp),
                colors = CardDefaults.cardColors(containerColor = Color(0xFF131A15))
            ) {
                Column(modifier = Modifier.padding(16.dp), content = content)
            }
        }

        // واجهة النمط الرقمي القابلة لسحب التاريخ والبطارية والخطوات باللمس الحر
        @Composable
        fun DigitalFaceInteractive(
            fontFamily: String,
            displayStyle: String,
            dateOffset: Offset,
            onDateOffsetChange: (Offset) -> Unit,
            batteryOffset: Offset,
            onBatteryOffsetChange: (Offset) -> Unit,
            stepsOffset: Offset,
            onStepsOffsetChange: (Offset) -> Unit
        ) {
            var timeString by remember { mutableStateOf("10:08") }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    timeString = String.format("%02d:%02d", cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE))
                    delay(1000)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                // التاريخ قابل للسحب بجرة إصبع كما أشرت بالخط الأحمر
                DraggableItem(
                    offset = dateOffset,
                    onOffsetChange = onDateOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.CalendarToday, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                        }
                        Text("5", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // الوقت الرقمي في المنتصف
                Text(
                    timeString,
                    color = Color.White,
                    fontSize = 52.sp,
                    fontWeight = FontWeight.Bold,
                    fontFamily = when (fontFamily) {
                        "Roboto" -> FontFamily.SansSerif
                        else -> FontFamily.Default
                    }
                )

                // البطارية قابلة للسحب بجرة إصبع
                DraggableItem(
                    offset = batteryOffset,
                    onOffsetChange = onBatteryOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                        }
                        Text("85%", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // الخطوات قابلة للسحب بجرة إصبع
                DraggableItem(
                    offset = stepsOffset,
                    onOffsetChange = onStepsOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.DirectionsWalk, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                        }
                        Text("8,532", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }

        // واجهة النمط العقاربي القابلة لسحب التاريخ والبطارية والخطوات باللمس الحر (مطابقة لصورك تماماً)
        @Composable
        fun AnalogFaceInteractive(
            isAod: Boolean,
            displayStyle: String,
            dateOffset: Offset,
            onDateOffsetChange: (Offset) -> Unit,
            batteryOffset: Offset,
            onBatteryOffsetChange: (Offset) -> Unit,
            stepsOffset: Offset,
            onStepsOffsetChange: (Offset) -> Unit
        ) {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = (s + ms / 1000f) * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f
                    delay(if (isAod) 1000 else 40)
                }
            }

            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                // التاريخ قابل للسحب بجرة إصبع (أيقونة التقويم مع الرقم 5) كما في صورك
                DraggableItem(
                    offset = dateOffset,
                    onOffsetChange = onDateOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.CalendarToday, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                        }
                        Text("5", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // ودجة البطارية القابلة للسحب بجرة إصبع
                DraggableItem(
                    offset = batteryOffset,
                    onOffsetChange = onBatteryOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                        }
                        Text("85%", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // ودجة الخطوات القابلة للسحب بجرة إصبع
                DraggableItem(
                    offset = stepsOffset,
                    onOffsetChange = onStepsOffsetChange
                ) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        if (displayStyle == "Icon + Text") {
                            Icon(Icons.Default.DirectionsWalk, contentDescription = null, tint = Color.White, modifier = Modifier.size(17.dp))
                        }
                        Text("8,532", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    }
                }

                // رسم عقارب الساعة بدقة متناهية
                Canvas(modifier = Modifier.fillMaxSize(0.92f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    // مؤشرات الساعات
                    for (i in 0 until 12) {
                        val rad = Math.toRadians((i * 30.0) - 90.0)
                        val p1 = Offset((center.x + cos(rad) * r * 0.84f).toFloat(), (center.y + sin(rad) * r * 0.84f).toFloat())
                        val p2 = Offset((center.x + cos(rad) * r * 0.98f).toFloat(), (center.y + sin(rad) * r * 0.98f).toFloat())
                        drawLine(
                            color = if (i % 3 == 0) Color.White else Color.White.copy(alpha = 0.5f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    // عقرب الساعات
                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    val hourEnd = Offset((center.x + cos(hourRad) * r * 0.52f).toFloat(), (center.y + sin(hourRad) * r * 0.52f).toFloat())
                    drawLine(Color.White, center, hourEnd, strokeWidth = 6.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(hourRad) * r * 0.44f).toFloat(), (center.y + sin(hourRad) * r * 0.44f).toFloat()), strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round)

                    // عقرب الدقائق
                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    val minEnd = Offset((center.x + cos(minRad) * r * 0.78f).toFloat(), (center.y + sin(minRad) * r * 0.78f).toFloat())
                    drawLine(Color.White, center, minEnd, strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)
                    drawLine(Color(0xFF0F1113), center, Offset((center.x + cos(minRad) * r * 0.70f).toFloat(), (center.y + sin(minRad) * r * 0.70f).toFloat()), strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)

                    // عقرب الثواني الوردي
                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        val secEnd = Offset((center.x + cos(secRad) * r * 0.88f).toFloat(), (center.y + sin(secRad) * r * 0.88f).toFloat())
                        drawLine(Color(0xFFFF80AB), center, secEnd, strokeWidth = 2.dp.toPx(), cap = StrokeCap.Round)
                        drawCircle(Color(0xFFFF80AB), radius = 3.5.dp.toPx(), center = Offset((center.x + cos(secRad) * r * 0.42f).toFloat(), (center.y + sin(secRad) * r * 0.42f).toFloat()))
                    }

                    // المركز
                    drawCircle(Color(0xFFFF80AB), radius = 5.dp.toPx(), center = center)
                    drawCircle(Color.White, radius = 2.5.dp.toPx(), center = center)
                }
            }
        }

        // مكوّن السحب باللمس الفعلي (Draggable Item)
        @Composable
        fun DraggableItem(
            offset: Offset,
            onOffsetChange: (Offset) -> Unit,
            content: @Composable () -> Unit
        ) {
            Box(
                modifier = Modifier
                    .offset { IntOffset(offset.x.roundToInt(), offset.y.roundToInt()) }
                    .pointerInput(Unit) {
                        detectDragGestures { change, dragAmount ->
                            change.consume()
                            val newX = (offset.x + dragAmount.x).coerceIn(-105f, 105f)
                            val newY = (offset.y + dragAmount.y).coerceIn(-110f, 110f)
                            onOffsetChange(Offset(newX, newY))
                        }
                    }
                    .clip(RoundedCornerShape(12.dp))
                    .background(Color.White.copy(alpha = 0.08f))
                    .border(1.dp, Color(0xFF98D7A5).copy(alpha = 0.6f), RoundedCornerShape(12.dp))
                    .padding(horizontal = 8.dp, vertical = 4.dp),
                contentAlignment = Alignment.Center
            ) {
                content()
            }
        }

        @Composable
        fun ShapeRenderer(shapeIndex: Int, color: Color) {
            Canvas(modifier = Modifier.fillMaxSize()) {
                val center = Offset(size.width / 2f, size.height / 2f)
                val r = size.minDimension / 2f
                when (shapeIndex) {
                    0 -> drawRoundRect(color, topLeft = Offset(r * 0.2f, r * 0.2f), size = Size(r * 1.6f, r * 1.6f), cornerRadius = CornerRadius(r * 0.4f, r * 0.4f))
                    1 -> {
                        drawArc(color, 180f, 180f, true, Offset(r * 0.2f, r * 0.1f), Size(r * 1.6f, r * 1.4f))
                        drawRect(color, topLeft = Offset(r * 0.2f, r * 0.8f), size = Size(r * 1.6f, r * 0.9f))
                    }
                    2 -> drawRoundRect(color, topLeft = Offset(r * 0.15f, r * 0.35f), size = Size(r * 1.7f, r * 1.1f), cornerRadius = CornerRadius(r * 0.55f, r * 0.55f))
                    else -> drawCircle(color, radius = r * 0.75f, center = center)
                }
            }
        }
        EOF

