name: Build Phone App APK Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Clean Old Source and Configure Phone App
      run: |
        rm -rf app/src/main/java
        rm -rf wear/src/main/java 2>/dev/null || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 9
                versionName = "9.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.horizontalScroll
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.CornerRadius
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.Path
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.text.font.FontFamily
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.launch
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = lightColorScheme(
                            primary = Color(0xFF1E3A2F),
                            secondary = Color(0xFF2E694E),
                            surface = Color(0xFFF9F9F4),
                            background = Color(0xFFF9F9F4)
                        )
                    ) {
                        ExactPhoneAppScreen()
                    }
                }
            }
        }

        @Composable
        fun ExactPhoneAppScreen() {
            val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
            val scope = rememberCoroutineScope()
            var currentScreen by remember { mutableStateOf("Constructeur") }

            var isDigital by remember { mutableStateOf(false) } // الافتراضي العقاربي كما بآخر صورك
            var isAod by remember { mutableStateOf(false) }

            var selectedFont by remember { mutableStateOf("System") }

            // 0: Squircle, 1: Flower 12, 2: Clover 4, 3: Cookie Pill, 4: Sunburst 8, 5: Dome, 6: Donut
            var selectedBadgeShape by remember { mutableStateOf(0) }
            var badgeOpacity by remember { mutableStateOf(0.85f) }

            val colorsList = listOf(Color.Black, Color(0xFF212529), Color(0xFF495057), Color(0xFF2E694E), Color(0xFFFF7043))
            var selectedColorIndex by remember { mutableStateOf(3) }

            var batteryDisplayStyle by remember { mutableStateOf("Icon + %") }
            var isBatteryExpanded by remember { mutableStateOf(true) }

            ModalNavigationDrawer(
                drawerState = drawerState,
                drawerContent = {
                    ModalDrawerSheet(modifier = Modifier.width(300.dp), drawerContainerColor = Color(0xFFF4F6F0)) {
                        Spacer(modifier = Modifier.height(24.dp))
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Box(
                                modifier = Modifier.size(52.dp).clip(CircleShape).background(Color(0xFF0F2027)),
                                contentAlignment = Alignment.Center
                            ) {
                                Text("W", color = Color(0xFF38EF7D), fontSize = 26.sp, fontWeight = FontWeight.Black)
                            }
                            Spacer(modifier = Modifier.width(16.dp))
                            Text("Watch Face\nManager", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18))
                        }
                        HorizontalDivider(modifier = Modifier.padding(vertical = 12.dp), color = Color(0xFFE0E2DC))

                        listOf("Accueil", "Constructeur", "Vitrine", "Paramètres").forEach { route ->
                            val selected = currentScreen == route
                            NavigationDrawerItem(
                                label = { Text(route, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium) },
                                icon = {
                                    Icon(
                                        when(route) {
                                            "Accueil" -> Icons.Default.Home
                                            "Constructeur" -> Icons.Default.DashboardCustomize
                                            "Vitrine" -> Icons.Default.Storefront
                                            else -> Icons.Default.Settings
                                        },
                                        contentDescription = route
                                    )
                                },
                                selected = selected,
                                onClick = {
                                    currentScreen = route
                                    scope.launch { drawerState.close() }
                                },
                                modifier = Modifier.padding(horizontal = 14.dp, vertical = 4.dp),
                                shape = RoundedCornerShape(24.dp)
                            )
                        }
                    }
                }
            ) {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color(0xFF1A1C18), modifier = Modifier.size(28.dp))
                            }
                            Text(currentScreen, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18))
                            IconButton(onClick = { }) {
                                Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF1A1C18))
                            }
                        }
                    },
                    containerColor = Color(0xFFF7F8F3)
                ) { innerPadding ->
                    Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                        Column(
                            modifier = Modifier
                                .fillMaxSize()
                                .verticalScroll(rememberScrollState())
                                .padding(horizontal = 20.dp, vertical = 6.dp),
                            horizontalAlignment = Alignment.CenterHorizontally
                        ) {
                            // التبديل بين Numérique و Analogique مع الأيقونات والأسلوب الدائري الأنيق
                            Row(
                                modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp),
                                horizontalArrangement = Arrangement.SpaceBetween,
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                IconButton(onClick = { }) {
                                    Icon(Icons.Default.FolderOpen, contentDescription = null, tint = Color(0xFF2E694E))
                                }

                                Row(
                                    modifier = Modifier
                                        .clip(RoundedCornerShape(32.dp))
                                        .background(Color(0xFFE8ECE4))
                                        .padding(4.dp),
                                    horizontalArrangement = Arrangement.spacedBy(4.dp)
                                ) {
                                    Row(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(28.dp))
                                            .background(if (isDigital) Color(0xFF2E694E) else Color.Transparent)
                                            .clickable { isDigital = true }
                                            .padding(horizontal = 14.dp, vertical = 12.dp),
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Icon(Icons.Default.AccessTime, contentDescription = null, tint = if (isDigital) Color.White else Color(0xFF434842))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text("Numérique", color = if (isDigital) Color.White else Color(0xFF434842), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                    }

                                    Row(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(28.dp))
                                            .background(if (!isDigital) Color(0xFF2E694E) else Color.Transparent)
                                            .clickable { isDigital = false }
                                            .padding(horizontal = 14.dp, vertical = 12.dp),
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Icon(Icons.Default.Schedule, contentDescription = null, tint = if (!isDigital) Color.White else Color(0xFF434842))
                                        Spacer(modifier = Modifier.width(6.dp))
                                        Text("Analogique", color = if (!isDigital) Color.White else Color(0xFF434842), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                    }
                                }

                                IconButton(onClick = { }) {
                                    Icon(Icons.Default.Save, contentDescription = null, tint = Color(0xFF2E694E))
                                }
                            }

                            Spacer(modifier = Modifier.height(10.dp))

                            // معاينة شاشة الساعة الحية المتطابقة 100% مع صورك الأخيرة
                            Box(
                                modifier = Modifier
                                    .size(310.dp)
                                    .clip(CircleShape)
                                    .background(Color(0xFF0F1113)),
                                contentAlignment = Alignment.Center
                            ) {
                                if (isDigital) {
                                    Column(
                                        modifier = Modifier.fillMaxSize(),
                                        horizontalAlignment = Alignment.CenterHorizontally,
                                        verticalArrangement = Arrangement.SpaceBetween
                                    ) {
                                        Box(
                                            modifier = Modifier
                                                .padding(top = 28.dp)
                                                .clip(RoundedCornerShape(12.dp))
                                                .background(Color.White.copy(alpha = badgeOpacity * 0.3f))
                                                .padding(horizontal = 14.dp, vertical = 4.dp)
                                        ) {
                                            Text("5 Feb", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                        }

                                        Row(
                                            verticalAlignment = Alignment.CenterVertically,
                                            horizontalArrangement = Arrangement.Center,
                                            modifier = Modifier.padding(horizontal = 16.dp)
                                        ) {
                                            Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(end = 8.dp)) {
                                                Icon(Icons.Default.DirectionsWalk, contentDescription = null, tint = Color.White, modifier = Modifier.size(16.dp))
                                                Text("8,532", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                            }
                                            Text(
                                                "10:08",
                                                color = Color.White,
                                                fontSize = 62.sp,
                                                fontWeight = FontWeight.Bold,
                                                fontFamily = when(selectedFont) {
                                                    "Roboto" -> FontFamily.SansSerif
                                                    "Google Sans Flex" -> FontFamily.Default
                                                    else -> FontFamily.Default
                                                }
                                            )
                                        }

                                        Box(
                                            modifier = Modifier.padding(bottom = 28.dp).size(62.dp),
                                            contentAlignment = Alignment.Center
                                        ) {
                                            MaterialYouBadgeBackground(shapeIndex = selectedBadgeShape, opacity = badgeOpacity)
                                            Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                                Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color.White, modifier = Modifier.size(16.dp))
                                                Text("85%", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                            }
                                        }
                                    }
                                } else {
                                    // النمط العقاربي الفاخر من لقطة شاشتك (عقارب حادة مفرغة ومؤشر الخطوات السفلي ومؤشر البطارية)
                                    AnalogClockMiniPreview(isAod = isAod, badgeShape = selectedBadgeShape, opacity = badgeOpacity)
                                }
                            }

                            Spacer(modifier = Modifier.height(14.dp))

                            // زرا Actif و AOD وزر إعادة التعيين
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.spacedBy(10.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Button(
                                    onClick = { isAod = false },
                                    modifier = Modifier.weight(1f).height(48.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (!isAod) Color(0xFF1E3A2F) else Color(0xFFE4E7DF),
                                        contentColor = if (!isAod) Color.White else Color(0xFF434842)
                                    )
                                ) {
                                    Icon(Icons.Default.Settings, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("Actif", fontWeight = FontWeight.Bold)
                                }

                                Button(
                                    onClick = { isAod = true },
                                    modifier = Modifier.weight(1f).height(48.dp),
                                    shape = RoundedCornerShape(24.dp),
                                    colors = ButtonDefaults.buttonColors(
                                        containerColor = if (isAod) Color(0xFF1E3A2F) else Color(0xFFE4E7DF),
                                        contentColor = if (isAod) Color.White else Color(0xFF434842)
                                    )
                                ) {
                                    Icon(Icons.Default.BrightnessAuto, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("AOD", fontWeight = FontWeight.Bold)
                                }

                                IconButton(
                                    onClick = {
                                        selectedFont = "System"
                                        selectedBadgeShape = 0
                                        badgeOpacity = 0.85f
                                    },
                                    modifier = Modifier.size(48.dp).clip(CircleShape).background(Color(0xFFE4E7DF))
                                ) {
                                    Icon(Icons.Default.Refresh, contentDescription = "Reset", tint = Color(0xFF1A1C18))
                                }
                            }

                            Spacer(modifier = Modifier.height(16.dp))

                            // بطاقة خيارات المظهر: الخطوط وأشكال Material You والشفافية والألوان
                            Card(
                                modifier = Modifier.fillMaxWidth(),
                                shape = RoundedCornerShape(22.dp),
                                colors = CardDefaults.cardColors(containerColor = Color(0xFFEAEFE7))
                            ) {
                                Column(modifier = Modifier.padding(16.dp)) {
                                    // 1. قسم الخطوط (Police)
                                    Text("Police (الخطوط)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF1A1C18))
                                    Spacer(modifier = Modifier.height(8.dp))
                                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                        listOf("System", "Google Sans Flex", "Roboto").forEach { font ->
                                            val isSelected = selectedFont == font
                                            FilterChip(
                                                selected = isSelected,
                                                onClick = { selectedFont = font },
                                                label = { Text(font, fontSize = 12.sp, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal) },
                                                colors = FilterChipDefaults.filterChipColors(
                                                    selectedContainerColor = Color(0xFF1E3A2F),
                                                    selectedLabelColor = Color.White
                                                )
                                            )
                                        }
                                    }

                                    Spacer(modifier = Modifier.height(16.dp))

                                    // 2. أشكال Material You الحقيقية لـ Forme du fond (المحددة بدقة في صورك)
                                    Text("Forme du fond (أشكال المؤشرات Material You)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF1A1C18))
                                    Spacer(modifier = Modifier.height(10.dp))
                                    Row(
                                        modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                        horizontalArrangement = Arrangement.spacedBy(10.dp)
                                    ) {
                                        // الأشكال الـ 7 لـ Material You
                                        val shapes = listOf("Squircle", "Flower12", "Clover4", "Cookie", "Sunburst", "Dome", "Donut")
                                        shapes.forEachIndexed { index, shapeName ->
                                            val isSelected = selectedBadgeShape == index
                                            Box(
                                                modifier = Modifier
                                                    .size(52.dp)
                                                    .clip(RoundedCornerShape(16.dp))
                                                    .background(if (isSelected) Color(0xFF1E3A2F) else Color.White)
                                                    .border(if (isSelected) 2.dp else 0.dp, Color(0xFF2E694E), RoundedCornerShape(16.dp))
                                                    .clickable { selectedBadgeShape = index },
                                                contentAlignment = Alignment.Center
                                            ) {
                                                MaterialYouIconRenderer(
                                                    shapeIndex = index,
                                                    color = if (isSelected) Color.White else Color(0xFF434842)
                                                )
                                            }
                                        }
                                    }

                                    Spacer(modifier = Modifier.height(16.dp))

                                    // 3. سلايدر الشفافية (Opacité du fond) بتصميم Material You العريض
                                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                        Text("Opacité du fond (الشفافية)", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1A1C18))
                                        Text("${(badgeOpacity * 100).toInt()}%", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = Color(0xFF2E694E))
                                    }
                                    Slider(
                                        value = badgeOpacity,
                                        onValueChange = { badgeOpacity = it },
                                        valueRange = 0f..1f,
                                        colors = SliderDefaults.colors(
                                            thumbColor = Color(0xFF2E694E),
                                            activeTrackColor = Color(0xFF2E694E),
                                            inactiveTrackColor = Color(0xFFC7CDC3)
                                        ),
                                        modifier = Modifier.height(28.dp)
                                    )

                                    Spacer(modifier = Modifier.height(14.dp))

                                    // 4. دوائر الألوان لـ Couleur de fond مع علامة الدائرة المكتملة كالصورة
                                    Text("Couleur de fond (الألوان)", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1A1C18))
                                    Spacer(modifier = Modifier.height(8.dp))
                                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                        colorsList.forEachIndexed { index, color ->
                                            val isSelected = selectedColorIndex == index
                                            Box(
                                                modifier = Modifier
                                                    .size(44.dp)
                                                    .clip(CircleShape)
                                                    .background(color)
                                                    .clickable { selectedColorIndex = index }
                                                    .border(if (isSelected) 3.dp else 1.dp, if (isSelected) Color(0xFF2E694E) else Color.LightGray, CircleShape),
                                                contentAlignment = Alignment.Center
                                            ) {
                                                if (isSelected) {
                                                    Icon(Icons.Default.Check, contentDescription = null, tint = Color.White, modifier = Modifier.size(18.dp))
                                                }
                                            }
                                        }
                                    }
                                }
                            }

                            Spacer(modifier = Modifier.height(14.dp))

                            // قسم مؤشرات البطارية والخطوات (Complications)
                            Card(
                                modifier = Modifier.fillMaxWidth(),
                                shape = RoundedCornerShape(22.dp),
                                colors = CardDefaults.cardColors(containerColor = Color(0xFFEAEFE7))
                            ) {
                                Column(modifier = Modifier.padding(16.dp)) {
                                    Row(
                                        modifier = Modifier
                                            .fillMaxWidth()
                                            .clip(RoundedCornerShape(12.dp))
                                            .background(Color.White)
                                            .clickable { isBatteryExpanded = !isBatteryExpanded }
                                            .padding(horizontal = 12.dp, vertical = 8.dp),
                                        verticalAlignment = Alignment.CenterVertically,
                                        horizontalArrangement = Arrangement.SpaceBetween
                                    ) {
                                        Row(verticalAlignment = Alignment.CenterVertically) {
                                            Box(modifier = Modifier.size(24.dp).clip(CircleShape).background(Color(0xFF2E694E)), contentAlignment = Alignment.Center) {
                                                Text("1", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                            }
                                            Spacer(modifier = Modifier.width(8.dp))
                                            Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = Color(0xFF2E694E))
                                            Spacer(modifier = Modifier.width(6.dp))
                                            Text("Battery", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                        }

                                        Row {
                                            Icon(if (isBatteryExpanded) Icons.Default.KeyboardArrowUp else Icons.Default.KeyboardArrowDown, contentDescription = null)
                                            Spacer(modifier = Modifier.width(6.dp))
                                            Icon(Icons.Default.Close, contentDescription = null, tint = Color.Red, modifier = Modifier.size(18.dp))
                                        }
                                    }

                                    if (isBatteryExpanded) {
                                        Spacer(modifier = Modifier.height(10.dp))
                                        Text("Style d'affichage (أسلوب العرض)", fontWeight = FontWeight.SemiBold, fontSize = 13.sp, color = Color(0xFF1A1C18))
                                        Spacer(modifier = Modifier.height(6.dp))
                                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                            listOf("Icon + %", "Arc", "Icon only").forEach { style ->
                                                val isSelected = batteryDisplayStyle == style
                                                FilterChip(
                                                    selected = isSelected,
                                                    onClick = { batteryDisplayStyle = style },
                                                    label = { Text(style, fontSize = 12.sp) },
                                                    colors = FilterChipDefaults.filterChipColors(selectedContainerColor = Color(0xFF2E694E), selectedLabelColor = Color.White)
                                                )
                                            }
                                        }
                                    }

                                    Spacer(modifier = Modifier.height(10.dp))

                                    Row(
                                        modifier = Modifier
                                            .fillMaxWidth()
                                            .clip(RoundedCornerShape(12.dp))
                                            .background(Color.White)
                                            .padding(horizontal = 12.dp, vertical = 8.dp),
