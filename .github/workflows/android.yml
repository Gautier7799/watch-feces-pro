        border = BorderStroke(1.dp, Color(0xFF1F2B21))
    ) {
        Column(modifier = Modifier.padding(14.dp), content = content)
    }
}

// -------------------------------------------------------------
// الشاشات الإضافية (Drawer Screens)
// -------------------------------------------------------------
// 1. شاشة استوديو التأثيرات والأشكال (EffetsScreen)
@Composable
fun EffetsScreen(
    selectedBgImageUri: Uri?,
    selectedBadgeShape: Int,
    onShapeChange: (Int) -> Unit,
    selectedColorIndex: Int,
    onColorChange: (Int) -> Unit,
    intensity: Float,
    onIntensityChange: (Float) -> Unit,
    onBack: () -> Unit,
    onConfirm: () -> Unit
) {
    var subTab by remember { mutableStateOf("Forme") }
    var weatherEffect by remember { mutableStateOf("Soleil") }
    var cinematicDepth by remember { mutableStateOf(true) }

    val paletteColors = listOf(
        Pair("Terracotta", Color(0xFF8D503C)),
        Pair("Taupe", Color(0xFF786D5F)),
        Pair("Bleu ardoise", Color(0xFF5D737E)),
        Pair("Olive", Color(0xFF7E7A4A)),
        Pair("Menthe", Color(0xFF98D7A5)),
        Pair("Noir", Color(0xFF282524))
    )
    val currentBgColor = paletteColors.getOrElse(selectedColorIndex) { paletteColors[0] }.second

    Box(
        modifier = Modifier
            .fillMaxSize()
            .background(currentBgColor.copy(alpha = 0.90f))
            .statusBarsPadding()
    ) {
        Column(modifier = Modifier.fillMaxSize()) {
            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(top = 18.dp, start = 16.dp, end = 16.dp, bottom = 10.dp),
                horizontalArrangement = Arrangement.SpaceBetween,
                verticalAlignment = Alignment.CenterVertically
            ) {
                IconButton(onClick = onBack, modifier = Modifier.size(44.dp)) {
                    Icon(Icons.Default.ArrowBack, contentDescription = "Retour", tint = Color.White, modifier = Modifier.size(28.dp))
                }
                Text("Effets", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                Box(
                    modifier = Modifier
                        .size(48.dp)
                        .clip(CircleShape)
                        .background(Color(0xFFE89B85))
                        .clickable { onConfirm() },
                    contentAlignment = Alignment.Center
                ) {
                    Icon(Icons.Default.Check, contentDescription = "Confirmer", tint = Color(0xFF381E15), modifier = Modifier.size(28.dp))
                }
            }

            Box(modifier = Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                Box(
                    modifier = Modifier
                        .size(280.dp)
                        .clip(CircleShape)
                        .background(Color(0xFF1E1715).copy(alpha = 0.65f)),
                    contentAlignment = Alignment.Center
                ) {
                    Canvas(modifier = Modifier.fillMaxSize(0.85f)) {
                        drawMaterialYouShapeGeometry(shapeIndex = selectedBadgeShape, color = currentBgColor.copy(alpha = intensity), style = Fill)
                        drawMaterialYouShapeGeometry(shapeIndex = selectedBadgeShape, color = Color(0xFFE89B85), style = Stroke(width = 3.dp.toPx()))
                    }
                    Icon(
                        when (subTab) {
                            "Météo" -> Icons.Default.WbSunny
                            "Cinématique" -> Icons.Default.Layers
                            else -> Icons.Default.AutoAwesome
                        },
                        contentDescription = null,
                        tint = Color.White,
                        modifier = Modifier.size(46.dp)
                    )
                }
            }

            Surface(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(topStart = 32.dp, topEnd = 32.dp),
                color = Color(0xFFFFF7F4)
            ) {
                Column(
                    modifier = Modifier
                        .fillMaxWidth()
                        .navigationBarsPadding()
                        .padding(horizontal = 16.dp, vertical = 18.dp),
                    horizontalAlignment = Alignment.CenterHorizontally
                ) {
                    when (subTab) {
                        "Forme" -> {
                            Row(
                                modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(12.dp)
                            ) {
                                val shapeNames = listOf("Cercle", "Squircle", "Dôme", "Trèfle", "Fleur 8", "Hexagone", "Pilule")
                                shapeNames.forEachIndexed { index, _ ->
                                    val isSelected = selectedBadgeShape == index
                                    Box(
                                        modifier = Modifier
                                            .size(62.dp)
                                            .clip(RoundedCornerShape(20.dp))
                                            .background(if (isSelected) Color(0xFFE89B85) else Color(0xFFF6DDD4))
                                            .clickable { onShapeChange(index) },
                                        contentAlignment = Alignment.Center
                                    ) {
                                        Box(modifier = Modifier.size(36.dp)) {
                                            Canvas(modifier = Modifier.fillMaxSize()) {
                                                drawMaterialYouShapeGeometry(
                                                    shapeIndex = index,
                                                    color = if (isSelected) Color(0xFF381E15) else Color(0xFF5E4F4A),
                                                    style = Fill
                                                )
                                            }
                                        }
                                    }
                                }
                            }
                            Spacer(modifier = Modifier.height(16.dp))
                            Row(
                                modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(14.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                paletteColors.forEachIndexed { index, (_, color) ->
                                    val isSelected = selectedColorIndex == index
                                    Box(
                                        modifier = Modifier
                                            .size(52.dp)
                                            .clip(CircleShape)
                                            .then(
                                                if (isSelected) Modifier.border(2.dp, Color(0xFFE89B85), CircleShape).padding(3.dp)
                                                else Modifier
                                            )
                                            .clip(CircleShape)
                                            .background(color)
                                            .clickable { onColorChange(index) }
                                    )
                                }
                            }
                            Spacer(modifier = Modifier.height(16.dp))
                            Slider(
                                value = intensity,
                                onValueChange = onIntensityChange,
                                valueRange = 0.1f..1f,
                                colors = SliderDefaults.colors(thumbColor = Color(0xFFE89B85), activeTrackColor = Color(0xFF8D503C), inactiveTrackColor = Color(0xFFFBE4DC)),
                                modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp)
                            )
                        }
                        "Météo" -> {
                            Text("Effets météo ambiants", fontWeight = FontWeight.Bold, color = Color(0xFF381E15), fontSize = 15.sp)
                            Spacer(modifier = Modifier.height(12.dp))
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                listOf(Pair("Soleil", Icons.Default.WbSunny), Pair("Nuage", Icons.Default.Cloud), Pair("Pluie", Icons.Default.WaterDrop), Pair("Neige", Icons.Default.AcUnit)).forEach { (name, icon) ->
                                    val isSel = weatherEffect == name
                                    Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.clickable { weatherEffect = name }) {
                                        Box(
                                            modifier = Modifier.size(56.dp).clip(CircleShape).background(if (isSel) Color(0xFFE89B85) else Color(0xFFF6DDD4)),
                                            contentAlignment = Alignment.Center
                                        ) {
                                            Icon(icon, contentDescription = name, tint = if (isSel) Color(0xFF381E15) else Color(0xFF5E4F4A))
                                        }
                                        Spacer(modifier = Modifier.height(4.dp))
                                        Text(name, fontSize = 12.sp, color = Color(0xFF381E15))
                                    }
                                }
                            }
                            Spacer(modifier = Modifier.height(18.dp))
                        }
                        "Cinématique" -> {
                            Text("Mode Portrait 3D Cinématique", fontWeight = FontWeight.Bold, color = Color(0xFF381E15), fontSize = 15.sp)
                            Spacer(modifier = Modifier.height(12.dp))
                            Row(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .clip(RoundedCornerShape(16.dp))
                                    .background(Color(0xFFF6DDD4))
                                    .clickable { cinematicDepth = !cinematicDepth }
                                    .padding(16.dp),
                                horizontalArrangement = Arrangement.SpaceBetween,
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Column {
                                    Text("Profondeur de champ (Flou IA)", fontWeight = FontWeight.Bold, color = Color(0xFF381E15))
                                    Text("Sépare le premier plan de l'arrière-plan", fontSize = 11.sp, color = Color(0xFF786D5F))
                                }
                                Switch(checked = cinematicDepth, onCheckedChange = { cinematicDepth = it })
                            }
                            Spacer(modifier = Modifier.height(18.dp))
                        }
                    }

                    Spacer(modifier = Modifier.height(10.dp))
                    Row(
                        modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(26.dp)).background(Color(0xFFF3D9CF)).padding(4.dp),
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        listOf(Pair("Forme", Icons.Default.Category), Pair("Météo", Icons.Default.Cloud), Pair("Cinématique", Icons.Default.Layers)).forEach { (tabName, tabIcon) ->
                            val isSelected = subTab == tabName
                            Box(
                                modifier = Modifier
                                    .weight(1f)
                                    .height(44.dp)
                                    .clip(RoundedCornerShape(22.dp))
                                    .background(if (isSelected) Color(0xFFE89B85) else Color.Transparent)
                                    .clickable { subTab = tabName },
                                contentAlignment = Alignment.Center
                            ) {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    if (isSelected) {
                                        Icon(tabIcon, contentDescription = null, tint = Color(0xFF381E15), modifier = Modifier.size(18.dp))
                                        Spacer(modifier = Modifier.width(6.dp))
                                    }
                                    Text(tabName, fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Medium, color = if (isSelected) Color(0xFF381E15) else Color(0xFF5E4F4A), fontSize = 13.sp)
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// 2. شاشة العقارب والمؤشرات (AiguillesScreen)
@Composable
fun AiguillesScreen(
    selectedHandStyle: HandStyle,
    onHandStyleChange: (HandStyle) -> Unit,
    handColorPalettes: List<Pair<String, Pair<Color, Color>>>,
    selectedHandColorIndex: Int,
    onHandColorChange: (Int) -> Unit,
    selectedIndexStyle: DialIndexStyle,
    onIndexStyleChange: (DialIndexStyle) -> Unit
) {
    Column(
        modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        CardBox {
            Text("Styles d'aiguilles (أنواع العقارب)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(12.dp))
            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                HandStyle.values().forEach { style ->
                    val isSel = selectedHandStyle == style
                    Box(
                        modifier = Modifier
                            .weight(1f)
                            .clip(RoundedCornerShape(14.dp))
                            .background(if (isSel) Color(0xFF2E694E) else Color(0xFF18221A))
                            .border(if (isSel) 2.dp else 1.dp, if (isSel) Color(0xFF98D7A5) else Color.Transparent, RoundedCornerShape(14.dp))
                            .clickable { onHandStyleChange(style) }
                            .padding(vertical = 12.dp),
                        contentAlignment = Alignment.Center
                    ) {
                        Text(style.label, color = Color.White, fontWeight = if (isSel) FontWeight.Bold else FontWeight.Normal, fontSize = 12.sp)
                    }
                }
            }
        }

        CardBox {
            Text("Couleurs des aiguilles (ألوان العقارب)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(12.dp))
            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                handColorPalettes.forEachIndexed { idx, (name, colors) ->
                    val isSel = selectedHandColorIndex == idx
                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .clip(RoundedCornerShape(12.dp))
                            .background(if (isSel) Color(0xFF2E694E) else Color(0xFF18221A))
                            .clickable { onHandColorChange(idx) }
                            .padding(12.dp),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Box(modifier = Modifier.size(20.dp).clip(CircleShape).background(colors.first))
                            Spacer(modifier = Modifier.width(6.dp))
                            Box(modifier = Modifier.size(20.dp).clip(CircleShape).background(colors.second))
                            Spacer(modifier = Modifier.width(12.dp))
                            Text(name, color = Color.White, fontWeight = FontWeight.Medium)
                        }
                        if (isSel) Icon(Icons.Default.Check, contentDescription = null, tint = Color(0xFF98D7A5))
                    }
                }
            }
        }

        CardBox {
            Text("Indices du cadran (خطوط ونقاط الساعات)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Text("الافتراضي: Sans (بدون خطوط أو نقاط حمراء)", fontSize = 11.sp, color = Color(0xFF98D7A5))
            Spacer(modifier = Modifier.height(12.dp))
            Row(modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                DialIndexStyle.values().forEach { style ->
                    val isSel = selectedIndexStyle == style
                    Box(
                        modifier = Modifier
                            .clip(RoundedCornerShape(12.dp))
                            .background(if (isSel) Color(0xFF98D7A5) else Color(0xFF18221A))
                            .clickable { onIndexStyleChange(style) }
                            .padding(horizontal = 14.dp, vertical = 10.dp)
                    ) {
                        Text(style.title, color = if (isSel) Color(0xFF0F381E) else Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                    }
                }
            }
        }
    }
}

// 3. شاشة الودجات (ComplicationsScreen)
@Composable
fun ComplicationsScreen(
    activeWidget1: WidgetType?,
    onSelectWidget1: (WidgetType?) -> Unit,
    activeWidget2: WidgetType?,
    onSelectWidget2: (WidgetType?) -> Unit,
    displayStyle: String,
    onDisplayStyleChange: (String) -> Unit,
    dateFormat: String,
    onDateFormatChange: (String) -> Unit,
    onOpenPicker: () -> Unit
) {
    Column(
        modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        CardBox {
            Text("Emplacement 1 (الودجة الأولى)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(10.dp))
            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                Text(activeWidget1?.title ?: "Aucun widget", color = Color.White)
                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    Button(onClick = onOpenPicker, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E694E))) {
                        Text("Changer", color = Color.White)
                    }
                    if (activeWidget1 != null) {
                        IconButton(onClick = { onSelectWidget1(null) }) {
                            Icon(Icons.Default.Delete, contentDescription = "Supprimer", tint = Color(0xFFFF8A80))
                        }
                    }
                }
            }
        }

        CardBox {
            Text("Emplacement 2 (الودجة الثانية)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(10.dp))
            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                Text(activeWidget2?.title ?: "Aucun widget", color = Color.White)
                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    Button(onClick = onOpenPicker, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E694E))) {
                        Text("Changer", color = Color.White)
                    }
                    if (activeWidget2 != null) {
                        IconButton(onClick = { onSelectWidget2(null) }) {
                            Icon(Icons.Default.Delete, contentDescription = "Supprimer", tint = Color(0xFFFF8A80))
                        }
                    }
                }
            }
        }

        CardBox {
            Text("Style d'affichage des complications", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(10.dp))
            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                listOf("Icon + %", "Arc", "Icon +", "Text").forEach { st ->
                    val isSel = displayStyle == st
                    FilterChip(
                        selected = isSel,
                        onClick = { onDisplayStyleChange(st) },
                        label = { Text(st, fontSize = 11.sp) }
                    )
                }
            }
        }
    }
}

// 4. شاشة الحفظ والإعدادات الجاهزة (SauvegardesScreen)
@Composable
fun SauvegardesScreen(
    onLoadPreset: (HandStyle, Int, Int) -> Unit,
    onSaveCurrent: () -> Unit
) {
    Column(
        modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        CardBox {
            Text("Sauvegarder le cadran actuel", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Text("Enregistrez votre configuration personnalisée", fontSize = 12.sp, color = Color.LightGray)
            Spacer(modifier = Modifier.height(12.dp))
            Button(
                onClick = onSaveCurrent,
                modifier = Modifier.fillMaxWidth(),
                colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF98D7A5), contentColor = Color(0xFF0F381E))
            ) {
                Icon(Icons.Default.Save, contentDescription = null)
                Spacer(modifier = Modifier.width(8.dp))
                Text("Sauvegarder maintenant", fontWeight = FontWeight.Bold)
            }
        }

        CardBox {
            Text("Préréglages d'usine Pixel (نماذج جاهزة)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
            Spacer(modifier = Modifier.height(12.dp))
            listOf(
                Triple("Pixel Minimal Clean", HandStyle.MINIMAL, 2),
                Triple("Pixel Analog Corail", HandStyle.PIXEL_PILL, 0),
                Triple("Pixel Sport Actif", HandStyle.SPORT, 3),
                Triple("Classique Obsidian", HandStyle.CLASSIC, 1)
            ).forEach { (name, hand, shape) ->
                Row(
                    modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(Color(0xFF18221A)).padding(12.dp),
                    horizontalArrangement = Arrangement.SpaceBetween,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Column {
                        Text(name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                        Text("Style: ${hand.label}", fontSize = 11.sp, color = Color(0xFF98D7A5))
                    }
                    Button(onClick = { onLoadPreset(hand, 0, shape) }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E694E))) {
                        Text("Appliquer", fontSize = 12.sp)
                    }
                }
                Spacer(modifier = Modifier.height(8.dp))
            }
        }
    }
}

