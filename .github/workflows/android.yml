                                }
                            }

                            Spacer(modifier = Modifier.height(100.dp))
                        }

                        // زر التثبيت العائم
                        FloatingActionButton(
                            onClick = {
                                showInstallDialog = true
                                isInstalling = true
                            },
                            modifier = Modifier.align(Alignment.BottomEnd).padding(20.dp),
                            containerColor = Color(0xFF98D7A5),
                            contentColor = Color(0xFF0F381E),
                            shape = RoundedCornerShape(22.dp)
                        ) {
                            Row(
                                modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                Icon(Icons.Default.Download, contentDescription = null)
                                Spacer(modifier = Modifier.width(8.dp))
                                Text("Installer", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                            }
                        }
                    }
                }
            }

            // نافذة اختيار الودجات عند الضغط على زر Ajouter un widget
            if (showWidgetPickerSheet) {
                AlertDialog(
                    onDismissRequest = { showWidgetPickerSheet = false },
                    title = { Text("Sélectionner un widget", fontWeight = FontWeight.Bold, color = Color.White) },
                    text = {
                        Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                            WidgetType.values().forEach { w ->
                                Row(
                                    modifier = Modifier
                                        .fillMaxWidth()
                                        .clip(RoundedCornerShape(12.dp))
                                        .background(Color(0xFF1E2820))
                                        .clickable {
                                            if (activeWidget1 == null) {
                                                activeWidget1 = w
                                            } else if (activeWidget2 == null && activeWidget1 != w) {
                                                activeWidget2 = w
                                            } else {
                                                activeWidget1 = w
                                            }
                                            showWidgetPickerSheet = false
                                        }
                                        .padding(horizontal = 14.dp, vertical = 10.dp),
                                    verticalAlignment = Alignment.CenterVertically,
                                    horizontalArrangement = Arrangement.SpaceBetween
                                ) {
                                    Text(w.title, color = Color.White, fontWeight = FontWeight.Medium)
                                    Text(w.defaultText, color = Color(0xFF98D7A5), fontSize = 12.sp)
                                }
                            }
                        }
                    },
                    confirmButton = {
                        TextButton(onClick = { showWidgetPickerSheet = false }) {
                            Text("Fermer", color = Color(0xFF98D7A5), fontWeight = FontWeight.Bold)
                        }
                    },
                    containerColor = Color(0xFF131A15)
                )
            }

            // نافذة الحفظ
            if (showSaveDialog) {
                AlertDialog(
                    onDismissRequest = { showSaveDialog = false },
                    title = { Text("Sauvegarde effectuée", fontWeight = FontWeight.Bold, color = Color.White) },
                    text = { Text("Tous vos réglages, styles et emplacements d'icônes ont été enregistrés avec succès.", color = Color(0xFFC2C8BE)) },
                    confirmButton = {
                        Button(
                            onClick = { showSaveDialog = false },
                            colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF98D7A5), contentColor = Color(0xFF0F381E))
                        ) {
                            Text("D'accord", fontWeight = FontWeight.Bold)
                        }
                    },
                    containerColor = Color(0xFF131A15)
                )
            }

            // نافذة التثبيت
            if (showInstallDialog) {
                LaunchedEffect(Unit) {
                    delay(2500)
                    isInstalling = false
                }

                AlertDialog(
                    onDismissRequest = {
                        if (!isInstalling) showInstallDialog = false
                    },
                    title = {
                        Text(
                            if (isInstalling) "Transmission vers la montre..." else "Installation réussie !",
                            fontWeight = FontWeight.Bold,
                            color = Color.White
                        )
                    },
                    text = {
                        Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                            if (isInstalling) {
                                Spacer(modifier = Modifier.height(10.dp))
                                CircularProgressIndicator(color = Color(0xFF98D7A5))
                                Spacer(modifier = Modifier.height(16.dp))
                                Text("Application du cadran sur votre Pixel Watch...", color = Color.LightGray, fontSize = 13.sp)
                            } else {
                                Icon(Icons.Default.CheckCircle, contentDescription = null, tint = Color(0xFF98D7A5), modifier = Modifier.size(52.dp))
                                Spacer(modifier = Modifier.height(12.dp))
                                Text("Le cadran a été appliqué avec succès sur votre montre !", color = Color.White, fontSize = 14.sp)
                            }
                        }
                    },
                    confirmButton = {
                        if (!isInstalling) {
                            Button(
                                onClick = { showInstallDialog = false },
                                colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF98D7A5), contentColor = Color(0xFF0F381E))
                            ) {
                                Text("Terminer", fontWeight = FontWeight.Bold)
                            }
                        }
                    },
                    containerColor = Color(0xFF131A15)
                )
            }
        }

