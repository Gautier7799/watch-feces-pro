        cat << 'EOF' > wear/src/main/java/com/example/wear/WearMainActivity.kt
        package com.example.wear

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.BatteryChargingFull
        import androidx.compose.material.icons.filled.Favorite
        import androidx.compose.material3.Icon
        import androidx.compose.material3.Text
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import kotlinx.coroutines.delay
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class WearMainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    VikingWearWatchScreen()
                }
            }
        }

        @Composable
        fun VikingWearWatchScreen() {
            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }
            var isAod by remember { mutableStateOf(false) }

            val norseRed = Color(0xFFFF3D00)
            val accentPeach = Color(0xFFFF8A65)

            LaunchedEffect(Unit) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val hour = cal.get(Calendar.HOUR)
                    val minute = cal.get(Calendar.MINUTE)
                    val second = cal.get(Calendar.SECOND)
                    val millis = cal.get(Calendar.MILLISECOND)

                    secondAngle = (second + millis / 1000f) * 6f
                    minuteAngle = (minute + second / 60f) * 6f
                    hourAngle = (hour + minute / 60f) * 30f

                    delay(if (isAod) 1000 else 200)
                }
            }

            Box(
                modifier = Modifier
                    .fillMaxSize()
                    .clip(CircleShape)
                    .background(Color.Black)
                    .clickable { isAod = !isAod },
                contentAlignment = Alignment.Center
            ) {
                Canvas(modifier = Modifier.fillMaxSize(0.86f)) {
                    val center = Offset(size.width / 2f, size.height / 2f)
                    val r = size.minDimension / 2f

                    drawCircle(
                        color = if (isAod) Color.DarkGray else norseRed.copy(alpha = 0.5f),
                        radius = r * 0.28f,
                        center = center,
                        style = Stroke(width = 1.5.dp.toPx())
                    )

                    for (i in 0 until 8) {
                        val rad = Math.toRadians((i * 45.0) - 90.0)
                        val endX = (center.x + cos(rad) * (r * 0.88f)).toFloat()
                        val endY = (center.y + sin(rad) * (r * 0.88f)).toFloat()

                        drawLine(
                            color = if (isAod) Color.Gray else norseRed,
                            start = center,
                            end = Offset(endX, endY),
                            strokeWidth = 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    for (i in 0 until 12) {
                        val markRad = Math.toRadians((i * 30.0) - 90.0)
                        val p1 = Offset((center.x + cos(markRad) * (r * 0.92f)).toFloat(), (center.y + sin(markRad) * (r * 0.92f)).toFloat())
                        val p2 = Offset((center.x + cos(markRad) * (r * 1.0f)).toFloat(), (center.y + sin(markRad) * (r * 1.0f)).toFloat())
                        drawLine(
                            color = if (i % 3 == 0) accentPeach else Color.White.copy(alpha = 0.6f),
                            start = p1,
                            end = p2,
                            strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    val hourRad = Math.toRadians((hourAngle - 90.0))
                    drawLine(
                        color = Color.White,
                        start = center,
                        end = Offset((center.x + cos(hourRad) * (r * 0.50f)).toFloat(), (center.y + sin(hourRad) * (r * 0.50f)).toFloat()),
                        strokeWidth = 6.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    val minRad = Math.toRadians((minuteAngle - 90.0))
                    drawLine(
                        color = accentPeach,
                        start = center,
                        end = Offset((center.x + cos(minRad) * (r * 0.76f)).toFloat(), (center.y + sin(minRad) * (r * 0.76f)).toFloat()),
                        strokeWidth = 4.dp.toPx(),
                        cap = StrokeCap.Round
                    )

                    if (!isAod) {
                        val secRad = Math.toRadians((secondAngle - 90.0))
                        drawLine(
                            color = norseRed,
                            start = center,
                            end = Offset((center.x + cos(secRad) * (r * 0.88f)).toFloat(), (center.y + sin(secRad) * (r * 0.88f)).toFloat()),
                            strokeWidth = 2.dp.toPx(),
                            cap = StrokeCap.Round
                        )
                    }

                    drawCircle(color = Color.White, radius = 5.dp.toPx(), center = center)
                    drawCircle(color = Color.Black, radius = 2.dp.toPx(), center = center)
                }

                if (!isAod) {
                    Row(
                        modifier = Modifier.align(Alignment.TopCenter).padding(top = 22.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Icon(Icons.Default.Favorite, contentDescription = null, tint = norseRed, modifier = Modifier.size(13.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Text("76", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }

                    Row(
                        modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 22.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Icon(Icons.Default.BatteryChargingFull, contentDescription = null, tint = accentPeach, modifier = Modifier.size(14.dp))
                        Spacer(modifier = Modifier.width(3.dp))
                        Text("88%", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }
        EOF

    - name: Build Both Debug APKs
      run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk dist/PixelWatch-Phone.apk
        cp wear/build/outputs/apk/debug/*.apk dist/PixelWatch-WearOS.apk

    - name: Upload Both APKs
      uses: actions/upload-artifact@v4
      with:
        name: WatchFaceManager-Complete
        path: dist/*.apk
