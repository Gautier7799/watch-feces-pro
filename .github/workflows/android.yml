name: Build Android & WearOS APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Configure Complete Application
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelWatchPro"
        include(":app", ":wear")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.7.0" apply false
            id("org.jetbrains.kotlin.android") version "2.0.0" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
        }
        EOF

        # ----------------- 1. تطبيق الهاتف المطور (app) -----------------
        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }

        android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.aistudio.pixelwatch.constructor"
                minSdk = 26
                targetSdk = 35
                versionCode = 3
                versionName = "3.0"
            }

            buildFeatures {
                compose = true
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
            implementation(composeBom)
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
            implementation("io.coil-kt:coil-compose:2.7.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <application
                android:label="Watch Face Manager"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/MainActivity.kt
        package com.example

        import android.net.Uri
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.Canvas
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.graphics.nativeCanvas
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.text.font.FontFamily
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import coil.compose.AsyncImage
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.launch
        import java.util.Calendar
        import kotlin.math.cos
        import kotlin.math.sin

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = lightColorScheme(
                            primary = Color(0xFF1E3A2F),
                            secondary = Color(0xFF2E694E),
                            surface = Color(0xFFF9F9F4),
                            background = Color(0xFFF9F9F4)
                        )
                    ) {
                        WatchFaceManagerApp()
                    }
                }
            }
        }

        @Composable
        fun WatchFaceManagerApp() {
            val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
            val scope = rememberCoroutineScope()
            var currentScreen by remember { mutableStateOf("Constructeur") }

            // خيارات التخصيص
            var isAnalog by remember { mutableStateOf(true) }
            var isAod by remember { mutableStateOf(false) }
            var selectedStyle by remember { mutableStateOf("Pixel Chronograph") }
            var selectedHandStyle by remember { mutableStateOf("Skeletal") } // Skeletal, Solid, Neon
            var selectedFont by remember { mutableStateOf("System") }
            var selectedBadgeShape by remember { mutableStateOf("Flower") } // Flower, Circle, Pill
            var badgeOpacity by remember { mutableStateOf(0.9f) }
            var secondHandColor by remember { mutableStateOf(Color(0xFFFF3D00)) }
            var useLightFrame by remember { mutableStateOf(false) }
            var trotteuseSmooth by remember { mutableStateOf(true) }
            var selectedImageUri by remember { mutableStateOf<Uri?>(null) }

            ModalNavigationDrawer(
                drawerState = drawerState,
                drawerContent = {
                    ModalDrawerSheet(modifier = Modifier.width(300.dp), drawerContainerColor = Color(0xFFF4F6F0)) {
                        Spacer(modifier = Modifier.height(24.dp))
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Box(
                                modifier = Modifier.size(54.dp).clip(CircleShape).background(Color(0xFF0F2027)),
                                contentAlignment = Alignment.Center
                            ) {
                                Text("W", color = Color(0xFF38EF7D), fontSize = 28.sp, fontWeight = FontWeight.Black)
                            }
                            Spacer(modifier = Modifier.width(16.dp))
                            Text("Watch Face\nManager", fontSize = 19.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18), lineHeight = 22.sp)
                        }

                        HorizontalDivider(modifier = Modifier.padding(vertical = 12.dp), color = Color(0xFFE0E2DC))

                        val menuItems = listOf(
                            Triple("Accueil", Icons.Default.Home, "Accueil"),
                            Triple("Constructeur", Icons.Default.DashboardCustomize, "Constructeur"),
                            Triple("Vitrine", Icons.Default.PlayCircle, "Vitrine"),
                            Triple("Favoris", Icons.Default.FavoriteBorder, "Favoris"),
                            Triple("Top", Icons.Default.MilitaryTech, "Top"),
                            Triple("Nouveautés", Icons.Default.FiberNew, "Nouveautés"),
                            Triple("Voter", Icons.Default.Poll, "Voter"),
                            Triple("Informations", Icons.Default.Info, "Informations"),
                            Triple("Paramètres", Icons.Default.Settings, "Paramètres")
                        )

                        Column(modifier = Modifier.verticalScroll(rememberScrollState())) {
                            menuItems.forEach { (label, icon, route) ->
                                val selected = currentScreen == route
                                NavigationDrawerItem(
                                    label = { Text(label, fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium, fontSize = 15.sp) },
                                    icon = { Icon(icon, contentDescription = label, modifier = Modifier.size(22.dp)) },
                                    selected = selected,
                                    onClick = {
                                        currentScreen = route
                                        scope.launch { drawerState.close() }
                                    },
                                    modifier = Modifier.padding(horizontal = 14.dp, vertical = 2.dp),
                                    colors = NavigationDrawerItemDefaults.colors(
                                        selectedContainerColor = Color(0xFFD5E8D4),
                                        selectedTextColor = Color(0xFF132F20),
                                        selectedIconColor = Color(0xFF132F20)
                                    ),
                                    shape = RoundedCornerShape(26.dp)
                                )
                            }
                        }
                    }
                }
            ) {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color(0xFF1A1C18), modifier = Modifier.size(28.dp))
                            }
                            Text(currentScreen, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1A1C18))
                            if (currentScreen == "Constructeur") {
                                IconButton(onClick = { /* حفظ */ }) {
                                    Icon(Icons.Default.Save, contentDescription = "Save", tint = Color(0xFF1A1C18))
                                }
                            } else {
                                Spacer(modifier = Modifier.size(48.dp))
                            }
                        }
                    },
                    containerColor = if (useLightFrame) Color(0xFFFBFBFA) else Color(0xFFF7F8F3)
                ) { innerPadding ->
                    Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                        when (currentScreen) {
                            "Paramètres" -> SettingsScreen(
                                useLightFrame = useLightFrame,
                                onToggleLightFrame = { useLightFrame = it }
                            )
                            else -> MasterConstructorScreen(
                                isAnalog = isAnalog,
                                onToggleAnalog = { isAnalog = it },
                                isAod = isAod,
                                onToggleAod = { isAod = it },
                                selectedStyle = selectedStyle,
                                onStyleChange = { selectedStyle = it },
                                selectedHandStyle = selectedHandStyle,
                                onHandStyleChange = { selectedHandStyle = it },
                                selectedFont = selectedFont,
                                onFontChange = { selectedFont = it },
                                selectedBadgeShape = selectedBadgeShape,
                                onBadgeShapeChange = { selectedBadgeShape = it },
                                badgeOpacity = badgeOpacity,
                                onOpacityChange = { badgeOpacity = it },
                                secondHandColor = secondHandColor,
                                onSecondColorChange = { secondHandColor = it },
                                trotteuseSmooth = trotteuseSmooth,
                                onToggleTrotteuse = { trotteuseSmooth = it },
                                selectedImageUri = selectedImageUri,
                                onImageSelected = { selectedImageUri = it }
                            )
                        }
                    }
                }
            }
        }

        @Composable
        fun MasterConstructorScreen(
            isAnalog: Boolean,
            onToggleAnalog: (Boolean) -> Unit,
            isAod: Boolean,
            onToggleAod: (Boolean) -> Unit,
            selectedStyle: String,
            onStyleChange: (String) -> Unit,
            selectedHandStyle: String,
            onHandStyleChange: (String) -> Unit,
            selectedFont: String,
            onFontChange: (String) -> Unit,
            selectedBadgeShape: String,
            onBadgeShapeChange: (String) -> Unit,
            badgeOpacity: Float,
            onOpacityChange: (Float) -> Unit,
            secondHandColor: Color,
            onSecondColorChange: (Color) -> Unit,
            trotteuseSmooth: Boolean,
            onToggleTrotteuse: (Boolean) -> Unit,
            selectedImageUri: Uri?,
            onImageSelected: (Uri?) -> Unit
        ) {
            val photoPicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                onImageSelected(uri)
            }

            var hourAngle by remember { mutableStateOf(0f) }
            var minuteAngle by remember { mutableStateOf(0f) }
            var secondAngle by remember { mutableStateOf(0f) }

            LaunchedEffect(trotteuseSmooth, isAod) {
                while (true) {
                    val cal = Calendar.getInstance()
                    val h = cal.get(Calendar.HOUR)
                    val m = cal.get(Calendar.MINUTE)
                    val s = cal.get(Calendar.SECOND)
                    val ms = cal.get(Calendar.MILLISECOND)

                    secondAngle = if (trotteuseSmooth) (s + ms / 1000f) * 6f else s * 6f
                    minuteAngle = (m + s / 60f) * 6f
                    hourAngle = (h + m / 60f) * 30f

                    delay(if (isAod) 1000 else if (trotteuseSmooth) 40 else 500)
                }
            }

            Box(modifier = Modifier.fillMaxSize()) {
                Column(
                    modifier = Modifier
                        .fillMaxSize()
                        .verticalScroll(rememberScrollState())
                        .padding(horizontal = 20.dp, vertical = 6.dp),
                    horizontalAlignment = Alignment.CenterHorizontally
                ) {
                    // تبويب Numérique و Analogique العريض
                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .height(60.dp)
                            .clip(RoundedCornerShape(30.dp))
                            .background(Color(0xFFE8EBE2))
                            .padding(4.dp),
                        horizontalArrangement = Arrangement.spacedBy(6.dp)
                    ) {
                        Button(
                            onClick = { onToggleAnalog(false) },
                            modifier = Modifier.weight(1f).fillMaxHeight(),
                            shape = RoundedCornerShape(26.dp),
                            colors = ButtonDefaults.buttonColors(
                                containerColor = if (!isAnalog) Color(0xFF1E3A2F) else Color.Transparent,
                                contentColor = if (!isAnalog) Color.White else Color(0xFF434842)
                            )
                        ) {
                            Icon(Icons.Default.Schedule, contentDescription = null, modifier = Modifier.size(18.dp))
                            Spacer(modifier = Modifier.width(8.dp))
                            Text("Numérique", fontWeight = FontWeight.Bold)
                        }

                        Button(
                            onClick = { onToggleAnalog(true) },
                            modifier = Modifier.weight(1f).fillMaxHeight(),
                            shape = RoundedCornerShape(26.dp),
                            colors = ButtonDefaults.buttonColors(
                                containerColor = if (isAnalog) Color(0xFF1E3A2F) else Color.Transparent,
                                contentColor = if (isAnalog) Color.White else Color(0xFF434842)
                            )
                        ) {
                            Icon(Icons.Default.WatchLater, contentDescription = null, modifier = Modifier.size(18.dp))
                            Spacer(modifier = Modifier.width(8.dp))
                            Text("Analogique", fontWeight = FontWeight.Bold)
                        }
                    }

                    Spacer(modifier = Modifier.height(16.dp))

                    // دائرة الساعة الحية (Master Watch Dial Canvas)
                    Box(
                        modifier = Modifier
                            .size(316.dp)
                            .clip(CircleShape)
                            .background(Color(0xFF0C0E10)),
                        contentAlignment = Alignment.Center
                    ) {
                        if (selectedImageUri != null) {
                            AsyncImage(
                                model = selectedImageUri,
                                contentDescription = null,
                                modifier = Modifier.fillMaxSize(),
                                contentScale = ContentScale.Crop
                            )
                            Box(modifier = Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.35f)))
                        }

                        Canvas(modifier = Modifier.fillMaxSize()) {
                            val center = Offset(size.width / 2f, size.height / 2f)
                            val r = size.minDimension / 2f

                            // 1. أقواس الحواف الذكية (Bezel Gauge Arcs)
                            // قوس البطارية (أعلى اليسار)
                            drawArc(
                                color = Color(0xFF5DD996),
                                startAngle = 140f,
                                sweepAngle = 75f * 0.84f,
                                useCenter = false,
                                topLeft = Offset(center.x - r * 0.94f, center.y - r * 0.94f),
                                size = Size(r * 1.88f, r * 1.88f),
                                style = Stroke(width = 5.dp.toPx(), cap = StrokeCap.Round)
                            )
                            // قوس الخطوات (أعلى اليمين)
                            drawArc(
                                color = Color(0xFF64B5F6),
                                startAngle = 325f,
                                sweepAngle = 75f * 0.70f,
                                useCenter = false,
                                topLeft = Offset(center.x - r * 0.94f, center.y - r * 0.94f),
                                size = Size(r * 1.88f, r * 1.88f),
                                style = Stroke(width = 5.dp.toPx(), cap = StrokeCap.Round)
                            )

                            // 2. الدوائر الفرعية (3 Sub-Dials الكرونوغراف الفاخر)
                            if (selectedStyle == "Pixel Chronograph" && isAnalog) {
                                val subRadius = r * 0.23f

                                // الدائرة اليسرى (9 o'clock)
                                val leftSub = Offset(center.x - r * 0.50f, center.y)
                                drawCircle(color = Color(0xFF1B1E22).copy(alpha = badgeOpacity), radius = subRadius, center = leftSub)
                                drawCircle(color = Color(0xFF33383F), radius = subRadius, center = leftSub, style = Stroke(width = 1.dp.toPx()))
                                for (i in 0 until 4) {
                                    val rad = Math.toRadians((i * 90.0) - 90.0)
                                    drawLine(
                                        color = Color.White.copy(alpha = 0.8f),
                                        start = Offset((leftSub.x + cos(rad) * subRadius * 0.68f).toFloat(), (leftSub.y + sin(rad) * subRadius * 0.68f).toFloat()),
                                        end = Offset((leftSub.x + cos(rad) * subRadius * 0.90f).toFloat(), (leftSub.y + sin(rad) * subRadius * 0.90f).toFloat()),
                                        strokeWidth = 1.5.dp.toPx()
                                    )
                                }
                                // عقرب الدائرة اليسرى
                                drawLine(
                                    color = Color.White,
                                    start = leftSub,
                                    end = Offset(leftSub.x, (leftSub.y - subRadius * 0.75f)),
                                    strokeWidth = 2.dp.toPx(),
                                    cap = StrokeCap.Round
                                )
                                drawCircle(color = Color.White, radius = 2.5.dp.toPx(), center = leftSub)

                                // الدائرة اليمنى (3 o'clock)
                                val rightSub = Offset(center.x + r * 0.50f, center.y)
                                drawCircle(color = Color(0xFF1B1E22).copy(alpha = badgeOpacity), radius = subRadius, center = rightSub)
                                drawCircle(color = Color(0xFF33383F), radius = subRadius, center = rightSub, style = Stroke(width = 1.dp.toPx()))
                                for (i in 0 until 4) {
                                    val rad = Math.toRadians((i * 90.0) - 90.0)
                                    drawLine(
                                        color = Color.White.copy(alpha = 0.8f),
                                        start = Offset((rightSub.x + cos(rad) * subRadius * 0.68f).toFloat(), (rightSub.y + sin(rad) * subRadius * 0.68f).toFloat()),
                                        end = Offset((rightSub.x + cos(rad) * subRadius * 0.90f).toFloat(), (rightSub.y + sin(rad) * subRadius * 0.90f).toFloat()),
                                        strokeWidth = 1.5.dp.toPx()
                                    )
                                }
                                // عقرب الدائرة اليمنى
                                drawLine(
                                    color = Color.White,
                                    start = rightSub,
                                    end = Offset((rightSub.x + subRadius * 0.70f), rightSub.y),
                                    strokeWidth = 2.dp.toPx(),
                                    cap = StrokeCap.Round
                                )
                                drawCircle(color = Color.White, radius = 2.5.dp.toPx(), center = rightSub)

                                // الدائرة السفلية (6 o'clock)
                                val bottomSub = Offset(center.x, center.y + r * 0.48f)
                                drawCircle(color = Color(0xFF1B1E22).copy(alpha = badgeOpacity), radius = subRadius, center = bottomSub)
                                drawCircle(color = Color(0xFF33383F), radius = subRadius, center = bottomSub, style = Stroke(width = 1.dp.toPx()))
                                // عقرب الثواني المصغر في الدائرة السفلية
                                val subSecRad = Math.toRadians((secondAngle - 90.0))
                                drawLine(
                                    color = secondHandColor,
                                    start = bottomSub,
                                    end = Offset((bottomSub.x + cos(subSecRad) * subRadius * 0.75f).toFloat(), (bottomSub.y + sin(subSecRad) * subRadius * 0.75f).toFloat()),
                                    strokeWidth = 1.8.dp.toPx(),
                                    cap = StrokeCap.Round
                                )
                                drawCircle(color = Color.White, radius = 2.5.dp.toPx(), center = bottomSub)
                            }

                            // 3. علامات الساعات والأرقام
                            for (i in 0 until 12) {
                                val rad = Math.toRadians((i * 30.0) - 90.0)
                                val p1 = Offset((center.x + cos(rad) * (r * 0.82f)).toFloat(), (center.y + sin(rad) * (r * 0.82f)).toFloat())
                                val p2 = Offset((center.x + cos(rad) * (r * 0.90f)).toFloat(), (center.y + sin(rad) * (r * 0.90f)).toFloat())
                                drawLine(
                                    color = if (i % 3 == 0) Color.White else Color(0xFF8C908A),
                                    start = p1,
                                    end = p2,
                                    strokeWidth = if (i % 3 == 0) 3.5.dp.toPx() else 1.5.dp.toPx(),
                                    cap = StrokeCap.Round
                                )
                            }

                            // 4. عقارب الساعة الرئيسية بموديلات مختلفة (Skeletal / Solid / Modern)
                            if (isAnalog) {
                                val hourRad = Math.toRadians((hourAngle - 90.0))
                                val minRad = Math.toRadians((minuteAngle - 90.0))

                                if (selectedHandStyle == "Skeletal") {
                                    // عقرب الساعات المفرغ (Hollow Skeletal Hand)
                                    drawLine(
                                        color = Color.White,
                                        start = center,
                                        end = Offset((center.x + cos(hourRad) * (r * 0.50f)).toFloat(), (center.y + sin(hourRad) * (r * 0.50f)).toFloat()),
                                        strokeWidth = 6.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )
                                    drawLine(
                                        color = Color(0xFF1B1E22),
                                        start = center,
                                        end = Offset((center.x + cos(hourRad) * (r * 0.44f)).toFloat(), (center.y + sin(hourRad) * (r * 0.44f)).toFloat()),
                                        strokeWidth = 2.5.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )

                                    // عقرب الدقائق المفرغ
                                    drawLine(
                                        color = Color.White,
                                        start = center,
                                        end = Offset((center.x + cos(minRad) * (r * 0.78f)).toFloat(), (center.y + sin(minRad) * (r * 0.78f)).toFloat()),
                                        strokeWidth = 5.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )
                                    drawLine(
                                        color = Color(0xFF1B1E22),
                                        start = center,
                                        end = Offset((center.x + cos(minRad) * (r * 0.72f)).toFloat(), (center.y + sin(minRad) * (r * 0.72f)).toFloat()),
                                        strokeWidth = 2.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )
                                } else {
                                    // عقارب مصمتة
                                    drawLine(
                                        color = Color.White,
                                        start = center,
                                        end = Offset((center.x + cos(hourRad) * (r * 0.52f)).toFloat(), (center.y + sin(hourRad) * (r * 0.52f)).toFloat()),
                                        strokeWidth = 6.5.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )
                                    drawLine(
                                        color = Color(0xFFE2E3DE),
                                        start = center,
                                        end = Offset((center.x + cos(minRad) * (r * 0.80f)).toFloat(), (center.y + sin(minRad) * (r * 0.80f)).toFloat()),
                                        strokeWidth = 4.5.dp.toPx(),
                                        cap = StrokeCap.Round
                                    )
                                }

                                // عقرب الثواني المميز (يختفي في AOD)
                                if (!isAod) {
                                    val secRad = Math.toRadians((secondAngle - 90.0))
